<style>
  :root{--ink:#16181D;--ink2:#4A4F5A;--ink3:#7C828F;--ink4:#AEB4C1;
        --bg:#FBFCFE;--panel:#F3F5F9;--rule:rgba(22,24,29,.10);--thread:#4F46E5;
        --sans:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--serif:'Fraunces',Georgia,serif;}

  html,body{height:100%}

           display:flex;flex-direction:column;padding:22px 12px 16px;overflow-y:auto}
  .bh{display:flex;align-items:center;gap:9px;padding:0 10px 4px}
  .bh .bh-name{font-family:var(--serif);font-weight:500;font-size:16px}
  .bh .bh-core{font-family:var(--mono);font-size:9px;letter-spacing:.26em;color:var(--ink3);text-transform:uppercase}
  .btag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);padding:0 10px 14px}
  .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);
       padding:14px 10px 7px;margin-top:6px;border-bottom:1px solid var(--rule)}
  .nv{display:block;width:100%;text-align:left;background:none;cursor:pointer;
      padding:9px 10px;border-radius:6px;font:inherit;border:1px solid transparent}
  .nv:hover{background:rgba(22,24,29,.05)}
  .nv.on{background:#fff;border-color:var(--rule)}
  .nv-n{font-family:var(--mono);font-size:10px;color:var(--ink4);margin-right:9px}
  .nv.on .nv-n{color:var(--thread)}
  .nv-name{font-family:var(--serif);font-size:15px;font-weight:500}
  .nv-what{display:block;font-size:10.5px;color:var(--ink3);margin:2px 0 0 23px;line-height:1.45}
  .bfoot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--rule);
         font-family:var(--mono);font-size:9.5px;line-height:1.7;color:var(--ink4);letter-spacing:.03em}
  .stage{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{height:46px;flex:none;display:flex;align-items:center;gap:14px;padding:0 20px;
       border-bottom:1px solid var(--rule);background:var(--bg)}
  .bar .dot{width:9px;height:9px;border-radius:50%;background:var(--thread);
            box-shadow:0 0 0 3px rgba(79,70,229,.14),0 0 12px rgba(79,70,229,.5);flex:none}
  .bar .now{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
  .bar .hint{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink4)}
  #frame{flex:1;width:100%;border:none;background:var(--bg)}
  @media (max-width:820px){ .browser{width:200px} .nv-what{display:none} }
</style>

<script id="ilc-docs" type="application/json">{"foundation.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 Cold Light \u2014 Foundation<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n  .page { max-width: 1080px; margin: 0 auto; padding: 72px 40px 120px; }\n\n  .masthead { border-bottom: 1px solid var(--rule-strong); padding-bottom: 36px; margin-bottom: 64px; }\n  .masthead h1 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-44); line-height: 1.1; letter-spacing: -0.01em; margin: 18px 0 14px; }\n  .masthead p  { font-size: var(--fs-17); color: var(--ink-2); max-width: var(--measure); }\n\n  .section { margin-bottom: 88px; }\n  .section > .eyebrow { display: block; margin-bottom: 6px; }\n  .section > h2 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-26); margin-bottom: 8px; }\n  .section > .lede { color: var(--ink-2); max-width: var(--measure); margin-bottom: 32px; }\n\n  /* the mark */\n  .mark-row { display: flex; align-items: center; gap: 48px; flex-wrap: wrap; }\n  .mark-tile { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 40px 56px; }\n  .wordmark { display: flex; align-items: baseline; gap: 14px; margin-top: 18px; }\n  .wordmark .wm-name { font-family: var(--font-author); font-weight: 500; font-size: 27px; }\n  .wordmark .wm-core { font-family: var(--font-instrument); font-size: 12px; letter-spacing: 0.30em; color: var(--ink-3); text-transform: uppercase; }\n\n  /* palette */\n  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }\n  .swatch { border: 1px solid var(--rule); border-radius: var(--r-3); overflow: hidden; background: var(--paper-high); }\n  .swatch .sw-chip { height: 64px; }\n  .swatch .sw-meta { padding: 9px 12px 10px; }\n  .swatch .sw-name { font-size: var(--fs-14); font-weight: 500; line-height: 1.35; }\n  .swatch .sw-hex  { font-family: var(--font-instrument); font-size: var(--fs-10); color: var(--ink-3); letter-spacing: 0.04em; }\n\n  /* the spectrum strip */\n  .spectrum { display: flex; align-items: center; gap: 0; margin-top: 26px; border: 1px solid var(--rule); border-radius: var(--r-3); background: var(--paper-high); padding: 26px 30px; }\n  .spectrum .sp-state { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; }\n  .spectrum .sp-swatch { width: 16px; height: 16px; border-radius: 50%; }\n  .spectrum .sp-name { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }\n\n  /* voices */\n  .voice-row { display: grid; grid-template-columns: 190px 1fr; gap: 28px; padding: 26px 0; border-top: 1px solid var(--rule); align-items: baseline; }\n  .voice-row:last-child { border-bottom: 1px solid var(--rule); }\n  .voice-who .vw-name { font-weight: 600; font-size: var(--fs-14); }\n  .voice-who .vw-face { font-family: var(--font-instrument); font-size: var(--fs-11); color: var(--ink-3); letter-spacing: 0.04em; margin-top: 2px; }\n  .voice-who .vw-role { font-size: var(--fs-12); color: var(--ink-3); margin-top: 6px; line-height: 1.5; }\n  .spec-author { font-family: var(--font-author); font-size: 24px; line-height: 1.5; font-weight: 400; }\n  .spec-interface { font-size: var(--fs-15); line-height: 1.7; max-width: var(--measure); }\n  .spec-instrument { font-family: var(--font-instrument); font-size: var(--fs-12); line-height: 1.8; color: var(--ink-2); }\n\n  /* the fiber figure */\n  .fiber-tile { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 20px 26px 6px; }\n  .fiber-tile svg { display: block; width: 100%; height: 170px; }\n  .fiber-tile .ht-label { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; fill: var(--ink-3); text-transform: uppercase; }\n\n  /* lens + spine demo cards */\n  .thread-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }\n  .thread-card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 28px 30px; }\n  .thread-card h3 { font-size: var(--fs-14); font-weight: 600; margin: 4px 0 4px; }\n  .thread-card .tc-note { font-size: var(--fs-12); color: var(--ink-3); line-height: 1.55; margin-bottom: 22px; max-width: 58ch; }\n\n  .spine-demo { position: relative; padding-left: 46px; }\n  .spine-demo::before { content: \"\"; position: absolute; left: 18px; top: 4px; bottom: 4px; width: 1px; background: var(--rule-strong); }\n  .spine-demo .sd-sec { position: relative; padding: 10px 0 22px; }\n  .spine-demo .sd-sec::before { content: \"\"; position: absolute; left: -32.5px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: var(--paper-high); border: 1.5px solid var(--rule-strong); }\n  .spine-demo .sd-sec.is-here::before { background: var(--st-deep); border-color: var(--st-deep); box-shadow: 0 0 0 3px rgba(79,70,229,0.13), 0 0 12px rgba(79,70,229,0.5); }\n  .spine-demo .sd-label { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n  .spine-demo .sd-sec.is-here .sd-label { color: var(--ink); font-weight: 600; }\n  .spine-demo .sd-body { font-size: var(--fs-14); color: var(--ink-2); margin-top: 3px; }\n\n  /* registers */\n  .reg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }\n  .reg-card { border: 1px solid var(--rule); border-radius: var(--r-3); padding: 26px 26px 30px; min-height: 290px; }\n  .reg-card .rc-tag { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n  .reg-card h3 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 10px 0 8px; }\n  .reg-card p { font-size: var(--fs-14); color: var(--ink-2); }\n  .reg-neutral { background: var(--paper-high); }\n  .reg-air { background: var(--air-tint); }\n  .reg-air .rc-tag { color: var(--air-label); }\n  .reg-air h3 { color: var(--air-head); font-weight: 400; }\n  .reg-air p  { color: var(--air-ink); line-height: 1.85; }\n  .reg-press { background: var(--press-tint); }\n  .reg-press .rc-tag { color: var(--press-label); }\n  .reg-press h3 { color: var(--press-head); font-weight: 600; }\n  .reg-press p  { color: var(--press-ink); line-height: 1.55; }\n  .reg-card .rc-rule { border: none; border-top: 1px solid var(--rule); margin: 14px 0; }\n\n  /* semantics */\n  .sem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }\n  .sem-card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 26px 30px; }\n  .sem-card h3 { font-size: var(--fs-14); font-weight: 600; margin-bottom: 4px; }\n  .sem-card .sm-note { font-size: var(--fs-12); color: var(--ink-3); margin-bottom: 20px; line-height: 1.55; }\n  .handle { font-size: var(--fs-12); color: var(--ink-2); }\n  .handle .h-dir { font-family: var(--font-instrument); color: var(--ink-3); }\n  .gap-box { border: 1px dashed var(--rule-strong); border-radius: var(--r-3); padding: 14px 18px; }\n  .gap-box .gb-title { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; }\n  .gap-box p { font-size: var(--fs-14); color: var(--ink-2); }\n\n  /* motion lab */\n  .lab { display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: start; }\n  .lab-controls { display: flex; flex-direction: column; gap: 8px; }\n  .lab-controls .btn { justify-content: flex-start; }\n  .lab-controls .btn.is-active { border-color: var(--ink); }\n  .lab-stage { position: relative; height: 360px; background: var(--paper-low); border: 1px solid var(--rule); border-radius: var(--r-3); overflow: hidden; }\n  .lab-sheet { position: absolute; inset: 26px; background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 26px 30px; }\n  .lab-sheet .ls-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n  .lab-sheet h4 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 8px 0 6px; }\n  .lab-sheet p { font-size: var(--fs-14); color: var(--ink-2); max-width: 46ch; }\n  .lab-note { grid-column: 1 / -1; font-size: var(--fs-12); color: var(--ink-3); max-width: var(--measure); }\n\n  .lab-stage .seam-l, .lab-stage .seam-r { position: absolute; top: 26px; bottom: 26px; width: calc(50% - 36px); background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 20px 22px; }\n  .lab-stage .seam-l { left: 26px; }\n  .lab-stage .seam-r { right: 26px; }\n  .seam-line { position: absolute; top: 26px; bottom: 26px; left: 50%; width: 1px; background: var(--rule-strong); }\n  @media (prefers-reduced-motion: no-preference) {\n    .seam-run .seam-l { animation: seamL var(--t-slow) var(--ease) both; }\n    .seam-run .seam-r { animation: seamR var(--t-slow) var(--ease) both; }\n    .seam-run .seam-line { animation: seamLine var(--t-slow) var(--ease) both; }\n  }\n  @keyframes seamL { from { transform: translateX(52%); opacity: 0.4; } to { transform: none; opacity: 1; } }\n  @keyframes seamR { from { transform: translateX(-52%); opacity: 0.4; } to { transform: none; opacity: 1; } }\n  @keyframes seamLine { from { transform: scaleY(0); } to { transform: none; } }\n\n  /* the NOT list */\n  .not-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }\n  .not-card { border: 1px solid var(--rule); border-radius: var(--r-3); padding: 16px 18px; background: var(--paper-high); }\n  .not-card .nc-no { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n  .not-card .nc-what { font-size: var(--fs-14); font-weight: 500; margin-top: 4px; }\n  .not-card .nc-why { font-size: var(--fs-12); color: var(--ink-3); margin-top: 3px; line-height: 1.5; }\n\n  @media (max-width: 900px) {\n    .thread-grid, .sem-grid, .reg-grid { grid-template-columns: 1fr; }\n    .lab { grid-template-columns: 1fr; }\n    .voice-row { grid-template-columns: 1fr; gap: 8px; }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n\n  <!-- ================= MASTHEAD ================= -->\n  <header class=\"masthead\">\n    <span class=\"eyebrow\">ILC design system \u00b7 foundation \u00b7 v2 \u2014 cold light<\/span>\n    <h1>Cold Light<\/h1>\n    <p>One field. One fiber of light. Two apertures. Nine rooms.\n       ILC is a serious workspace \u2014 white, cool, exact. One persistent idea holds many\n       states of thought without losing its identity or its history; the interface shows\n       one state at a time, and the light marks where thinking is happening now.<\/p>\n  <\/header>\n\n  <!-- ================= THE MARK ================= -->\n  <section class=\"section\">\n    <span class=\"eyebrow\">01 \u00b7 the mark<\/span>\n    <h2>A line that loops once, and continues<\/h2>\n    <p class=\"lede\">The fiber enters, loops, and leaves the frame uncut \u2014 the loop never\n       closes. Indigo light on white; the same line at every scale.<\/p>\n    <div class=\"mark-row\">\n      <div class=\"mark-tile\">\n        <svg width=\"150\" height=\"54\" viewBox=\"0 0 150 54\" fill=\"none\" aria-label=\"ILC mark\">\n          <path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\"\n                stroke=\"#4F46E5\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n        <\/svg>\n        <div class=\"wordmark\">\n          <span class=\"wm-name\">IdeaLoop<\/span>\n          <span class=\"wm-core\">Core<\/span>\n        <\/div>\n      <\/div>\n      <div class=\"mark-tile\" style=\"background: var(--ink); border-color: var(--ink);\">\n        <svg width=\"150\" height=\"54\" viewBox=\"0 0 150 54\" fill=\"none\" aria-label=\"ILC mark, inverse\">\n          <path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\"\n                stroke=\"#8B8AF0\" stroke-width=\"2.4\" stroke-linecap=\"round\"/>\n        <\/svg>\n        <div class=\"wordmark\">\n          <span class=\"wm-name\" style=\"color: var(--paper-high);\">IdeaLoop<\/span>\n          <span class=\"wm-core\" style=\"color: #8A90A0;\">Core<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= PALETTE ================= -->\n  <section class=\"section\">\n    <span class=\"eyebrow\">02 \u00b7 the field<\/span>\n    <h2>Ice, ink, and one fiber of light<\/h2>\n    <p class=\"lede\">Cool white ground, cool near-black ink, hairline rules. Flat everywhere \u2014\n       the only luminous thing in the product is the thread itself, and it glows only where\n       it is the content.<\/p>\n    <div class=\"swatches\">\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#FBFCFE; border-bottom:1px solid var(--rule);\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Field<\/div><div class=\"sw-hex\">#FBFCFE \u00b7 ground<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#FFFFFF; border-bottom:1px solid var(--rule);\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Sheet<\/div><div class=\"sw-hex\">#FFFFFF \u00b7 cards<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#F1F3F8;\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Well<\/div><div class=\"sw-hex\">#F1F3F8 \u00b7 inputs<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#F3F5F9;\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Rail<\/div><div class=\"sw-hex\">#F3F5F9 \u00b7 chrome<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#16181D;\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Ink<\/div><div class=\"sw-hex\">#16181D \u00b7 voice<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#4A4F5A;\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Ink 2<\/div><div class=\"sw-hex\">#4A4F5A \u00b7 secondary<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#7C828F;\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Ink 3<\/div><div class=\"sw-hex\">#7C828F \u00b7 muted<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#F3F7FE;\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Open Air<\/div><div class=\"sw-hex\">#F3F7FE \u00b7 explore wash<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#F4F3FA;\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Pressure<\/div><div class=\"sw-hex\">#F4F3FA \u00b7 deep wash<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:#2E7D5B;\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Evidence<\/div><div class=\"sw-hex\">#2E7D5B \u00b7 receipts<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:repeating-linear-gradient(90deg,#7C828F 0 6px,transparent 6px 12px); background-color:#FBFCFE;\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">Absence<\/div><div class=\"sw-hex\">dashed gray \u00b7 gaps<\/div><\/div><\/div>\n      <div class=\"swatch\"><div class=\"sw-chip\" style=\"background:linear-gradient(90deg,#A3B4EE,#3D68EE,#4F46E5,#6D5BE8,#7C5CEE,#7C3AED);\"><\/div><div class=\"sw-meta\"><div class=\"sw-name\">The fiber<\/div><div class=\"sw-hex\">state spectrum<\/div><\/div><\/div>\n    <\/div>\n\n    <div class=\"spectrum\">\n      <div class=\"sp-state\"><span class=\"sp-swatch\" style=\"background:#A3B4EE; box-shadow:0 0 10px rgba(163,180,238,0.6);\"><\/span><span class=\"sp-name\">rough<\/span><\/div>\n      <div class=\"sp-state\"><span class=\"sp-swatch\" style=\"background:#3D68EE; box-shadow:0 0 10px rgba(61,104,238,0.5);\"><\/span><span class=\"sp-name\">explore<\/span><\/div>\n      <div class=\"sp-state\"><span class=\"sp-swatch\" style=\"background:#4F46E5; box-shadow:0 0 12px rgba(79,70,229,0.6);\"><\/span><span class=\"sp-name\">deep<\/span><\/div>\n      <div class=\"sp-state\"><span class=\"sp-swatch\" style=\"background:#6D5BE8; box-shadow:0 0 10px rgba(109,91,232,0.5);\"><\/span><span class=\"sp-name\">evolve<\/span><\/div>\n      <div class=\"sp-state\"><span class=\"sp-swatch\" style=\"background:#7C5CEE; box-shadow:0 0 10px rgba(124,92,238,0.5);\"><\/span><span class=\"sp-name\">compare<\/span><\/div>\n      <div class=\"sp-state\"><span class=\"sp-swatch\" style=\"background:#7C3AED; box-shadow:0 0 10px rgba(124,58,237,0.5);\"><\/span><span class=\"sp-name\">brief<\/span><\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= VOICES ================= -->\n  <section class=\"section\">\n    <span class=\"eyebrow\">03 \u00b7 the language<\/span>\n    <h2>Three voices<\/h2>\n    <p class=\"lede\">Who is speaking is always legible from the type alone. The analyst writes\n       in Fraunces. The product speaks in Plex Sans. The machine reports in Plex Mono.<\/p>\n\n    <div class=\"voice-row\">\n      <div class=\"voice-who\">\n        <div class=\"vw-name\">Author<\/div>\n        <div class=\"vw-face\">Fraunces \u00b7 400\u2013600<\/div>\n        <div class=\"vw-role\">Room titles, verdict prose, the bet, the handoff. The analyst speaks.<\/div>\n      <\/div>\n      <div class=\"spec-author\">The evidence doesn't yet support strong demand \u2014 and that is a\n        statement about evidence you can change, not a verdict on reality.<\/div>\n    <\/div>\n\n    <div class=\"voice-row\">\n      <div class=\"voice-who\">\n        <div class=\"vw-name\">Interface<\/div>\n        <div class=\"vw-face\">IBM Plex Sans \u00b7 400\u2013600<\/div>\n        <div class=\"vw-role\">Chrome, body copy, controls. The product speaks.<\/div>\n      <\/div>\n      <div class=\"spec-interface\">Explore widens a rough idea into angles \u2014 no score, no rank,\n        no verdict. Deep pressures one version against real market, monetization, and\n        originality evidence. They're different jobs, not a short version and a long one.<\/div>\n    <\/div>\n\n    <div class=\"voice-row\">\n      <div class=\"voice-who\">\n        <div class=\"vw-name\">Instrument<\/div>\n        <div class=\"vw-face\">IBM Plex Mono \u00b7 400\u2013600<\/div>\n        <div class=\"vw-role\">Receipts, metrics, labels, ledgers. The machine reports.<\/div>\n      <\/div>\n      <div class=\"spec-instrument\">WHAT THIS RESTS ON \u00b7 14 SOURCES<br>\n        github/awesome-selfhosted \u00b7 41.2k \u2605 \u00b7 retrieved jul 26<br>\n        serper: \"invoice ocr saas\" \u00b7 9 qualified of 22 \u00b7 retrieved jul 26<br>\n        NOT IN THE EVIDENCE: repeat-purchase signal, named buyers<\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= THE FIBER ================= -->\n  <section class=\"section\">\n    <span class=\"eyebrow\">04 \u00b7 the main shape<\/span>\n    <h2>One idea, many states \u2014 shown one at a time<\/h2>\n    <p class=\"lede\">The idea is a fiber of light. Diffuse at rough, gathering at explore,\n       focused to a core at deep, interfering at compare, ringed at re-evaluate, sealed at\n       brief. The full spectrum appears together only where it IS the content \u2014 here, on the\n       landing, and in lineage. Inside the workspace, the state lens shows one lit state.<\/p>\n\n    <div class=\"fiber-tile\">\n      <svg viewBox=\"0 0 900 170\" preserveAspectRatio=\"xMidYMid meet\" fill=\"none\">\n        <defs>\n          <linearGradient id=\"fiber2\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n            <stop offset=\"0\" stop-color=\"#A3B4EE\"/><stop offset=\"0.22\" stop-color=\"#3D68EE\"/>\n            <stop offset=\"0.44\" stop-color=\"#4F46E5\"/><stop offset=\"0.66\" stop-color=\"#6D5BE8\"/>\n            <stop offset=\"0.82\" stop-color=\"#7C5CEE\"/><stop offset=\"1\" stop-color=\"#7C3AED\"/>\n          <\/linearGradient>\n          <radialGradient id=\"core2\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\">\n            <stop offset=\"0\" stop-color=\"#FFFFFF\"/><stop offset=\"0.35\" stop-color=\"#7C8CF5\"/>\n            <stop offset=\"1\" stop-color=\"#4F46E5\" stop-opacity=\"0\"/>\n          <\/radialGradient>\n          <filter id=\"soft2\" x=\"-60%\" y=\"-60%\" width=\"220%\" height=\"220%\"><feGaussianBlur stdDeviation=\"4\"/><\/filter>\n          <filter id=\"haze2\" x=\"-80%\" y=\"-80%\" width=\"260%\" height=\"260%\"><feGaussianBlur stdDeviation=\"9\"/><\/filter>\n        <\/defs>\n        <text class=\"ht-label\" x=\"46\" y=\"20\">rough<\/text>\n        <text class=\"ht-label\" x=\"212\" y=\"20\">explore<\/text>\n        <text class=\"ht-label\" x=\"424\" y=\"20\">deep<\/text>\n        <text class=\"ht-label\" x=\"558\" y=\"20\">compare<\/text>\n        <text class=\"ht-label\" x=\"678\" y=\"20\">re-evaluate<\/text>\n        <text class=\"ht-label\" x=\"836\" y=\"20\">brief<\/text>\n        <path d=\"M28 96 C 120 96 170 94 240 90 C 330 84 380 90 444 90 C 520 90 540 90 590 90 C 650 90 680 90 722 90 C 780 90 812 90 850 90\"\n              stroke=\"url(#fiber2)\" stroke-width=\"6\" opacity=\"0.35\" filter=\"url(#soft2)\"/>\n        <path d=\"M28 96 C 120 96 170 94 240 90 C 330 84 380 90 444 90 C 520 90 540 90 590 90 C 650 90 680 90 722 90 C 780 90 812 90 850 90\"\n              stroke=\"url(#fiber2)\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n        <g>\n          <circle cx=\"52\" cy=\"86\" r=\"18\" fill=\"#A3B4EE\" opacity=\"0.18\" filter=\"url(#haze2)\"/>\n          <circle cx=\"70\" cy=\"104\" r=\"12\" fill=\"#A3B4EE\" opacity=\"0.2\" filter=\"url(#haze2)\"/>\n          <path d=\"M36 84 C 52 72 74 76 82 90 M44 110 C 60 118 78 112 88 100\" stroke=\"#A3B4EE\" stroke-width=\"1\" opacity=\"0.55\"/>\n          <circle cx=\"48\" cy=\"92\" r=\"1.6\" fill=\"#8FA4EA\"/><circle cx=\"66\" cy=\"80\" r=\"1.3\" fill=\"#8FA4EA\"/><circle cx=\"78\" cy=\"102\" r=\"1.6\" fill=\"#8FA4EA\"/>\n        <\/g>\n        <g stroke=\"#3D68EE\" fill=\"none\">\n          <path d=\"M150 96 C 190 96 200 64 244 60 C 290 56 310 76 340 84\" stroke-width=\"1\" opacity=\"0.5\"/>\n          <path d=\"M150 96 C 195 96 210 122 252 124 C 296 126 320 106 348 94\" stroke-width=\"1\" opacity=\"0.4\"/>\n          <path d=\"M150 96 C 200 94 230 82 268 78 C 310 74 340 84 368 88\" stroke-width=\"1.3\" opacity=\"0.7\"/>\n        <\/g>\n        <g>\n          <circle cx=\"444\" cy=\"90\" r=\"30\" fill=\"url(#core2)\" opacity=\"0.5\" filter=\"url(#haze2)\"/>\n          <circle cx=\"444\" cy=\"90\" r=\"18\" fill=\"url(#core2)\" opacity=\"0.9\"/>\n          <circle cx=\"444\" cy=\"90\" r=\"4.5\" fill=\"#FFFFFF\"/>\n          <circle cx=\"444\" cy=\"90\" r=\"24\" stroke=\"#4F46E5\" stroke-width=\"0.8\" opacity=\"0.35\"/>\n        <\/g>\n        <g stroke-width=\"1.1\" fill=\"none\">\n          <path d=\"M520 90 C 540 76 560 76 580 90 C 600 104 620 104 640 90\" stroke=\"#6D5BE8\" opacity=\"0.7\"/>\n          <path d=\"M520 90 C 540 104 560 104 580 90 C 600 76 620 76 640 90\" stroke=\"#7C5CEE\" opacity=\"0.55\"/>\n        <\/g>\n        <g>\n          <circle cx=\"722\" cy=\"90\" r=\"15\" stroke=\"#8B5CF6\" stroke-width=\"1\" opacity=\"0.55\"/>\n          <circle cx=\"722\" cy=\"90\" r=\"8\" stroke=\"#8B5CF6\" stroke-width=\"1\" opacity=\"0.8\"/>\n          <circle cx=\"722\" cy=\"90\" r=\"2.5\" fill=\"#8B5CF6\"/>\n        <\/g>\n        <g>\n          <circle cx=\"850\" cy=\"90\" r=\"10\" stroke=\"#7C3AED\" stroke-width=\"1\" opacity=\"0.4\"/>\n          <circle cx=\"850\" cy=\"90\" r=\"5\" fill=\"#7C3AED\"/>\n          <path d=\"M861 90 L 898 90\" stroke=\"#7C3AED\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"1 7\"/>\n        <\/g>\n      <\/svg>\n    <\/div>\n\n    <div class=\"thread-grid\">\n      <div class=\"thread-card\">\n        <span class=\"eyebrow\">the state lens<\/span>\n        <h3>One state in focus<\/h3>\n        <p class=\"tc-note\">Inside the workspace, an idea shows exactly one lit state \u2014 its\n          label the only word. Past states are filled ghost dots, future states hollow; all\n          clickable, none unrolled. The full journey lives in lineage.<\/p>\n        <div style=\"display:flex; flex-direction:column; gap:18px;\">\n          <div class=\"statelens st-explore\">\n            <span class=\"sl-dot past\"><\/span>\n            <span class=\"sl-here\"><span class=\"sl-core\"><\/span><span class=\"sl-label\">explored<\/span><\/span>\n            <span class=\"sl-dot open\"><\/span><span class=\"sl-dot open\"><\/span><span class=\"sl-dot open\"><\/span><span class=\"sl-dot open\"><\/span>\n          <\/div>\n          <div class=\"statelens st-deep\">\n            <span class=\"sl-dot past\"><\/span><span class=\"sl-dot past\"><\/span>\n            <span class=\"sl-here\"><span class=\"sl-core\"><\/span><span class=\"sl-label\">deep<\/span><\/span>\n            <span class=\"sl-dot open\"><\/span><span class=\"sl-dot open\"><\/span><span class=\"sl-dot open\"><\/span>\n          <\/div>\n          <div class=\"statelens st-brief\">\n            <span class=\"sl-dot past\"><\/span><span class=\"sl-dot past\"><\/span><span class=\"sl-dot past\"><\/span>\n            <span class=\"sl-dot past\"><\/span><span class=\"sl-dot past\"><\/span>\n            <span class=\"sl-here\"><span class=\"sl-core\"><\/span><span class=\"sl-label\">brief<\/span><\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"thread-card\">\n        <span class=\"eyebrow\">the spine<\/span>\n        <h3>The page's one lit position<\/h3>\n        <p class=\"tc-note\">Every content page hangs its movements off one hairline. The\n          reading position is the single lit tick \u2014 the thread inside the room.<\/p>\n        <div class=\"spine-demo\">\n          <div class=\"sd-sec\"><div class=\"sd-label\">\u2160 \u00b7 The read<\/div><div class=\"sd-body\">Where the evidence puts this idea.<\/div><\/div>\n          <div class=\"sd-sec is-here\"><div class=\"sd-label\">\u2161 \u00b7 Findings<\/div><div class=\"sd-body\">Four metrics, each with its receipts.<\/div><\/div>\n          <div class=\"sd-sec\"><div class=\"sd-label\">\u2162 \u00b7 The field<\/div><div class=\"sd-body\">Who already stands on this ground.<\/div><\/div>\n          <div class=\"sd-sec\"><div class=\"sd-label\">\u2163 \u00b7 The build<\/div><div class=\"sd-body\">What this takes \u2014 for you.<\/div><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= REGISTERS ================= -->\n  <section class=\"section\">\n    <span class=\"eyebrow\">05 \u00b7 the apertures<\/span>\n    <h2>One field, two registers<\/h2>\n    <p class=\"lede\">Explore and Deep are the same attention at two apertures. On white the\n       shift is a wash and a density: Open Air breathes; Pressure condenses.<\/p>\n    <div class=\"reg-grid\">\n      <div class=\"reg-card reg-air\">\n        <span class=\"rc-tag\">open air \u00b7 explore<\/span>\n        <h3>What could this become?<\/h3>\n        <hr class=\"rc-rule\">\n        <p>Blue-washed ice. Lighter weight, wide leading, wide margins \u2014 the page opens its\n           aperture. Nothing here is ranked.<\/p>\n      <\/div>\n      <div class=\"reg-card reg-neutral\">\n        <span class=\"rc-tag\">neutral \u00b7 desk, shelves<\/span>\n        <h3>Where was I?<\/h3>\n        <hr class=\"rc-rule\">\n        <p>Plain white. The resting register \u2014 calm, even, unhurried. Memory rooms lean\n           toward neither aperture.<\/p>\n      <\/div>\n      <div class=\"reg-card reg-press\">\n        <span class=\"rc-tag\">pressure \u00b7 deep<\/span>\n        <h3>Does this hold?<\/h3>\n        <hr class=\"rc-rule\">\n        <p>Indigo-washed. Heavier ink, tighter leading, denser columns \u2014 the page condenses\n           around one version of the idea.<\/p>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= SEMANTICS ================= -->\n  <section class=\"section\">\n    <span class=\"eyebrow\">06 \u00b7 standing laws, drawn<\/span>\n    <h2>Scores with handles, claims with receipts, absence with weight<\/h2>\n    <div class=\"sem-grid\">\n      <div class=\"sem-card\">\n        <h3>No naked numbers<\/h3>\n        <div class=\"sm-note\">Band color exists only as the dot on the pill. The handle \u2014 what\n          would move it \u2014 travels with every score.<\/div>\n        <div style=\"display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <span class=\"score-pill\"><span class=\"sp-band mid\"><\/span>MD&nbsp;6.0<\/span>\n            <span class=\"handle\"><span class=\"h-dir\">holds at rung 4 \u2014<\/span> a named repeat buyer would move it \u2197<\/span>\n          <\/div>\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <span class=\"score-pill\"><span class=\"sp-band weak\"><\/span>OR&nbsp;2.5<\/span>\n            <span class=\"handle\"><span class=\"h-dir\">capped \u00b7 rungs 3\u20136 unreachable \u2014<\/span> admits on six components, none named yet<\/span>\n          <\/div>\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <span class=\"score-pill\"><span class=\"sp-band\" style=\"background:var(--band-none)\"><\/span>\u2014<\/span>\n            <span class=\"handle\"><span class=\"h-dir\">not yet read \u2014<\/span> a dash, never a fabricated 0.0<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n      <div class=\"sem-card\">\n        <h3>Evidence produces the conclusion<\/h3>\n        <div class=\"sm-note\">The receipt sits inside the claim \u2014 an entity's name is itself the\n          link. Never a bibliography under the verdict.<\/div>\n        <p style=\"font-size:var(--fs-15); max-width:52ch;\">The lane is already served:\n          <span class=\"evidence-link\">Mainline OCR<\/span> and\n          <span class=\"evidence-link\">docparser<\/span> both hold the developer wedge\n          <span class=\"evidence-chip\">github \u00b7 12.4k \u2605<\/span> \u2014 what's unclaimed is the\n          bookkeeping hand-off, and no retrieved actor names it.<\/p>\n        <div style=\"height:16px\"><\/div>\n        <div class=\"gap-box\">\n          <div class=\"gb-title\">What would change this read<\/div>\n          <p>A named mid-market buyer paying for the hand-off step.\n             <span class=\"absence-chip\">not in the evidence<\/span><\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= MOTION ================= -->\n  <section class=\"section\">\n    <span class=\"eyebrow\">07 \u00b7 the grammar<\/span>\n    <h2>Motion is orientation, never judgment<\/h2>\n    <p class=\"lede\">One motion per navigation, direction invariant \u2014 widening opens, pressure\n       settles, the thread slides, compare splits, lineage zooms. Identical for every idea,\n       whatever its numbers. Click to replay.<\/p>\n    <div class=\"lab\">\n      <div class=\"lab-controls\">\n        <button class=\"btn\" data-motion=\"m-pickup\">pick up a thread<\/button>\n        <button class=\"btn\" data-motion=\"m-along-fwd\">along the thread \u2192<\/button>\n        <button class=\"btn\" data-motion=\"m-along-back\">\u2190 back along it<\/button>\n        <button class=\"btn\" data-motion=\"m-widen\">widen \u00b7 enter explore<\/button>\n        <button class=\"btn\" data-motion=\"m-pressure\">pressure \u00b7 enter deep<\/button>\n        <button class=\"btn\" data-motion=\"m-zoom-out\">zoom out \u00b7 lineage<\/button>\n        <button class=\"btn\" data-motion=\"seam\">split \u00b7 compare<\/button>\n      <\/div>\n      <div class=\"lab-stage\" id=\"stage\">\n        <div class=\"lab-sheet\" id=\"sheet\">\n          <span class=\"ls-eyebrow\">the pressure room<\/span>\n          <h4>Does this hold?<\/h4>\n          <p>Same sheet, same field \u2014 only the motion of arrival differs.\n             160\u2013240ms, ease-out, then stillness. Reduced motion collapses\n             every entrance to a crossfade.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"lab-note\">Rules: 160\u2013240ms, one motion per navigation, no choreography chains.\n        Something always survives the cut \u2014 the state lens inside an idea, the rail between\n        global rooms, the idea's title everywhere. Zero-context hard cuts are forbidden.<\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= NOT ================= -->\n  <section class=\"section\">\n    <span class=\"eyebrow\">08 \u00b7 the refusals<\/span>\n    <h2>What this system will not be<\/h2>\n    <div class=\"not-list\">\n      <div class=\"not-card\"><div class=\"nc-no\">not<\/div><div class=\"nc-what\">Warm<\/div><div class=\"nc-why\">ILC is a serious workspace. The only warmth it allows is accuracy.<\/div><\/div>\n      <div class=\"not-card\"><div class=\"nc-no\">not<\/div><div class=\"nc-what\">Dark-mode AI shelf<\/div><div class=\"nc-why\">Navy dashboards and neon glows are flood-camouflage. ILC is daylight.<\/div><\/div>\n      <div class=\"not-card\"><div class=\"nc-no\">not<\/div><div class=\"nc-what\">Glow as decoration<\/div><div class=\"nc-why\">Light appears only where the thread is the content. Everywhere else: flat.<\/div><\/div>\n      <div class=\"not-card\"><div class=\"nc-no\">not<\/div><div class=\"nc-what\">The unrolled journey<\/div><div class=\"nc-why\">All states in one strip on every page is chaos. One state in focus; lineage holds the rest.<\/div><\/div>\n      <div class=\"not-card\"><div class=\"nc-no\">not<\/div><div class=\"nc-what\">Traffic-light scoring<\/div><div class=\"nc-why\">Band color is an 8px dot on a pill. A page of reads is a document, not a signal wall.<\/div><\/div>\n      <div class=\"not-card\"><div class=\"nc-no\">not<\/div><div class=\"nc-what\">Celebration &amp; alarm<\/div><div class=\"nc-why\">Motion and color never perform. Accuracy that happens to be kind.<\/div><\/div>\n    <\/div>\n  <\/section>\n\n<\/div>\n\n<script>\n  const stage = document.getElementById('stage');\n  const buttons = document.querySelectorAll('[data-motion]');\n  const sheetHTML = stage.innerHTML;\n  const MOTIONS = ['m-pickup','m-along-fwd','m-along-back','m-widen','m-pressure','m-zoom-out'];\n\n  buttons.forEach(btn => {\n    btn.addEventListener('click', () => {\n      buttons.forEach(b => b.classList.remove('is-active'));\n      btn.classList.add('is-active');\n      const m = btn.dataset.motion;\n      if (m === 'seam') {\n        stage.classList.remove('seam-run');\n        stage.innerHTML =\n          '<div class=\"seam-l\"><span style=\"font-family:var(--font-instrument);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)\">idea a<\/span>' +\n          '<h4 style=\"font-family:var(--font-author);font-weight:500;font-size:19px;margin:8px 0 6px;\">Invoice hand-off<\/h4>' +\n          '<p style=\"font-size:13px;color:var(--ink-2)\">Two spines run parallel. Rungs connect the same dimension on each side.<\/p><\/div>' +\n          '<div class=\"seam-line\"><\/div>' +\n          '<div class=\"seam-r\"><span style=\"font-family:var(--font-instrument);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)\">idea b<\/span>' +\n          '<h4 style=\"font-family:var(--font-author);font-weight:500;font-size:19px;margin:8px 0 6px;\">Receipt inbox<\/h4>' +\n          '<p style=\"font-size:13px;color:var(--ink-2)\">The connector explains the weight of a difference \u2014 never a cause.<\/p><\/div>';\n        requestAnimationFrame(() => requestAnimationFrame(() => stage.classList.add('seam-run')));\n        return;\n      }\n      stage.classList.remove('seam-run');\n      stage.innerHTML = sheetHTML;\n      const sheet = stage.querySelector('.lab-sheet');\n      MOTIONS.forEach(x => sheet.classList.remove(x));\n      requestAnimationFrame(() => requestAnimationFrame(() => sheet.classList.add(m)));\n    });\n  });\n<\/script>\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "shell.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 The Main Shape \u2014 Shell<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n  /* ============ THE FIELD ============ */\n  body { display: flex; height: 100vh; overflow: hidden; }\n\n  /* ============ THE RAIL (memory is global) ============ */\n  .rail {\n    width: var(--rail-w); flex: none;\n    background: var(--paper-deep);\n    border-right: 1px solid var(--rule);\n    display: flex; flex-direction: column;\n    padding: 20px 12px 16px;\n  }\n  .rail-brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 22px; }\n  .rail-brand svg { flex: none; }\n  .rail-brand .rb-name { font-family: var(--font-author); font-weight: 500; font-size: 17px; letter-spacing: -0.005em; }\n  .rail-nav { display: flex; flex-direction: column; gap: 2px; }\n  .rail-item {\n    display: flex; align-items: center; gap: 11px;\n    font-family: var(--font-interface); font-size: var(--fs-14); font-weight: 500;\n    color: var(--ink-2); background: none; border: none; cursor: pointer;\n    padding: 8px 10px; border-radius: var(--r-2); text-align: left;\n    transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);\n  }\n  .rail-item:hover { background: rgba(22,24,29,0.05); color: var(--ink); }\n  .rail-item.is-active { background: var(--paper-high); color: var(--ink); border: 1px solid var(--rule); padding: 7px 9px; }\n  .rail-item svg { flex: none; stroke: currentColor; }\n  .rail-spacer { flex: 1; }\n  .rail-util { display: flex; flex-direction: column; gap: 1px; padding-top: 12px; border-top: 1px solid var(--rule); }\n  .rail-util .rail-item { font-size: var(--fs-12); font-weight: 400; color: var(--ink-3); padding: 5px 10px; }\n  .rail-util .rail-item:hover { color: var(--ink-2); }\n  .rail-account { display: flex; align-items: center; gap: 9px; padding: 12px 10px 0; }\n  .rail-account .ra-dot {\n    width: 22px; height: 22px; border-radius: 50%; flex: none;\n    background: var(--paper-high); border: 1px solid var(--rule-strong);\n    display: flex; align-items: center; justify-content: center;\n    font-family: var(--font-instrument); font-size: 10px; color: var(--ink-2);\n  }\n  .rail-account .ra-mail { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n  /* ============ MAIN COLUMN ============ */\n  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n\n  .topbar {\n    height: 52px; flex: none;\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 0 28px; border-bottom: 1px solid var(--rule);\n    background: var(--paper);\n  }\n  .topbar .tp-room { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n  .topbar .tp-status { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.06em; color: var(--ink-3); }\n  .topbar .tp-status b { color: var(--ink-2); font-weight: 600; }\n\n  /* ============ THREAD CONTEXT (inside an idea) ============ */\n  .threadctx {\n    flex: none; overflow: hidden;\n    background: var(--paper); border-bottom: 1px solid var(--rule);\n    max-height: 0; opacity: 0;\n    transition: max-height var(--t-move) var(--ease), opacity var(--t-move) var(--ease);\n  }\n  .threadctx.is-open { max-height: 96px; opacity: 1; }\n  .threadctx-inner { display: flex; align-items: center; gap: 28px; padding: 12px 28px 10px; }\n  .threadctx .tc-title { min-width: 0; }\n  .threadctx .tc-title .tt-name { font-family: var(--font-author); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n  .threadctx .tc-title .tt-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; margin-top: 1px; }\n  .threadctx .statelens { flex: none; margin-left: 16px; }\n  .threadctx .tc-journey { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; margin-left: 16px; }\n  .threadctx .tc-close { margin-left: auto; }\n\n  /* ============ THE ROOM (content viewport) ============ */\n  .room-viewport { flex: 1; overflow-y: auto; position: relative; }\n  .room { min-height: 100%; padding: 44px 48px 96px; }\n  .room-inner { max-width: 880px; margin: 0 auto; }\n\n  .room[data-register=\"air\"]   { background: var(--air-tint); }\n  .room[data-register=\"press\"] { background: var(--press-tint); }\n\n  .room-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n  .room-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-34); line-height: 1.2; margin: 10px 0 6px; }\n  .room-lede { font-size: var(--fs-15); color: var(--ink-2); max-width: var(--measure); }\n\n  /* register modulation \u2014 same parts, different aperture */\n  .room[data-register=\"air\"] .room-title { font-weight: 400; letter-spacing: 0.002em; color: #22304E; }\n  .room[data-register=\"air\"] .room-lede { color: var(--air-ink); line-height: 1.85; }\n  .room[data-register=\"air\"] .room-eyebrow { color: #5A6B94; }\n  .room[data-register=\"press\"] .room-title { font-weight: 600; color: #221F3A; }\n  .room[data-register=\"press\"] .room-lede { color: var(--press-ink); line-height: 1.55; }\n  .room[data-register=\"press\"] .room-eyebrow { color: #6E6A92; }\n\n  /* ---------- desk pieces ---------- */\n  .desk-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-top: 36px; }\n  .card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 22px 24px; }\n  .card .c-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n  .card h3 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 8px 0 6px; }\n  .card p { font-size: var(--fs-14); color: var(--ink-2); }\n  .card .c-actions { display: flex; gap: 10px; margin-top: 18px; }\n  .resume-thread { margin: 16px 0 2px; }\n  .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }\n  .door {\n    border: 1px solid var(--rule); border-radius: var(--r-3);\n    padding: 22px 24px 24px; cursor: pointer; text-align: left;\n    transition: border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);\n    background: var(--paper-high); font: inherit;\n  }\n  .door:hover { border-color: var(--rule-strong); transform: translateY(-1px); }\n  .door .d-tag { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; }\n  .door h4 { font-family: var(--font-author); font-size: 19px; font-weight: 500; margin: 9px 0 5px; }\n  .door p { font-size: var(--fs-12); color: var(--ink-3); line-height: 1.55; }\n  .door-air { background: var(--air-tint); }\n  .door-air .d-tag { color: #5A6B94; }\n  .door-air h4 { font-weight: 400; color: #22304E; }\n  .door-press { background: var(--press-tint); }\n  .door-press .d-tag { color: #6E6A92; }\n  .door-press h4 { font-weight: 600; color: #221F3A; }\n\n  /* ---------- explore fan ---------- */\n  .fan-wrap { margin-top: 40px; position: relative; }\n  .fan-svg { display: block; width: 100%; height: 120px; }\n  .fan-svg path { fill: none; stroke: rgba(70, 85, 122, 0.45); stroke-width: 1.2; transition: stroke var(--t-fast) var(--ease), opacity var(--t-fast) var(--ease); }\n  .fan-svg .seed-line { stroke: var(--rule-strong); }\n  .fan-note { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.12em; text-transform: uppercase; color: #5A6B94; text-align: center; margin-top: 4px; }\n  .angles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 10px; }\n  .angle-card { background: rgba(252, 251, 247, 0.8); border: 1px solid rgba(70,85,122,0.2); border-radius: var(--r-3); padding: 20px 22px; transition: opacity var(--t-slow) var(--ease), border-color var(--t-fast) var(--ease); }\n  .angle-card .a-basis { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.14em; text-transform: uppercase; color: #5A6B94; }\n  .angle-card h4 { font-family: var(--font-author); font-weight: 400; font-size: 18px; color: #22304E; margin: 9px 0 7px; }\n  .angle-card p { font-size: var(--fs-12); color: var(--air-ink); line-height: 1.7; }\n  .angle-card .a-actions { display: flex; gap: 8px; margin-top: 16px; }\n  .angle-card .btn { font-size: var(--fs-12); padding: 5px 12px; }\n  .fan-graduating .angle-card { opacity: 0.25; }\n  .fan-graduating .angle-card.is-chosen { opacity: 1; border-color: var(--thread-hair); }\n  .fan-graduating .fan-svg path { opacity: 0.2; }\n  .fan-graduating .fan-svg path.is-chosen { opacity: 1; stroke: var(--thread); stroke-width: 1.8; }\n\n  /* ---------- deep spine ---------- */\n  .deep-spine { position: relative; margin-top: 40px; padding-left: 46px; }\n  .deep-spine::before { content: \"\"; position: absolute; left: 18px; top: 6px; bottom: 6px; width: 1px; background: rgba(74, 70, 120, 0.3); }\n  .mv { position: relative; padding: 0 0 26px; }\n  .mv::before { content: \"\"; position: absolute; left: -32.5px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--press-tint); border: 1.5px solid rgba(74,70,120,0.45); }\n  .mv.is-here::before { background: var(--thread); border-color: var(--thread); }\n  .mv .mv-label { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A92; }\n  .mv.is-here .mv-label { color: var(--ink); font-weight: 600; }\n  .mv .mv-card { background: rgba(252, 251, 247, 0.75); border: 1px solid rgba(74,70,120,0.18); border-radius: var(--r-3); padding: 16px 20px; margin-top: 8px; }\n  .mv .mv-card p { font-size: var(--fs-14); color: var(--press-ink); line-height: 1.6; }\n  .mv .mv-card .v-author { font-size: 17px; color: #221F3A; }\n\n  /* ---------- compare seam ---------- */\n  .seam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; margin-top: 40px; position: relative; }\n  .seam-col { padding: 0 26px; }\n  .seam-col + .seam-col { border-left: 1px solid var(--rule-strong); }\n  .seam-col .sc-name { font-family: var(--font-author); font-weight: 500; font-size: 19px; margin-bottom: 4px; }\n  .seam-col .sc-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 18px; }\n  .rung { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); }\n  .rung .r-dim { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); width: 88px; flex: none; }\n  .rung p { font-size: var(--fs-12); color: var(--ink-2); }\n  @media (prefers-reduced-motion: no-preference) {\n    .room.m-seam .seam-col:first-child { animation: seamL var(--t-slow) var(--ease) both; }\n    .room.m-seam .seam-col:last-child  { animation: seamR var(--t-slow) var(--ease) both; }\n  }\n  @keyframes seamL { from { transform: translateX(24px); opacity: 0.3; } to { transform: none; opacity: 1; } }\n  @keyframes seamR { from { transform: translateX(-24px); opacity: 0.3; } to { transform: none; opacity: 1; } }\n\n  /* ---------- lineage braid ---------- */\n  .braid { margin-top: 36px; background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 30px; overflow-x: auto; }\n  .braid svg { display: block; }\n  .braid text { font-family: var(--font-instrument); font-size: 10px; fill: var(--ink-2); letter-spacing: 0.04em; }\n  .braid .b-dead { opacity: 0.38; }\n\n  /* ---------- brief exit ---------- */\n  .brief-close { margin-top: 44px; position: relative; }\n  .brief-close .v-author-italic { font-size: 21px; color: var(--ink); max-width: 46ch; }\n  .brief-exit-svg { display: block; margin-top: 26px; width: 100%; height: 40px; }\n\n  /* room footer nav hint */\n  .demo-hint { margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--rule); font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; }\n<\/style>\n<\/head>\n<body>\n\n  <!-- ============ RAIL \u2014 memory is global; thinking is per-thread ============ -->\n  <aside class=\"rail\">\n    <div class=\"rail-brand\">\n      <svg width=\"34\" height=\"16\" viewBox=\"0 0 150 54\" fill=\"none\">\n        <path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\"\n              stroke=\"#4F46E5\" stroke-width=\"7\" stroke-linecap=\"round\"/>\n      <\/svg>\n      <span class=\"rb-name\">IdeaLoop<\/span>\n    <\/div>\n    <nav class=\"rail-nav\">\n      <button class=\"rail-item is-active\" data-goto=\"desk\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 10.5 H13.5 M3 10.5 V13 M12 10.5 V13 M4.5 10.5 V6.5 A3 3 0 0 1 10.5 6.5 V10.5\"/><\/svg>\n        The Desk\n      <\/button>\n      <button class=\"rail-item\" data-goto=\"shelves\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 5 H13.5 M1.5 10.5 H13.5 M4 5 V2.5 M8 5 V3.5 M6 10.5 V8 M11 10.5 V8.5\"/><\/svg>\n        The Shelves\n      <\/button>\n    <\/nav>\n    <div class=\"rail-spacer\"><\/div>\n    <div class=\"rail-util\">\n      <button class=\"rail-item\">Settings<\/button>\n      <button class=\"rail-item\">My plan<\/button>\n      <button class=\"rail-item\">Get help<\/button>\n    <\/div>\n    <div class=\"rail-account\">\n      <span class=\"ra-dot\">e<\/span>\n      <span class=\"ra-mail\">emre@idealoopcore.com<\/span>\n    <\/div>\n  <\/aside>\n\n  <!-- ============ MAIN ============ -->\n  <div class=\"main\">\n    <div class=\"topbar\">\n      <span class=\"tp-room\" id=\"tpRoom\">the desk<\/span>\n      <span class=\"tp-status\">beta \u00b7 free \u2014 <b>2 runs<\/b>
