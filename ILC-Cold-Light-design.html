t-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.sp-sec.is-here > .sp-label { color: var(--ink); font-weight: 600; }\n.sp-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 6px 0 4px; }\n\n/* register spine tints \u2014 the current section is lit (a key moment:\n   the spine is the thread inside the room) */\n.spined .sp-sec.is-here::before { box-shadow: 0 0 0 3px rgba(79,70,229,0.13), 0 0 12px rgba(79,70,229,0.45); }\n.room[data-register=\"air\"] .spined::before { background: rgba(70,85,122,0.3); }\n.room[data-register=\"air\"] .spined .sp-sec::before { background: var(--air-tint); border-color: rgba(70,85,122,0.45); }\n.room[data-register=\"air\"] .spined .sp-sec.is-here::before { background: var(--st-explore); border-color: var(--st-explore); box-shadow: 0 0 0 3px rgba(61,104,238,0.13), 0 0 12px rgba(61,104,238,0.5); }\n.room[data-register=\"air\"] .sp-label { color: #5A6B94; }\n.room[data-register=\"press\"] .spined::before { background: rgba(74,70,120,0.3); }\n.room[data-register=\"press\"] .spined .sp-sec::before { background: var(--press-tint); border-color: rgba(74,70,120,0.45); }\n.room[data-register=\"press\"] .spined .sp-sec.is-here::before { background: var(--st-deep); border-color: var(--st-deep); }\n.room[data-register=\"press\"] .sp-label { color: #6E6A92; }\n\n/* ---------- footer ---------- */\n.room-foot { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 20px; }\n.room-foot p { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.06em; color: var(--ink-4); }\n.room-foot a { color: var(--ink-3); }\n\n/* ---------- utility ---------- */\n.stack-8  > * + * { margin-top: 8px; }\n.stack-14 > * + * { margin-top: 14px; }\n.stack-18 > * + * { margin-top: 18px; }\n.row { display: flex; align-items: center; gap: 12px; }\n\n<\/style>\n<style>\n  /* desk-specific */\n  .desk-top { display: grid; grid-template-columns: 1.45fr 1fr; gap: 18px; margin-top: 36px; }\n\n  .resume .threadbar { margin: 14px 0 10px; height: auto; }\n  .resume .c-actions { display: flex; gap: 10px; margin-top: 16px; }\n\n  /* a signal card: the thread is waiting here \u2014 red tick on the edge,\n     marking position/liveness, never judgment */\n  .signal { position: relative; }\n  .signal::before { content: \"\"; position: absolute; left: -1px; top: 18px; bottom: 18px; width: 2px; background: var(--thread); border-radius: 2px; }\n  .signal .sg-what { font-size: var(--fs-14); color: var(--ink-2); margin-top: 8px; }\n  .signal .sg-what em { font-style: normal; font-weight: 600; color: var(--ink); }\n  .signal .sg-actions { display: flex; gap: 8px; margin-top: 14px; }\n  .signal .btn { font-size: var(--fs-12); padding: 5px 12px; }\n\n  .doors { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 14px; }\n  .door {\n    border: 1px solid var(--rule); border-radius: var(--r-3);\n    padding: 22px 24px 24px; cursor: pointer; text-align: left;\n    background: var(--paper-high); font: inherit; text-decoration: none; display: block;\n    transition: border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);\n  }\n  .door:hover { border-color: var(--rule-strong); transform: translateY(-1px); }\n  .door .d-tag { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; }\n  .door h4 { font-family: var(--font-author); font-size: 19px; font-weight: 500; margin: 9px 0 5px; color: var(--ink); }\n  .door p { font-size: var(--fs-12); color: var(--ink-3); line-height: 1.55; }\n  .door-air { background: var(--air-tint); }\n  .door-air .d-tag { color: #5A6B94; }\n  .door-air h4 { font-weight: 400; color: #22304E; }\n  .door-press { background: var(--press-tint); }\n  .door-press .d-tag { color: #6E6A92; }\n  .door-press h4 { font-weight: 600; color: #221F3A; }\n  .door .d-hint { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-4); margin-top: 12px; letter-spacing: 0.04em; }\n\n  /* the board \u2014 a ledger, not a dashboard */\n  .board { margin-top: 14px; background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); overflow: hidden; }\n  .board table { width: 100%; border-collapse: collapse; }\n  .board th {\n    font-family: var(--font-instrument); font-size: var(--fs-10); font-weight: 500;\n    letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);\n    text-align: left; padding: 12px 18px 10px; border-bottom: 1px solid var(--rule);\n  }\n  .board td { padding: 14px 18px; border-bottom: 1px solid var(--rule); vertical-align: middle; font-size: var(--fs-14); }\n  .board tr:last-child td { border-bottom: none; }\n  .board .b-name { font-family: var(--font-author); font-weight: 500; font-size: 16px; }\n  .board .b-name .bn-fam { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); letter-spacing: 0.05em; display: block; margin-top: 2px; }\n  .board .b-state { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }\n  .board .b-read { white-space: nowrap; }\n  .board .b-dash { font-family: var(--font-instrument); color: var(--ink-4); }\n  .board .b-note { font-size: var(--fs-12); color: var(--ink-3); max-width: 26ch; }\n  .board tr.is-dim td { opacity: 0.55; }\n\n  /* activity ledger \u2014 the machine reports */\n  .ledger { margin-top: 14px; }\n  .ledger .lg-row {\n    display: flex; align-items: baseline; gap: 14px;\n    font-family: var(--font-instrument); font-size: var(--fs-12);\n    color: var(--ink-2); padding: 7px 2px; border-bottom: 1px solid var(--rule);\n  }\n  .ledger .lg-row:last-child { border-bottom: none; }\n  .ledger .lg-when { color: var(--ink-4); font-size: var(--fs-10); width: 64px; flex: none; letter-spacing: 0.04em; }\n  .ledger .lg-verb { color: var(--ink); font-weight: 600; width: 84px; flex: none; }\n  .ledger .lg-what { color: var(--ink-2); }\n\n  .sect { margin-top: 52px; }\n  .sect > .room-eyebrow { font-size: var(--fs-10); }\n<\/style>\n<\/head>\n<body>\n\n  <aside class=\"rail\">\n    <div class=\"rail-brand\">\n      <svg width=\"34\" height=\"16\" viewBox=\"0 0 150 54\" fill=\"none\"><path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\" stroke=\"#4F46E5\" stroke-width=\"7\" stroke-linecap=\"round\"/><\/svg>\n      <span class=\"rb-name\">IdeaLoop<\/span>\n    <\/div>\n    <nav class=\"rail-nav\">\n      <a class=\"rail-item is-active\" href=\"#\" data-nav=\"rooms/02-desk.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 10.5 H13.5 M3 10.5 V13 M12 10.5 V13 M4.5 10.5 V6.5 A3 3 0 0 1 10.5 6.5 V10.5\"/><\/svg>\n        The Desk\n      <\/a>\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/03-shelves.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 5 H13.5 M1.5 10.5 H13.5 M4 5 V2.5 M8 5 V3.5 M6 10.5 V8 M11 10.5 V8.5\"/><\/svg>\n        The Shelves\n      <\/a>\n    <\/nav>\n    <div class=\"rail-spacer\"><\/div>\n    <div class=\"rail-util\">\n      <a class=\"rail-item\" href=\"#\">Settings<\/a>\n      <a class=\"rail-item\" href=\"#\">My plan<\/a>\n      <a class=\"rail-item\" href=\"#\">Get help<\/a>\n    <\/div>\n    <div class=\"rail-account\"><span class=\"ra-dot\">e<\/span><span class=\"ra-mail\">emre@idealoopcore.com<\/span><\/div>\n  <\/aside>\n\n  <div class=\"main\">\n    <div class=\"topbar\">\n      <span class=\"tp-room\">the desk<\/span>\n      <span class=\"tp-status\">beta \u00b7 free \u2014 <b>2 runs<\/b> this week \u00b7 refills thu<\/span>\n    <\/div>\n\n    <main class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">the desk<\/span>\n        <h1 class=\"room-title\">Every idea, still in the loop.<\/h1>\n        <p class=\"room-lede\">Four families, one waiting on your move. Memory lives here \u2014\n          thinking happens on a thread.<\/p>\n\n        <!-- continue + needs your move -->\n        <div class=\"desk-top\">\n          <div class=\"card resume\">\n            <span class=\"c-eyebrow\">continue where you left off<\/span>\n            <h3>Invoice hand-off for solo bookkeepers<\/h3>\n            <div class=\"statelens st-explore\" style=\"margin:14px 0 12px;\">\n              <span class=\"sl-dot past\" title=\"captured\"><\/span>\n              <span class=\"sl-here\"><span class=\"sl-core\"><\/span><span class=\"sl-label\">explored<\/span><\/span>\n              <span class=\"sl-dot open\" title=\"deep\"><\/span>\n              <span class=\"sl-dot open\" title=\"evolve\"><\/span>\n              <span class=\"sl-dot open\" title=\"compare\"><\/span>\n              <span class=\"sl-dot open\" title=\"brief\"><\/span>\n            <\/div>\n            <p>Explored six days ago. Three angles open \u2014 the email-native one carries the\n              sharpest disconfirmer. None taken forward yet.<\/p>\n            <div class=\"c-actions\">\n              <a class=\"btn btn-primary\" href=\"#\" data-nav=\"rooms/04-explore.html\">Pick up the thread<\/a>\n              <a class=\"btn btn-quiet\" href=\"#\" data-nav=\"rooms/08-lineage.html\" style=\"font-size:13px;\">See the braid<\/a>\n            <\/div>\n          <\/div>\n\n          <div class=\"card signal\">\n            <span class=\"c-eyebrow\">needs your move \u00b7 evidence watch<\/span>\n            <h3 style=\"font-size:17px;\">The landscape moved<\/h3>\n            <p class=\"sg-what\">Two new actors appeared near the wedge of <em>Receipt inbox<\/em> \u2014\n              one may affect monetization. The idea text is unchanged; only the world moved.<\/p>\n            <div class=\"sg-actions\">\n              <button class=\"btn\">Re-read on new evidence<\/button>\n              <button class=\"btn btn-quiet\">Keep the old read<\/button>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- start -->\n        <div class=\"sect\">\n          <span class=\"room-eyebrow\">start with how you want to think<\/span>\n          <div class=\"doors\">\n            <a class=\"door door-air\" href=\"#\" data-nav=\"rooms/04-explore.html\">\n              <span class=\"d-tag\">explore \u00b7 widen<\/span>\n              <h4>What could this become?<\/h4>\n              <p>A rough idea fans into angles. No score, no rank, no verdict \u2014 the aperture opens.<\/p>\n              <div class=\"d-hint\">1 run \u00b7 ~2 min<\/div>\n            <\/a>\n            <a class=\"door door-press\" href=\"#\" data-nav=\"rooms/05-deep.html\">\n              <span class=\"d-tag\">deep \u00b7 pressure<\/span>\n              <h4>Does this hold?<\/h4>\n              <p>One serious version, held against real market, monetization, and originality evidence.<\/p>\n              <div class=\"d-hint\">1 run \u00b7 ~4 min<\/div>\n            <\/a>\n          <\/div>\n        <\/div>\n\n        <!-- the board -->\n        <div class=\"sect\">\n          <span class=\"room-eyebrow\">the board \u00b7 4 families<\/span>\n          <div class=\"board\">\n            <table>\n              <thead>\n                <tr><th>Idea<\/th><th>State<\/th><th>Read<\/th><th>Binding constraint<\/th><th>Watch<\/th><\/tr>\n              <\/thead>\n              <tbody>\n                <tr>\n                  <td class=\"b-name\">Receipt inbox<span class=\"bn-fam\">\u2442 3 versions \u00b7 lead v3<\/span><\/td>\n                  <td class=\"b-state\">\u2316 deep \u00b7 jul 22<\/td>\n                  <td class=\"b-read\"><span class=\"score-pill\"><span class=\"sp-band mid\"><\/span>5.2<\/span><\/td>\n                  <td class=\"b-note\">Distribution \u2014 the wedge is open but unreached<\/td>\n                  <td class=\"b-state\">quarterly<\/td>\n                <\/tr>\n                <tr>\n                  <td class=\"b-name\">Invoice hand-off for solo bookkeepers<span class=\"bn-fam\">root \u00b7 3 angles open<\/span><\/td>\n                  <td class=\"b-state\">\u25ce explored \u00b7 jul 22<\/td>\n                  <td class=\"b-read\"><span class=\"b-dash\">\u2014<\/span><\/td>\n                  <td class=\"b-note\">Exploration doesn't score \u2014 no verdict to bind<\/td>\n                  <td class=\"b-state\">off<\/td>\n                <\/tr>\n                <tr>\n                  <td class=\"b-name\">Contractor punch-list voice notes<span class=\"bn-fam\">rough \u00b7 captured jul 20<\/span><\/td>\n                  <td class=\"b-state\">\u270e rough<\/td>\n                  <td class=\"b-read\"><span class=\"b-dash\">\u2014<\/span><\/td>\n                  <td class=\"b-note\">Two doors open<\/td>\n                  <td class=\"b-state\">\u2014<\/td>\n                <\/tr>\n                <tr class=\"is-dim\">\n                  <td class=\"b-name\">Meal-plan hand-me-downs<span class=\"bn-fam\">parked jun 30 \u00b7 evidence kept<\/span><\/td>\n                  <td class=\"b-state\">\u2316 deep \u00b7 jun 12<\/td>\n                  <td class=\"b-read\"><span class=\"score-pill\"><span class=\"sp-band low\"><\/span>3.9<\/span><\/td>\n                  <td class=\"b-note\">Trust \u2014 consumer habit unproven<\/td>\n                  <td class=\"b-state\">off<\/td>\n                <\/tr>\n              <\/tbody>\n            <\/table>\n          <\/div>\n        <\/div>\n\n        <!-- activity ledger -->\n        <div class=\"sect\">\n          <span class=\"room-eyebrow\">the ledger \u00b7 what happened<\/span>\n          <div class=\"ledger\">\n            <div class=\"lg-row\"><span class=\"lg-when\">jul 26<\/span><span class=\"lg-verb\">judged<\/span><span class=\"lg-what\">Receipt inbox v3 \u2014 re-read on new evidence \u00b7 5.2, was 5.8<\/span><\/div>\n            <div class=\"lg-row\"><span class=\"lg-when\">jul 22<\/span><span class=\"lg-verb\">explored<\/span><span class=\"lg-what\">Invoice hand-off for solo bookkeepers \u2014 3 angles<\/span><\/div>\n            <div class=\"lg-row\"><span class=\"lg-when\">jul 20<\/span><span class=\"lg-verb\">captured<\/span><span class=\"lg-what\">Contractor punch-list voice notes<\/span><\/div>\n            <div class=\"lg-row\"><span class=\"lg-when\">jul 18<\/span><span class=\"lg-verb\">compared<\/span><span class=\"lg-what\">Receipt inbox v3 \u00d7 Meal-plan hand-me-downs<\/span><\/div>\n            <div class=\"lg-row\"><span class=\"lg-when\">jun 30<\/span><span class=\"lg-verb\">parked<\/span><span class=\"lg-what\">Meal-plan hand-me-downs \u2014 evidence kept, loop open<\/span><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"room-foot\">\n          <p>ILC reads evidence; it doesn't decide. Closure is yours. \u00b7 <a href=\"#\">privacy<\/a> \u00b7 <a href=\"#\">terms<\/a> \u00b7 <a href=\"#\">disclaimer<\/a><\/p>\n          <p>room 2 of 9 \u00b7 neutral register<\/p>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "rooms/03-shelves.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 Room 3 \u2014 The Shelves<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n/* ============================================================\n   ILC \u00b7 Cold Light \u2014 shared room chrome\n   Linked by every room mockup after ../tokens.css.\n   The chrome IS the continuity: rail (global memory),\n   topbar, idea context with the STATE LENS (one state in\n   focus; the journey lives in Lineage).\n   ============================================================ */\n\nbody { display: flex; min-height: 100vh; }\n\n/* ---------- rail ---------- */\n.rail {\n  width: var(--rail-w); flex: none;\n  background: var(--paper-deep);\n  border-right: 1px solid var(--rule);\n  display: flex; flex-direction: column;\n  padding: 20px 12px 16px;\n  position: sticky; top: 0; height: 100vh;\n}\n.rail-brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 22px; }\n.rail-brand .rb-name { font-family: var(--font-author); font-weight: 500; font-size: 17px; }\n.rail-nav { display: flex; flex-direction: column; gap: 2px; }\n.rail-item {\n  display: flex; align-items: center; gap: 11px;\n  font-family: var(--font-interface); font-size: var(--fs-14); font-weight: 500;\n  color: var(--ink-2); background: none; border: none; cursor: pointer;\n  padding: 8px 10px; border-radius: var(--r-2); text-align: left;\n  text-decoration: none;\n}\n.rail-item:hover { background: rgba(22,24,29,0.05); color: var(--ink); }\n.rail-item.is-active { background: var(--paper-high); color: var(--ink); border: 1px solid var(--rule); padding: 7px 9px; }\n.rail-item svg { flex: none; stroke: currentColor; }\n.rail-spacer { flex: 1; }\n.rail-util { display: flex; flex-direction: column; gap: 1px; padding-top: 12px; border-top: 1px solid var(--rule); }\n.rail-util .rail-item { font-size: var(--fs-12); font-weight: 400; color: var(--ink-3); padding: 5px 10px; }\n.rail-account { display: flex; align-items: center; gap: 9px; padding: 12px 10px 0; }\n.rail-account .ra-dot {\n  width: 22px; height: 22px; border-radius: 50%; flex: none;\n  background: var(--paper-high); border: 1px solid var(--rule-strong);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-instrument); font-size: 10px; color: var(--ink-2);\n}\n.rail-account .ra-mail { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n/* ---------- main column ---------- */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 0 28px; border-bottom: 1px solid var(--rule);\n  background: var(--paper);\n  position: sticky; top: 0; z-index: 30;\n}\n.topbar .tp-room { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.topbar .tp-status { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.06em; color: var(--ink-3); }\n.topbar .tp-status b { color: var(--ink-2); font-weight: 600; }\n\n/* ---------- thread context ---------- */\n.threadctx { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: 52px; z-index: 29; }\n.threadctx-inner { display: flex; align-items: center; gap: 28px; padding: 12px 28px 10px; }\n.threadctx .tc-title { min-width: 0; }\n.threadctx .tt-name { font-family: var(--font-author); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.threadctx .tt-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; margin-top: 1px; }\n.threadctx .statelens { flex: none; margin-left: 16px; }\n.threadctx .tc-journey { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; margin-left: 16px; }\n.threadctx .tc-journey a { color: var(--ink-3); }\n.threadctx .tc-close { margin-left: auto; }\n\n/* ---------- room scaffold ---------- */\n.room { flex: 1; padding: 44px 48px 110px; }\n.room[data-register=\"air\"]   { background: var(--air-tint); }\n.room[data-register=\"press\"] { background: var(--press-tint); }\n.room-inner { max-width: 880px; margin: 0 auto; }\n.room-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.room-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-34); line-height: 1.2; margin: 10px 0 6px; }\n.room-lede { font-size: var(--fs-15); color: var(--ink-2); max-width: var(--measure); }\n\n.room[data-register=\"air\"] .room-title { font-weight: 400; color: #22304E; }\n.room[data-register=\"air\"] .room-lede { color: var(--air-ink); line-height: 1.85; }\n.room[data-register=\"air\"] .room-eyebrow { color: #5A6B94; }\n.room[data-register=\"press\"] .room-title { font-weight: 600; color: #221F3A; }\n.room[data-register=\"press\"] .room-lede { color: var(--press-ink); line-height: 1.55; }\n.room[data-register=\"press\"] .room-eyebrow { color: #6E6A92; }\n\n/* ---------- cards ---------- */\n.card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 22px 24px; }\n.card .c-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.card h3 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 8px 0 6px; }\n.card p { font-size: var(--fs-14); color: var(--ink-2); }\n\n/* ---------- the page spine (content sections) ---------- */\n.spined { position: relative; padding-left: 46px; }\n.spined::before { content: \"\"; position: absolute; left: 18px; top: 8px; bottom: 8px; width: 1px; background: var(--rule-strong); }\n.spined .sp-sec { position: relative; padding-bottom: 44px; }\n.spined .sp-sec::before {\n  content: \"\"; position: absolute; left: -32.5px; top: 7px;\n  width: 10px; height: 10px; border-radius: 50%;\n  background: var(--paper); border: 1.5px solid var(--rule-strong);\n}\n.spined .sp-sec.is-here::before { background: var(--thread); border-color: var(--thread); }\n.sp-label { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.sp-sec.is-here > .sp-label { color: var(--ink); font-weight: 600; }\n.sp-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 6px 0 4px; }\n\n/* register spine tints \u2014 the current section is lit (a key moment:\n   the spine is the thread inside the room) */\n.spined .sp-sec.is-here::before { box-shadow: 0 0 0 3px rgba(79,70,229,0.13), 0 0 12px rgba(79,70,229,0.45); }\n.room[data-register=\"air\"] .spined::before { background: rgba(70,85,122,0.3); }\n.room[data-register=\"air\"] .spined .sp-sec::before { background: var(--air-tint); border-color: rgba(70,85,122,0.45); }\n.room[data-register=\"air\"] .spined .sp-sec.is-here::before { background: var(--st-explore); border-color: var(--st-explore); box-shadow: 0 0 0 3px rgba(61,104,238,0.13), 0 0 12px rgba(61,104,238,0.5); }\n.room[data-register=\"air\"] .sp-label { color: #5A6B94; }\n.room[data-register=\"press\"] .spined::before { background: rgba(74,70,120,0.3); }\n.room[data-register=\"press\"] .spined .sp-sec::before { background: var(--press-tint); border-color: rgba(74,70,120,0.45); }\n.room[data-register=\"press\"] .spined .sp-sec.is-here::before { background: var(--st-deep); border-color: var(--st-deep); }\n.room[data-register=\"press\"] .sp-label { color: #6E6A92; }\n\n/* ---------- footer ---------- */\n.room-foot { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 20px; }\n.room-foot p { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.06em; color: var(--ink-4); }\n.room-foot a { color: var(--ink-3); }\n\n/* ---------- utility ---------- */\n.stack-8  > * + * { margin-top: 8px; }\n.stack-14 > * + * { margin-top: 14px; }\n.stack-18 > * + * { margin-top: 18px; }\n.row { display: flex; align-items: center; gap: 12px; }\n\n<\/style>\n<style>\n  .toolrow { display: flex; align-items: center; gap: 12px; margin-top: 30px; }\n  .toolrow input { max-width: 320px; font-size: var(--fs-14); padding: 8px 12px; }\n  .chip-row { display: flex; gap: 6px; }\n  .fchip {\n    font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.06em;\n    padding: 4px 12px; border-radius: var(--r-1); border: 1px solid var(--rule);\n    background: var(--paper-high); color: var(--ink-2); cursor: pointer;\n  }\n  .fchip.is-on { border-color: var(--ink); color: var(--ink); font-weight: 600; }\n  .toolrow .cmp-hint { margin-left: auto; font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.06em; color: var(--ink-3); }\n\n  .shelf { margin-top: 44px; }\n  .shelf-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--rule-strong); }\n  .shelf-head h2 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); }\n  .shelf-head .sh-count { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.1em; color: var(--ink-3); text-transform: uppercase; }\n  .shelf-head .sh-note { margin-left: auto; font-size: var(--fs-12); color: var(--ink-3); }\n\n  .fam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }\n\n  .fam { position: relative; padding: 20px 22px; }\n  .fam .f-stamp { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }\n  .fam h3 { font-family: var(--font-author); font-weight: 500; font-size: 18px; margin: 9px 0 6px; }\n  .fam .f-body { font-size: var(--fs-14); color: var(--ink-2); line-height: 1.6; }\n  .fam .f-meta { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }\n  .fam .f-versions { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.05em; color: var(--ink-3); border: 1px solid var(--rule); border-radius: var(--r-1); padding: 2px 8px; text-decoration: none; }\n  .fam .f-versions:hover { color: var(--ink); border-color: var(--rule-strong); }\n  .fam .f-open { position: absolute; right: 18px; top: 18px; font-family: var(--font-instrument); font-size: 10px; color: var(--ink-4); }\n  .fam:hover .f-open { color: var(--ink-2); }\n  .fam.is-dim { opacity: 0.6; }\n\n  /* rough card: raw text + the two doors inline */\n  .rough .r-text { font-family: var(--font-author); font-style: italic; font-size: 15px; color: var(--ink-2); line-height: 1.6; }\n  .rough .r-doors { display: flex; gap: 8px; margin-top: 14px; }\n  .rough .btn { font-size: var(--fs-12); padding: 5px 12px; }\n<\/style>\n<\/head>\n<body>\n\n  <aside class=\"rail\">\n    <div class=\"rail-brand\">\n      <svg width=\"34\" height=\"16\" viewBox=\"0 0 150 54\" fill=\"none\"><path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\" stroke=\"#4F46E5\" stroke-width=\"7\" stroke-linecap=\"round\"/><\/svg>\n      <span class=\"rb-name\">IdeaLoop<\/span>\n    <\/div>\n    <nav class=\"rail-nav\">\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/02-desk.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 10.5 H13.5 M3 10.5 V13 M12 10.5 V13 M4.5 10.5 V6.5 A3 3 0 0 1 10.5 6.5 V10.5\"/><\/svg>\n        The Desk\n      <\/a>\n      <a class=\"rail-item is-active\" href=\"#\" data-nav=\"rooms/03-shelves.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 5 H13.5 M1.5 10.5 H13.5 M4 5 V2.5 M8 5 V3.5 M6 10.5 V8 M11 10.5 V8.5\"/><\/svg>\n        The Shelves\n      <\/a>\n    <\/nav>\n    <div class=\"rail-spacer\"><\/div>\n    <div class=\"rail-util\">\n      <a class=\"rail-item\" href=\"#\">Settings<\/a>\n      <a class=\"rail-item\" href=\"#\">My plan<\/a>\n      <a class=\"rail-item\" href=\"#\">Get help<\/a>\n    <\/div>\n    <div class=\"rail-account\"><span class=\"ra-dot\">e<\/span><span class=\"ra-mail\">emre@idealoopcore.com<\/span><\/div>\n  <\/aside>\n\n  <div class=\"main\">\n    <div class=\"topbar\">\n      <span class=\"tp-room\">the shelves<\/span>\n      <span class=\"tp-status\">beta \u00b7 free \u2014 <b>2 runs<\/b> this week \u00b7 refills thu<\/span>\n    <\/div>\n\n    <main class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">the shelves<\/span>\n        <h1 class=\"room-title\">All your threads<\/h1>\n        <p class=\"room-lede\">Two shelves. One card per family, pinned to its root \u2014 a family's\n          identity never moves, however far its branches go.<\/p>\n\n        <div class=\"toolrow\">\n          <input type=\"text\" placeholder=\"Search your ideas\u2026\">\n          <div class=\"chip-row\">\n            <button class=\"fchip is-on\">all<\/button>\n            <button class=\"fchip\">explored<\/button>\n            <button class=\"fchip\">deep<\/button>\n            <button class=\"fchip\">parked<\/button>\n          <\/div>\n          <span class=\"cmp-hint\">compare: pick two deep reads<\/span>\n        <\/div>\n\n        <!-- shelf 1: rough -->\n        <section class=\"shelf\">\n          <div class=\"shelf-head\">\n            <h2>Rough ideas<\/h2><span class=\"sh-count\">2 waiting<\/span>\n            <span class=\"sh-note\">Captured, not yet read \u2014 each opens into its two doors.<\/span>\n          <\/div>\n          <div class=\"fam-grid\">\n            <article class=\"fam rough card\">\n              <div class=\"f-stamp\">\u270e rough \u00b7 captured jul 20<\/div>\n              <h3>Contractor punch-list voice notes<\/h3>\n              <p class=\"r-text\">\"Site leads narrate the day's punch list into their phone driving\n                home \u2014 someone should turn that into the actual list.\"<\/p>\n              <div class=\"r-doors\">\n                <a class=\"btn\" href=\"#\" data-nav=\"rooms/04-explore.html\">Explore it \u2192<\/a>\n                <a class=\"btn\" href=\"#\" data-nav=\"rooms/05-deep.html\">Take it to deep \u2192<\/a>\n              <\/div>\n            <\/article>\n            <article class=\"fam rough card\">\n              <div class=\"f-stamp\">\u270e rough \u00b7 captured jul 14<\/div>\n              <h3>Warranty expiry ledger<\/h3>\n              <p class=\"r-text\">\"Everything I own has a warranty I forget about the day I need\n                it. One inbox for receipts, one nudge before expiry.\"<\/p>\n              <div class=\"r-doors\">\n                <a class=\"btn\" href=\"#\" data-nav=\"rooms/04-explore.html\">Explore it \u2192<\/a>\n                <a class=\"btn\" href=\"#\" data-nav=\"rooms/05-deep.html\">Take it to deep \u2192<\/a>\n              <\/div>\n            <\/article>\n          <\/div>\n        <\/section>\n\n        <!-- shelf 2: ideas -->\n        <section class=\"shelf\">\n          <div class=\"shelf-head\">\n            <h2>Ideas<\/h2><span class=\"sh-count\">3 families<\/span>\n            <span class=\"sh-note\">Evaluated at least once \u2014 the loop stays open on all of them.<\/span>\n          <\/div>\n          <div class=\"fam-grid\">\n            <article class=\"fam card\">\n              <span class=\"f-open\">open \u2192<\/span>\n              <div class=\"f-stamp\">\u2316 deep \u00b7 read jul 26<\/div>\n              <h3>Invoice hand-off for solo bookkeepers<\/h3>\n              <p class=\"f-body\">Email-native intake for the professional who receives the mess.\n                Distribution is the binding constraint.<\/p>\n              <div class=\"f-meta\">\n                <span class=\"score-pill\"><span class=\"sp-band mid\"><\/span>5.8<\/span>\n                <span class=\"handle\" style=\"font-size:11.5px;\">a named repeat buyer would move it \u2197<\/span>\n              <\/div>\n              <div class=\"f-meta\">\n                <a class=\"f-versions\" href=\"#\" data-nav=\"rooms/08-lineage.html\">\u2442 3 versions \u00b7 lineage<\/a>\n                <span class=\"f-versions\" style=\"border-style:dashed;\">watch \u00b7 quarterly<\/span>\n              <\/div>\n            <\/article>\n\n            <article class=\"fam card\">\n              <span class=\"f-open\">open \u2192<\/span>\n              <div class=\"f-stamp\">\u25ce explored \u00b7 jul 22<\/div>\n              <h3>Receipt inbox<\/h3>\n              <p class=\"f-body\">Widened into three angles \u2014 the consumer lane read as crowded;\n                the practitioner lane still open. No verdict: exploration doesn't score.<\/p>\n              <div class=\"f-meta\">\n                <span class=\"score-pill\"><span class=\"sp-band\" style=\"background:var(--band-none)\"><\/span>\u2014<\/span>\n                <span class=\"handle\" style=\"font-size:11.5px;\">two angles not yet taken forward<\/span>\n              <\/div>\n              <div class=\"f-meta\"><a class=\"f-versions\" href=\"#\" data-nav=\"rooms/08-lineage.html\">\u2442 2 versions \u00b7 lineage<\/a><\/div>\n            <\/article>\n\n            <article class=\"fam card is-dim\">\n              <span class=\"f-open\">open \u2192<\/span>\n              <div class=\"f-stamp\">\u2316 deep \u00b7 parked jun 30<\/div>\n              <h3>Meal-plan hand-me-downs<\/h3>\n              <p class=\"f-body\">Parked, not deleted \u2014 the read and its evidence stay. The loop\n                reopens the day you do.<\/p>\n              <div class=\"f-meta\">\n                <span class=\"score-pill\"><span class=\"sp-band low\"><\/span>3.9<\/span>\n                <span class=\"handle\" style=\"font-size:11.5px;\">trust \u2014 consumer habit unproven<\/span>\n              <\/div>\n            <\/article>\n          <\/div>\n        <\/section>\n\n        <div class=\"room-foot\">\n          <p>A family card always shows its root. The lead is a marker inside the braid, never the card. \u00b7 <a href=\"#\">what the stamps mean<\/a><\/p>\n          <p>room 3 of 9 \u00b7 neutral register<\/p>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "rooms/04-explore.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 Room 4 \u2014 Explore, the Widening<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n/* ============================================================\n   ILC \u00b7 Cold Light \u2014 shared room chrome\n   Linked by every room mockup after ../tokens.css.\n   The chrome IS the continuity: rail (global memory),\n   topbar, idea context with the STATE LENS (one state in\n   focus; the journey lives in Lineage).\n   ============================================================ */\n\nbody { display: flex; min-height: 100vh; }\n\n/* ---------- rail ---------- */\n.rail {\n  width: var(--rail-w); flex: none;\n  background: var(--paper-deep);\n  border-right: 1px solid var(--rule);\n  display: flex; flex-direction: column;\n  padding: 20px 12px 16px;\n  position: sticky; top: 0; height: 100vh;\n}\n.rail-brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 22px; }\n.rail-brand .rb-name { font-family: var(--font-author); font-weight: 500; font-size: 17px; }\n.rail-nav { display: flex; flex-direction: column; gap: 2px; }\n.rail-item {\n  display: flex; align-items: center; gap: 11px;\n  font-family: var(--font-interface); font-size: var(--fs-14); font-weight: 500;\n  color: var(--ink-2); background: none; border: none; cursor: pointer;\n  padding: 8px 10px; border-radius: var(--r-2); text-align: left;\n  text-decoration: none;\n}\n.rail-item:hover { background: rgba(22,24,29,0.05); color: var(--ink); }\n.rail-item.is-active { background: var(--paper-high); color: var(--ink); border: 1px solid var(--rule); padding: 7px 9px; }\n.rail-item svg { flex: none; stroke: currentColor; }\n.rail-spacer { flex: 1; }\n.rail-util { display: flex; flex-direction: column; gap: 1px; padding-top: 12px; border-top: 1px solid var(--rule); }\n.rail-util .rail-item { font-size: var(--fs-12); font-weight: 400; color: var(--ink-3); padding: 5px 10px; }\n.rail-account { display: flex; align-items: center; gap: 9px; padding: 12px 10px 0; }\n.rail-account .ra-dot {\n  width: 22px; height: 22px; border-radius: 50%; flex: none;\n  background: var(--paper-high); border: 1px solid var(--rule-strong);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-instrument); font-size: 10px; color: var(--ink-2);\n}\n.rail-account .ra-mail { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n/* ---------- main column ---------- */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 0 28px; border-bottom: 1px solid var(--rule);\n  background: var(--paper);\n  position: sticky; top: 0; z-index: 30;\n}\n.topbar .tp-room { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.topbar .tp-status { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.06em; color: var(--ink-3); }\n.topbar .tp-status b { color: var(--ink-2); font-weight: 600; }\n\n/* ---------- thread context ---------- */\n.threadctx { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: 52px; z-index: 29; }\n.threadctx-inner { display: flex; align-items: center; gap: 28px; padding: 12px 28px 10px; }\n.threadctx .tc-title { min-width: 0; }\n.threadctx .tt-name { font-family: var(--font-author); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.threadctx .tt-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; margin-top: 1px; }\n.threadctx .statelens { flex: none; margin-left: 16px; }\n.threadctx .tc-journey { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; margin-left: 16px; }\n.threadctx .tc-journey a { color: var(--ink-3); }\n.threadctx .tc-close { margin-left: auto; }\n\n/* ---------- room scaffold ---------- */\n.room { flex: 1; padding: 44px 48px 110px; }\n.room[data-register=\"air\"]   { background: var(--air-tint); }\n.room[data-register=\"press\"] { background: var(--press-tint); }\n.room-inner { max-width: 880px; margin: 0 auto; }\n.room-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.room-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-34); line-height: 1.2; margin: 10px 0 6px; }\n.room-lede { font-size: var(--fs-15); color: var(--ink-2); max-width: var(--measure); }\n\n.room[data-register=\"air\"] .room-title { font-weight: 400; color: #22304E; }\n.room[data-register=\"air\"] .room-lede { color: var(--air-ink); line-height: 1.85; }\n.room[data-register=\"air\"] .room-eyebrow { color: #5A6B94; }\n.room[data-register=\"press\"] .room-title { font-weight: 600; color: #221F3A; }\n.room[data-register=\"press\"] .room-lede { color: var(--press-ink); line-height: 1.55; }\n.room[data-register=\"press\"] .room-eyebrow { color: #6E6A92; }\n\n/* ---------- cards ---------- */\n.card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 22px 24px; }\n.card .c-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.card h3 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 8px 0 6px; }\n.card p { font-size: var(--fs-14); color: var(--ink-2); }\n\n/* ---------- the page spine (content sections) ---------- */\n.spined { position: relative; padding-left: 46px; }\n.spined::before { content: \"\"; position: absolute; left: 18px; top: 8px; bottom: 8px; width: 1px; background: var(--rule-strong); }\n.spined .sp-sec { position: relative; padding-bottom: 44px; }\n.spined .sp-sec::before {\n  content: \"\"; position: absolute; left: -32.5px; top: 7px;\n  width: 10px; height: 10px; border-radius: 50%;\n  background: var(--paper); border: 1.5px solid var(--rule-strong);\n}\n.spined .sp-sec.is-here::before { background: var(--thread); border-color: var(--thread); }\n.sp-label { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.sp-sec.is-here > .sp-label { color: var(--ink); font-weight: 600; }\n.sp-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 6px 0 4px; }\n\n/* register spine tints \u2014 the current section is lit (a key moment:\n   the spine is the thread inside the room) */\n.spined .sp-sec.is-here::before { box-shadow: 0 0 0 3px rgba(79,70,229,0.13), 0 0 12px rgba(79,70,229,0.45); }\n.room[data-register=\"air\"] .spined::before { background: rgba(70,85,122,0.3); }\n.room[data-register=\"air\"] .spined .sp-sec::before { background: var(--air-tint); border-color: rgba(70,85,122,0.45); }\n.room[data-register=\"air\"] .spined .sp-sec.is-here::before { background: var(--st-explore); border-color: var(--st-explore); box-shadow: 0 0 0 3px rgba(61,104,238,0.13), 0 0 12px rgba(61,104,238,0.5); }\n.room[data-register=\"air\"] .sp-label { color: #5A6B94; }\n.room[data-register=\"press\"] .spined::before { background: rgba(74,70,120,0.3); }\n.room[data-register=\"press\"] .spined .sp-sec::before { background: var(--press-tint); border-color: rgba(74,70,120,0.45); }\n.room[data-register=\"press\"] .spined .sp-sec.is-here::before { background: var(--st-deep); border-color: var(--st-deep); }\n.room[data-register=\"press\"] .sp-label { color: #6E6A92; }\n\n/* ---------- footer ---------- */\n.room-foot { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 20px; }\n.room-foot p { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.06em; color: var(--ink-4); }\n.room-foot a { color: var(--ink-3); }\n\n/* ---------- utility ---------- */\n.stack-8  > * + * { margin-top: 8px; }\n.stack-14 > * + * { margin-top: 14px; }\n.stack-18 > * + * { margin-top: 18px; }\n.row { display: flex; align-items: center; gap: 12px; }\n\n<\/style>\n<style>\n  /* ---------- open-air specifics ---------- */\n  .air-card { background: rgba(255,255,255,0.8); border: 1px solid rgba(70,85,122,0.2); border-radius: var(--r-3); }\n\n  /* our read */\n  .read-reflection { font-family: var(--font-author); font-size: 20px; line-height: 1.6; color: #22304E; font-weight: 400; max-width: 60ch; margin-top: 10px; }\n  .read-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 22px; }\n  .read-col { padding: 18px 20px; }\n  .read-col .rc-h { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.14em; text-transform: uppercase; color: #5A6B94; margin-bottom: 10px; }\n  .read-col li { font-size: var(--fs-14); color: var(--air-ink); line-height: 1.75; list-style: none; padding-left: 16px; position: relative; margin-bottom: 6px; }\n  .read-col.clear li::before  { content: \"\u2014\"; position: absolute; left: 0; color: #5A6B94; }\n  .read-col.open li::before   { content: \"?\"; position: absolute; left: 0; color: #5A6B94; font-family: var(--font-instrument); font-size: 12px; }\n  .branchability { display: flex; align-items: baseline; gap: 12px; margin-top: 18px; padding: 12px 20px; border-top: 1px dashed rgba(70,85,122,0.3); }\n  .branchability .bb-k { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.14em; text-transform: uppercase; color: #5A6B94; flex: none; }\n  .branchability p { font-size: var(--fs-14); color: var(--air-ink); }\n\n  /* the fan */\n  .fan-svg { display: block; width: 100%; height: 130px; }\n  .fan-svg path { fill: none; stroke: rgba(70,85,122,0.42); stroke-width: 1.2; }\n  .fan-svg .seed-line { stroke: rgba(70,85,122,0.6); stroke-width: 1.4; }\n  .fan-svg .seed-label { font-family: var(--font-instrument); font-size: 10px; fill: #5A6B94; letter-spacing: 0.08em; }\n  .fan-note { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.12em; text-transform: uppercase; color: #5A6B94; text-align: center; margin: 2px 0 14px; }\n\n  .angle { padding: 22px 24px; margin-bottom: 14px; }\n  .angle .a-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }\n  .angle .a-basis { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.14em; text-transform: uppercase; color: #5A6B94; }\n  .angle .a-slot { font-family: var(--font-instrument); font-size: var(--fs-10); color: rgba(94,114,132,0.7); letter-spacing: 0.08em; }\n  .angle h4 { font-family: var(--font-author); font-weight: 400; font-size: 21px; color: #22304E; margin: 10px 0 6px; }\n  .angle .a-concept { font-size: var(--fs-14); color: var(--air-ink); line-height: 1.8; max-width: 64ch; }\n  .angle .a-block { margin-top: 14px; display: grid; grid-template-columns: 92px 1fr; gap: 12px; align-items: baseline; }\n  .angle .a-k { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.12em; text-transform: uppercase; color: #5A6B94; }\n  .angle .a-v { font-size: var(--fs-14); color: var(--air-ink); line-height: 1.7; }\n  .angle .a-v .trust { font-family: var(--font-instrument); font-size: 10px; color: #5A6B94; letter-spacing: 0.06em; }\n  .angle .a-actions { display: flex; gap: 10px; margin-top: 18px; }\n  .angle .btn { font-size: var(--fs-12); padding: 6px 14px; }\n  .angle .a-done { font-family: var(--font-instrument); font-size: 11px; color: var(--evidence); letter-spacing: 0.04em; }\n\n  /* terrain lanes */\n  .lane { display: grid; grid-template-columns: 200px 1fr; gap: 18px; padding: 16px 0; border-top: 1px solid rgba(70,85,122,0.18); }\n  .lane:last-child { border-bottom: 1px solid rgba(70,85,122,0.18); }\n  .lane .ln-name { font-family: var(--font-author); font-size: 16px; color: #22304E; }\n  .lane .ln-density { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #5A6B94; margin-top: 3px; }\n  .lane .ln-body { font-size: var(--fs-14); color: var(--air-ink); line-height: 1.75; }\n  .lane .ln-q { font-family: var(--font-author); font-style: italic; color: #35426B; margin-top: 6px; font-size: 15px; }\n\n  /* next move */\n  .nextmove { padding: 24px 28px; }\n  .nextmove .nm-uncert { font-family: var(--font-author); font-size: 19px; color: #22304E; line-height: 1.55; max-width: 56ch; }\n  .nextmove .nm-rec { font-size: var(--fs-14); color: var(--air-ink); margin-top: 12px; max-width: 64ch; line-height: 1.8; }\n  .nextmove .nm-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }\n<\/style>\n<\/head>\n<body>\n\n  <aside class=\"rail\">\n    <div class=\"rail-brand\">\n      <svg width=\"34\" height=\"16\" viewBox=\"0 0 150 54\" fill=\"none\"><path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\" stroke=\"#4F46E5\" stroke-width=\"7\" stroke-linecap=\"round\"/><\/svg>\n      <span class=\"rb-name\">IdeaLoop<\/span>\n    <\/div>\n    <nav class=\"rail-nav\">\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/02-desk.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 10.5 H13.5 M3 10.5 V13 M12 10.5 V13 M4.5 10.5 V6.5 A3 3 0 0 1 10.5 6.5 V10.5\"/><\/svg>\n        The Desk\n      <\/a>\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/03-shelves.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 5 H13.5 M1.5 10.5 H13.5 M4 5 V2.5 M8 5 V3.5 M6 10.5 V8 M11 10.5 V8.5\"/><\/svg>\n        The Shelves\n      <\/a>\n    <\/nav>\n    <div class=\"rail-spacer\"><\/div>\n    <div class=\"rail-util\">\n      <a class=\"rail-item\" href=\"#\">Settings<\/a>\n      <a class=\"rail-item\" href=\"#\">My plan<\/a>\n      <a class=\"rail-item\" href=\"#\">Get help<\/a>\n    <\/div>\n    <div class=\"rail-account\"><span class=\"ra-dot\">e<\/span><span class=\"ra-mail\">emre@idealoopcore.com<\/span><\/div>\n  <\/aside>\n\n  <div class=\"main\">\n    <div class=\"topbar\">\n      <span class=\"tp-room\">explore \u00b7 the widening<\/span>\n      <span class=\"tp-status\">beta \u00b7 free \u2014 <b>2 runs<\/b> this week \u00b7 refills thu<\/span>\n    <\/div>\n\n    <!-- the thread context \u2014 survives every cut inside this idea -->\n    <div class=\"threadctx\">\n      <div class=\"threadctx-inner\">\n        <div class=\"tc-title\">\n          <div class=\"tt-name\">Invoice hand-off for solo bookkeepers<\/div>\n          <div class=\"tt-meta\">family of 3 \u00b7 root \u00b7 read jul 22<\/div>\n        <\/div>\n        <div class=\"statelens st-explore\">\n          <span class=\"sl-dot past\" title=\"captured\"><\/span>\n          <span class=\"sl-here\"><span class=\"sl-core\"><\/span><span class=\"sl-label\">explored<\/span><\/span>\n          <a class=\"sl-dot open\" href=\"#\" data-nav=\"rooms/05-deep.html\" title=\"deep\"><\/a>\n          <a class=\"sl-dot open\" href=\"#\" data-nav=\"rooms/06-evolve.html\" title=\"evolve\"><\/a>\n          <a class=\"sl-dot open\" href=\"#\" data-nav=\"rooms/07-compare.html\" title=\"compare\"><\/a>\n          <a class=\"sl-dot open\" href=\"#\" data-nav=\"rooms/09-brief.html\" title=\"brief\"><\/a>\n        <\/div>\n        <span class=\"tc-journey\">one state in focus \u00b7 <a href=\"#\" data-nav=\"rooms/08-lineage.html\">the journey lives in lineage<\/a><\/span>\n        <a class=\"btn btn-quiet tc-close\" href=\"#\" data-nav=\"rooms/02-desk.html\" style=\"font-size:12px;\">put down \u27f6 desk<\/a>\n      <\/div>\n    <\/div>\n\n    <main class=\"room\" data-register=\"air\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">explore \u00b7 the widening \u00b7 no score, no rank, no verdict<\/span>\n        <h1 class=\"room-title\">What could this become?<\/h1>\n        <p class=\"room-lede\">The aperture opens. Our read of the seed, then the fan \u2014 every strand\n          points at a named piece of evidence, or it was dropped.<\/p>\n\n        <div class=\"spined\" style=\"margin-top:44px;\">\n\n          <!-- \u2160 \u00b7 OUR READ -->\n          <section class=\"sp-sec is-here\">\n            <div class=\"sp-label\">\u2160 \u00b7 our read<\/div>\n            <p class=\"read-reflection\">You're describing a hand-off problem, not a scanning\n              problem \u2014 the pain lives at the moment a shoebox of paper becomes someone else's\n              job. That someone is more findable than the crowd.<\/p>\n            <div class=\"read-cols\">\n              <div class=\"read-col clear air-card\">\n                <div class=\"rc-h\">what's already clear<\/div>\n                <ul>\n                  <li>The friction is documented where bookkeepers talk \u2014\n                      <span class=\"evidence-link\">r/bookkeeping<\/span> threads name it monthly.<\/li>\n                  <li>OCR itself is commodity \u2014 the build is not the bet.<\/li>\n                <\/ul>\n              <\/div>\n              <div class=\"read-col open air-card\">\n                <div class=\"rc-h\">still open<\/div>\n                <ul>\n                  <li>Who pays \u2014 the bookkeeper who suffers, or the client who causes it?<\/li>\n                  <li>Whether trust in handing over an inbox can be earned by software at all.<\/li>\n                <\/ul>\n              <\/div>\n            <\/div>\n            <div class=\"branchability\">\n              <span class=\"bb-k\">branchability<\/span>\n              <p>Rich \u2014 the seed splits cleanly along positioning, mechanism, and target.\n                 Three strands hold under the evidence.<\/p>\n            <\/div>\n          <\/section>\n\n          <!-- \u2161 \u00b7 THE FAN -->\n          <section class=\"sp-sec\">\n            <div class=\"sp-label\">\u2161 \u00b7 the fan<\/div>\n            <svg class=\"fan-svg\" viewBox=\"0 0 820 130\" preserveAspectRatio=\"none\">\n              <text class=\"seed-label\" x=\"0\" y=\"96\">THE SEED<\/text>\n              <path class=\"seed-line\" d=\"M64 92 L300 92\"/>\n              <path d=\"M300 92 C 380 92 410 24 520 18 L 820 18\"/>\n              <path d=\"M300 92 C 390 92 430 58 540 55 L 820 55\"/>\n              <path d=\"M300 92 C 390 92 440 92 550 92 L 820 92\"/>\n            <\/svg>\n            <div class=\"fan-note\">fan order \u00b7 not ranked<\/div>\n\n            <article class=\"angle air-card\">\n              <div class=\"a-top\">\n                <span class=\"a-basis\">positioning \u00b7 lane: the unclaimed hand-off<\/span>\n                <span class=\"a-slot\">angle 1 of 3<\/span>\n              <\/div>\n              <h4>The bookkeeper's inbox, not the founder's scanner<\/h4>\n              <p class=\"a-concept\">Sell to the professional who receives the mess, not the client\n                who makes it. The product is a client-facing drop-box that arrives as the\n                bookkeeper's own branded link.<\/p>\n              <div class=\"a-block\">\n                <span class=\"a-k\">opening<\/span>\n                <p class=\"a-v\">Bookkeepers already ask clients for \"everything by email\" and\n                  reconcile by hand \u2014 <span class=\"evidence-link\">r/bookkeeping<\/span>\n                  <span class=\"evidence-chip\">reddit \u00b7 41 threads<\/span> names the intake step\n                  as the month's worst day. <span class=\"trust\">trust: medium<\/span><\/p>\n              <\/div>\n              <div class=\"a-block\">\n                <span class=\"a-k\">the bet<\/span>\n                <p class=\"a-v\">That intake is painful enough to pay for separately from the\n                  ledger software they already own.<\/p>\n              <\/div>\n              <div class=\"a-block\">\n                <span class=\"a-k\">disconfirmer<\/span>\n                <p class=\"a-v\">If <span class=\"evidence-link\">Dext<\/span> ships client-side intake\n                  in its base tier, this angle closes.<\/p>\n              <\/div>\n
