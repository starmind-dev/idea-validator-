-3); margin-bottom: 12px; }\n  .xrow { padding: 10px 0; border-top: 1px solid var(--rule); }\n  .xrow .x-part { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }\n  .xrow p { font-size: var(--fs-12); color: var(--ink-2); line-height: 1.55; margin-top: 3px; }\n  .xrow.is-hot .x-part::after { content: \" \u00b7 the read pressured this\"; color: var(--ink-3); font-weight: 400; }\n\n  /* footer action */\n  .rerun { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 18px; padding: 18px 24px; }\n  .rerun p { font-size: var(--fs-14); color: var(--ink-2); max-width: 58ch; }\n  .rerun .btn-primary { flex: none; }\n<\/style>\n<\/head>\n<body>\n\n  <aside class=\"rail\">\n    <div class=\"rail-brand\">\n      <svg width=\"34\" height=\"16\" viewBox=\"0 0 150 54\" fill=\"none\"><path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\" stroke=\"#4F46E5\" stroke-width=\"7\" stroke-linecap=\"round\"/><\/svg>\n      <span class=\"rb-name\">IdeaLoop<\/span>\n    <\/div>\n    <nav class=\"rail-nav\">\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/02-desk.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 10.5 H13.5 M3 10.5 V13 M12 10.5 V13 M4.5 10.5 V6.5 A3 3 0 0 1 10.5 6.5 V10.5\"/><\/svg>\n        The Desk\n      <\/a>\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/03-shelves.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 5 H13.5 M1.5 10.5 H13.5 M4 5 V2.5 M8 5 V3.5 M6 10.5 V8 M11 10.5 V8.5\"/><\/svg>\n        The Shelves\n      <\/a>\n    <\/nav>\n    <div class=\"rail-spacer\"><\/div>\n    <div class=\"rail-util\">\n      <a class=\"rail-item\" href=\"#\">Settings<\/a>\n      <a class=\"rail-item\" href=\"#\">My plan<\/a>\n      <a class=\"rail-item\" href=\"#\">Get help<\/a>\n    <\/div>\n    <div class=\"rail-account\"><span class=\"ra-dot\">e<\/span><span class=\"ra-mail\">emre@idealoopcore.com<\/span><\/div>\n  <\/aside>\n\n  <div class=\"main\">\n    <div class=\"topbar\">\n      <span class=\"tp-room\">evolve \u00b7 the return<\/span>\n      <span class=\"tp-status\">beta \u00b7 free \u2014 <b>1 run<\/b> this week \u00b7 refills thu<\/span>\n    <\/div>\n\n    <div class=\"threadctx\">\n      <div class=\"threadctx-inner\">\n        <div class=\"tc-title\">\n          <div class=\"tt-name\">Forward-to-file: no app at all<\/div>\n          <div class=\"tt-meta\">v2 \u00b7 read jul 26 \u00b7 returning<\/div>\n        <\/div>\n        <div class=\"statelens st-evolve\">\n          <span class=\"sl-dot past\" title=\"captured\"><\/span>\n          <a class=\"sl-dot past\" href=\"#\" data-nav=\"rooms/04-explore.html\" title=\"explored\"><\/a>\n          <a class=\"sl-dot past\" href=\"#\" data-nav=\"rooms/05-deep.html\" title=\"deep\"><\/a>\n          <span class=\"sl-here\"><span class=\"sl-core\"><\/span><span class=\"sl-label\">evolve<\/span><\/span>\n          <a class=\"sl-dot open\" href=\"#\" data-nav=\"rooms/07-compare.html\" title=\"compare\"><\/a>\n          <a class=\"sl-dot open\" href=\"#\" data-nav=\"rooms/09-brief.html\" title=\"brief\"><\/a>\n        <\/div>\n        <span class=\"tc-journey\">one state in focus \u00b7 <a href=\"#\" data-nav=\"rooms/08-lineage.html\">the journey lives in lineage<\/a><\/span>\n        <a class=\"btn btn-quiet tc-close\" href=\"#\" data-nav=\"rooms/02-desk.html\" style=\"font-size:12px;\">put down \u27f6 desk<\/a>\n      <\/div>\n    <\/div>\n\n    <main class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">evolve \u00b7 the thread doubles back<\/span>\n        <h1 class=\"room-title\">The idea changed \u2014 re-read it.<\/h1>\n        <p class=\"room-lede\">Returning is re-reading, not rewinding. V2 stays exactly as it was;\n          your edit becomes V3, and the walkthrough will show what moved.<\/p>\n\n        <!-- what the last read established -->\n        <div class=\"pstrip\">\n          <div class=\"pcell\">\n            <span class=\"p-k\">the verdict, v2<\/span>\n            <p class=\"p-v\"><b>5.8<\/b> \u2014 the bet lands on distribution, where the evidence is thinnest.<\/p>\n          <\/div>\n          <div class=\"pcell\">\n            <span class=\"p-k\">strongest asset<\/span>\n            <p class=\"p-v\">Email-native intake \u2014 removes the adoption step every competitor stumbles on.<\/p>\n          <\/div>\n          <div class=\"pcell\">\n            <span class=\"p-k\">binding constraint<\/span>\n            <p class=\"p-v\">No repeatable path to the bookkeeper's desk. Trust before payment.<\/p>\n          <\/div>\n        <\/div>\n\n        <!-- the work row -->\n        <div class=\"workrow\">\n          <div class=\"vrail card\">\n            <div class=\"vr-h\">the line so far<\/div>\n            <div class=\"vline\">\n              <div class=\"vnode\">\n                <div class=\"vn-name\">v1 \u00b7 the seed<\/div>\n                <div class=\"vn-meta\">captured jul 12<\/div>\n              <\/div>\n              <div class=\"vnode is-here\">\n                <div class=\"vn-name\">v2 \u00b7 email-native<\/div>\n                <div class=\"vn-meta\">deep 5.8 \u00b7 jul 26<\/div>\n              <\/div>\n              <div class=\"vnode is-next\" style=\"padding-bottom:0;\">\n                <div class=\"vn-name\">v3 \u00b7 your edit<\/div>\n                <div class=\"vn-meta\">forks on re-read<\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"canvas\">\n            <div class=\"cv-h\">\n              <span class=\"cv-k\">the idea \u00b7 v2 \u2192 v3<\/span>\n              <span class=\"cv-edit\">click any part to edit \u00b7 six load-bearing parts tagged<\/span>\n            <\/div>\n            <p class=\"cv-text\">\n              <span class=\"part is-changed\">Solo bookkeepers with 10\u201340 clients<span class=\"part-tag\">target<\/span><\/span>\n              drown in\n              <span class=\"part\">client receipts that arrive as photos, PDFs, and paper<span class=\"part-tag\">problem<\/span><\/span>.\n              The product is\n              <span class=\"part\">a forwarding address that returns everything filed and coded<span class=\"part-tag\">mechanism<\/span><\/span>,\n              priced as\n              <span class=\"part is-changed\">a per-client monthly line the bookkeeper re-bills<span class=\"part-tag\">money \u00b7 changed<\/span><\/span>,\n              defensible through\n              <span class=\"part\">the firm's own branded intake address<span class=\"part-tag\">moat<\/span><\/span>,\n              and deliberately\n              <span class=\"part\">nothing more than intake \u2014 no ledger, no dashboard<span class=\"part-tag\">scope<\/span><\/span>.\n            <\/p>\n            <p class=\"cv-note\">underline = a load-bearing clause \u00b7 heavy underline = changed since v2 \u00b7\n              verbatim from your idea, or the tag is dropped<\/p>\n          <\/div>\n\n          <div class=\"xray card\">\n            <div class=\"xr-h\">x-ray \u00b7 what v2's read pressured<\/div>\n            <div class=\"xrow is-hot\">\n              <span class=\"x-part\">money<\/span>\n              <p>Payment stopped at rung 3 \u2014 intake alone was unpriced. Your re-bill framing\n                 answers exactly this clause.<\/p>\n            <\/div>\n            <div class=\"xrow is-hot\">\n              <span class=\"x-part\">target<\/span>\n              <p>Demand's next rung waits on a named buyer \u2014 narrowing the target makes that\n                 buyer findable.<\/p>\n            <\/div>\n            <div class=\"xrow\">\n              <span class=\"x-part\">mechanism<\/span>\n              <p>Held at high grounding. Unchanged \u2014 the read carries forward.<\/p>\n            <\/div>\n            <div class=\"xrow\">\n              <span class=\"x-part\">moat<\/span>\n              <p>OR capped either way; the cap is structural, not a wording problem.<\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"rerun card\">\n          <p><b style=\"color:var(--ink);\">2 parts changed.<\/b> The re-read runs on the same\n            rubric \u2014 a fresh read, a new fork in the braid. V2 and its evidence stay untouched.<\/p>\n          <a class=\"btn btn-primary\" href=\"#\" data-nav=\"rooms/05-deep.html\">Re-read as v3 \u00b7 1 run<\/a>\n        <\/div>\n\n        <div class=\"room-foot\">\n          <p>Selection, not evolution \u2014 versions fork; nothing is overwritten. \u00b7 <a href=\"#\" data-nav=\"rooms/08-lineage.html\">see the braid<\/a><\/p>\n          <p>room 6 of 9 \u00b7 return register (pressure \u2192 air)<\/p>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "rooms/07-compare.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 Room 7 \u2014 Compare, the Seam<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n/* ============================================================\n   ILC \u00b7 Cold Light \u2014 shared room chrome\n   Linked by every room mockup after ../tokens.css.\n   The chrome IS the continuity: rail (global memory),\n   topbar, idea context with the STATE LENS (one state in\n   focus; the journey lives in Lineage).\n   ============================================================ */\n\nbody { display: flex; min-height: 100vh; }\n\n/* ---------- rail ---------- */\n.rail {\n  width: var(--rail-w); flex: none;\n  background: var(--paper-deep);\n  border-right: 1px solid var(--rule);\n  display: flex; flex-direction: column;\n  padding: 20px 12px 16px;\n  position: sticky; top: 0; height: 100vh;\n}\n.rail-brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 22px; }\n.rail-brand .rb-name { font-family: var(--font-author); font-weight: 500; font-size: 17px; }\n.rail-nav { display: flex; flex-direction: column; gap: 2px; }\n.rail-item {\n  display: flex; align-items: center; gap: 11px;\n  font-family: var(--font-interface); font-size: var(--fs-14); font-weight: 500;\n  color: var(--ink-2); background: none; border: none; cursor: pointer;\n  padding: 8px 10px; border-radius: var(--r-2); text-align: left;\n  text-decoration: none;\n}\n.rail-item:hover { background: rgba(22,24,29,0.05); color: var(--ink); }\n.rail-item.is-active { background: var(--paper-high); color: var(--ink); border: 1px solid var(--rule); padding: 7px 9px; }\n.rail-item svg { flex: none; stroke: currentColor; }\n.rail-spacer { flex: 1; }\n.rail-util { display: flex; flex-direction: column; gap: 1px; padding-top: 12px; border-top: 1px solid var(--rule); }\n.rail-util .rail-item { font-size: var(--fs-12); font-weight: 400; color: var(--ink-3); padding: 5px 10px; }\n.rail-account { display: flex; align-items: center; gap: 9px; padding: 12px 10px 0; }\n.rail-account .ra-dot {\n  width: 22px; height: 22px; border-radius: 50%; flex: none;\n  background: var(--paper-high); border: 1px solid var(--rule-strong);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-instrument); font-size: 10px; color: var(--ink-2);\n}\n.rail-account .ra-mail { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n/* ---------- main column ---------- */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 0 28px; border-bottom: 1px solid var(--rule);\n  background: var(--paper);\n  position: sticky; top: 0; z-index: 30;\n}\n.topbar .tp-room { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.topbar .tp-status { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.06em; color: var(--ink-3); }\n.topbar .tp-status b { color: var(--ink-2); font-weight: 600; }\n\n/* ---------- thread context ---------- */\n.threadctx { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: 52px; z-index: 29; }\n.threadctx-inner { display: flex; align-items: center; gap: 28px; padding: 12px 28px 10px; }\n.threadctx .tc-title { min-width: 0; }\n.threadctx .tt-name { font-family: var(--font-author); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.threadctx .tt-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; margin-top: 1px; }\n.threadctx .statelens { flex: none; margin-left: 16px; }\n.threadctx .tc-journey { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; margin-left: 16px; }\n.threadctx .tc-journey a { color: var(--ink-3); }\n.threadctx .tc-close { margin-left: auto; }\n\n/* ---------- room scaffold ---------- */\n.room { flex: 1; padding: 44px 48px 110px; }\n.room[data-register=\"air\"]   { background: var(--air-tint); }\n.room[data-register=\"press\"] { background: var(--press-tint); }\n.room-inner { max-width: 880px; margin: 0 auto; }\n.room-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.room-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-34); line-height: 1.2; margin: 10px 0 6px; }\n.room-lede { font-size: var(--fs-15); color: var(--ink-2); max-width: var(--measure); }\n\n.room[data-register=\"air\"] .room-title { font-weight: 400; color: #22304E; }\n.room[data-register=\"air\"] .room-lede { color: var(--air-ink); line-height: 1.85; }\n.room[data-register=\"air\"] .room-eyebrow { color: #5A6B94; }\n.room[data-register=\"press\"] .room-title { font-weight: 600; color: #221F3A; }\n.room[data-register=\"press\"] .room-lede { color: var(--press-ink); line-height: 1.55; }\n.room[data-register=\"press\"] .room-eyebrow { color: #6E6A92; }\n\n/* ---------- cards ---------- */\n.card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 22px 24px; }\n.card .c-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.card h3 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 8px 0 6px; }\n.card p { font-size: var(--fs-14); color: var(--ink-2); }\n\n/* ---------- the page spine (content sections) ---------- */\n.spined { position: relative; padding-left: 46px; }\n.spined::before { content: \"\"; position: absolute; left: 18px; top: 8px; bottom: 8px; width: 1px; background: var(--rule-strong); }\n.spined .sp-sec { position: relative; padding-bottom: 44px; }\n.spined .sp-sec::before {\n  content: \"\"; position: absolute; left: -32.5px; top: 7px;\n  width: 10px; height: 10px; border-radius: 50%;\n  background: var(--paper); border: 1.5px solid var(--rule-strong);\n}\n.spined .sp-sec.is-here::before { background: var(--thread); border-color: var(--thread); }\n.sp-label { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.sp-sec.is-here > .sp-label { color: var(--ink); font-weight: 600; }\n.sp-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 6px 0 4px; }\n\n/* register spine tints \u2014 the current section is lit (a key moment:\n   the spine is the thread inside the room) */\n.spined .sp-sec.is-here::before { box-shadow: 0 0 0 3px rgba(79,70,229,0.13), 0 0 12px rgba(79,70,229,0.45); }\n.room[data-register=\"air\"] .spined::before { background: rgba(70,85,122,0.3); }\n.room[data-register=\"air\"] .spined .sp-sec::before { background: var(--air-tint); border-color: rgba(70,85,122,0.45); }\n.room[data-register=\"air\"] .spined .sp-sec.is-here::before { background: var(--st-explore); border-color: var(--st-explore); box-shadow: 0 0 0 3px rgba(61,104,238,0.13), 0 0 12px rgba(61,104,238,0.5); }\n.room[data-register=\"air\"] .sp-label { color: #5A6B94; }\n.room[data-register=\"press\"] .spined::before { background: rgba(74,70,120,0.3); }\n.room[data-register=\"press\"] .spined .sp-sec::before { background: var(--press-tint); border-color: rgba(74,70,120,0.45); }\n.room[data-register=\"press\"] .spined .sp-sec.is-here::before { background: var(--st-deep); border-color: var(--st-deep); }\n.room[data-register=\"press\"] .sp-label { color: #6E6A92; }\n\n/* ---------- footer ---------- */\n.room-foot { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 20px; }\n.room-foot p { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.06em; color: var(--ink-4); }\n.room-foot a { color: var(--ink-3); }\n\n/* ---------- utility ---------- */\n.stack-8  > * + * { margin-top: 8px; }\n.stack-14 > * + * { margin-top: 14px; }\n.stack-18 > * + * { margin-top: 18px; }\n.row { display: flex; align-items: center; gap: 12px; }\n\n<\/style>\n<style>\n  .room-inner { max-width: 1000px; }\n\n  /* the seam: two spines, one hairline between; connectors live in the\n     gaps BETWEEN dimension rows, on the seam itself */\n  .seam { position: relative; margin-top: 40px; }\n  .seam::before { content: \"\"; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--rule-strong); }\n  .seam-row { display: grid; grid-template-columns: 1fr 1fr; }\n  .seam-row .cell { padding: 20px 32px 22px; }\n  .seam-row .cell.l { padding-left: 0; }\n  .seam-row .cell.r { padding-right: 0; }\n  .s-head { padding-bottom: 16px !important; border-bottom: 1px solid var(--rule-strong); }\n  .s-name { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); }\n  .s-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; display: flex; align-items: center; gap: 10px; }\n\n  .dim-label { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }\n  .dim-body { font-size: var(--fs-14); color: var(--ink-2); line-height: 1.65; }\n  .dim-body .evidence-link { font-size: inherit; }\n\n  /* the connector row: a seam-centered note between dimension rows \u2014\n     it explains weight, never cause */\n  .connector-row { position: relative; height: 46px; }\n  .connector { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 230px; background: var(--paper-high); border: 1px solid var(--rule-strong); border-radius: var(--r-2); padding: 7px 12px; text-align: center; z-index: 2; }\n  .connector .cn-k { font-family: var(--font-instrument); font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }\n  .connector p { font-size: var(--fs-11); color: var(--ink-2); line-height: 1.45; margin-top: 3px; font-family: var(--font-interface); }\n\n  /* closure \u2014 app font only, no serif, no italics (locked) */\n  .closure { margin-top: 44px; padding: 26px 30px; }\n  .closure .cl-h { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n  .closure .cl-lead { font-family: var(--font-interface); font-size: 17px; font-weight: 500; color: var(--ink); margin-top: 10px; line-height: 1.6; max-width: 62ch; }\n  .lean { display: flex; align-items: center; gap: 14px; margin-top: 18px; }\n  .lean .ln-name { font-family: var(--font-instrument); font-size: var(--fs-11); color: var(--ink-2); width: 130px; letter-spacing: 0.03em; }\n  .lean .ln-name.r { text-align: right; }\n  .lean .ln-bar { flex: 1; height: 8px; border-radius: 4px; background: var(--paper-low); border: 1px solid var(--rule); position: relative; }\n  .lean .ln-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 53%; background: var(--ink-2); border-radius: 4px 0 0 4px; }\n  .lean .ln-mid { position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--rule-strong); }\n  .lean-note { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); letter-spacing: 0.05em; margin-top: 8px; }\n  .axes { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }\n  .axes .ax-h { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }\n  .axes li { list-style: none; font-size: var(--fs-14); color: var(--ink-2); padding: 5px 0; }\n  .axes li b { color: var(--ink); font-weight: 600; }\n<\/style>\n<\/head>\n<body>\n\n  <aside class=\"rail\">\n    <div class=\"rail-brand\">\n      <svg width=\"34\" height=\"16\" viewBox=\"0 0 150 54\" fill=\"none\"><path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\" stroke=\"#4F46E5\" stroke-width=\"7\" stroke-linecap=\"round\"/><\/svg>\n      <span class=\"rb-name\">IdeaLoop<\/span>\n    <\/div>\n    <nav class=\"rail-nav\">\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/02-desk.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 10.5 H13.5 M3 10.5 V13 M12 10.5 V13 M4.5 10.5 V6.5 A3 3 0 0 1 10.5 6.5 V10.5\"/><\/svg>\n        The Desk\n      <\/a>\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/03-shelves.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 5 H13.5 M1.5 10.5 H13.5 M4 5 V2.5 M8 5 V3.5 M6 10.5 V8 M11 10.5 V8.5\"/><\/svg>\n        The Shelves\n      <\/a>\n    <\/nav>\n    <div class=\"rail-spacer\"><\/div>\n    <div class=\"rail-util\">\n      <a class=\"rail-item\" href=\"#\">Settings<\/a>\n      <a class=\"rail-item\" href=\"#\">My plan<\/a>\n      <a class=\"rail-item\" href=\"#\">Get help<\/a>\n    <\/div>\n    <div class=\"rail-account\"><span class=\"ra-dot\">e<\/span><span class=\"ra-mail\">emre@idealoopcore.com<\/span><\/div>\n  <\/aside>\n\n  <div class=\"main\">\n    <div class=\"topbar\">\n      <span class=\"tp-room\">compare \u00b7 the seam<\/span>\n      <span class=\"tp-status\">compare is always free \u2014 it never spends a run<\/span>\n    <\/div>\n\n    <main class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">compare \u00b7 deep \u00d7 deep \u00b7 two threads at one moment<\/span>\n        <h1 class=\"room-title\">Which bet is heavier?<\/h1>\n        <p class=\"room-lede\">The field splits at a seam. Same dimensions on both sides; the\n          connector explains the weight of a difference \u2014 never a cause. No cause exists\n          between two separate ideas.<\/p>\n\n        <div class=\"seam\">\n          <div class=\"seam-row\">\n            <div class=\"cell l s-head\">\n              <div class=\"s-name\">Forward-to-file<\/div>\n              <div class=\"s-meta\">read jul 26 <span class=\"score-pill\"><span class=\"sp-band mid\"><\/span>5.8<\/span><\/div>\n            <\/div>\n            <div class=\"cell r s-head\">\n              <div class=\"s-name\">Receipt inbox<\/div>\n              <div class=\"s-meta\">read jul 22 <span class=\"score-pill\"><span class=\"sp-band mid\"><\/span>5.2<\/span><\/div>\n            <\/div>\n          <\/div>\n\n          <div class=\"seam-row\">\n            <div class=\"cell l\">\n              <div class=\"dim-label\"><span>demand<\/span><span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band mid\"><\/span>6.0<\/span><\/div>\n              <p class=\"dim-body\">Documented friction where the buyer talks \u2014 41 threads name\n                intake as the month's worst day. Repeat purchase structural but unevidenced.<\/p>\n            <\/div>\n            <div class=\"cell r\">\n              <div class=\"dim-label\"><span>demand<\/span><span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band mid\"><\/span>5.5<\/span><\/div>\n              <p class=\"dim-body\">Broader pain, noisier evidence \u2014 consumer complaints frequent\n                but diffuse; no single buyer with a repeating budget line.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"connector-row\">\n            <div class=\"connector\">\n              <span class=\"cn-k\">weight \u00b7 demand<\/span>\n              <p>Half a rung apart \u2014 but only one side has a findable buyer.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"seam-row\">\n            <div class=\"cell l\">\n              <div class=\"dim-label\"><span>payment<\/span><span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band mid\"><\/span>5.5<\/span><\/div>\n              <p class=\"dim-body\">The professional already pays <span class=\"evidence-link\">Dext<\/span>-tier\n                prices; intake alone is unpriced. First dollar plausible, unproven.<\/p>\n            <\/div>\n            <div class=\"cell r\">\n              <div class=\"dim-label\"><span>payment<\/span><span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band low\"><\/span>4.0<\/span><\/div>\n              <p class=\"dim-body\">Consumer-adjacent: willingness asserted in threads, no priced\n                precedent for standalone receipt filing.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"connector-row\">\n            <div class=\"connector\">\n              <span class=\"cn-k\">weight \u00b7 payment<\/span>\n              <p>The widest gap on the board: 1.5. A budget line vs. a habit change.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"seam-row\">\n            <div class=\"cell l\">\n              <div class=\"dim-label\"><span>positioning<\/span><span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band weak\"><\/span>2.5<\/span><\/div>\n              <p class=\"dim-body\">Capped \u2014 six defensibility components, none named. A wedge,\n                not a moat.<\/p>\n            <\/div>\n            <div class=\"cell r\">\n              <div class=\"dim-label\"><span>positioning<\/span><span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band low\"><\/span>3.5<\/span><\/div>\n              <p class=\"dim-body\">One live substitute holds the lane's center\n                (<span class=\"evidence-link\">Expensify<\/span> free tier); differentiation rests\n                on scope discipline.<\/p>\n            <\/div>\n          <\/div>\n\n          <div class=\"seam-row\">\n            <div class=\"cell l\">\n              <div class=\"dim-label\"><span>the build \u00b7 outside the overall<\/span><span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band\" style=\"background:var(--band-none)\"><\/span>6.5 for you<\/span><\/div>\n              <p class=\"dim-body\">Mail spine, parsing, exports \u2014 your parsing background takes\n                a full point off.<\/p>\n            <\/div>\n            <div class=\"cell r\">\n              <div class=\"dim-label\"><span>the build \u00b7 outside the overall<\/span><span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band\" style=\"background:var(--band-none)\"><\/span>5.5 for you<\/span><\/div>\n              <p class=\"dim-body\">Lighter for you \u2014 smaller surface, no mail infrastructure.\n                \"Lighter,\" never \"stronger.\"<\/p>\n            <\/div>\n          <\/div>\n        <\/div>\n\n        <!-- closure: app font, no serif, no italics \u2014 it defers to the scores -->\n        <div class=\"closure card\">\n          <span class=\"cl-h\">closure \u00b7 derived from the two overall scores \u2014 it cannot editorialize against them<\/span>\n          <p class=\"cl-lead\">This board leans toward Forward-to-file, on payment more than\n            demand. The lean is the arithmetic of the two reads \u2014 what it means is yours.<\/p>\n          <div class=\"lean\">\n            <span class=\"ln-name\">Forward-to-file \u00b7 5.8<\/span>\n            <div class=\"ln-bar\"><div class=\"ln-fill\"><\/div><div class=\"ln-mid\"><\/div><\/div>\n            <span class=\"ln-name r\">Receipt inbox \u00b7 5.2<\/span>\n          <\/div>\n          <div class=\"lean-note\">meter position = the score gap, nothing else \u00b7 0.6 apart on a 10-point ladder<\/div>\n          <div class=\"axes\">\n            <div class=\"ax-h\">decisive axes \u00b7 every merit gap \u2265 1.0 appears here<\/div>\n            <li><b>Payment, 1.5 apart<\/b> \u2014 the professional's budget line vs. an unpriced consumer habit.<\/li>\n          <\/div>\n        <\/div>\n\n        <div class=\"room-foot\">\n          <p>Compare juxtaposes; it never ranks a future. Two reads, one moment. \u00b7 <a href=\"#\">why deep \u00d7 deep only<\/a><\/p>\n          <p>room 7 of 9 \u00b7 neutral register \u00b7 split field<\/p>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "rooms/08-lineage.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 Room 8 \u2014 Lineage, the Braid<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n/* ============================================================\n   ILC \u00b7 Cold Light \u2014 shared room chrome\n   Linked by every room mockup after ../tokens.css.\n   The chrome IS the continuity: rail (global memory),\n   topbar, idea context with the STATE LENS (one state in\n   focus; the journey lives in Lineage).\n   ============================================================ */\n\nbody { display: flex; min-height: 100vh; }\n\n/* ---------- rail ---------- */\n.rail {\n  width: var(--rail-w); flex: none;\n  background: var(--paper-deep);\n  border-right: 1px solid var(--rule);\n  display: flex; flex-direction: column;\n  padding: 20px 12px 16px;\n  position: sticky; top: 0; height: 100vh;\n}\n.rail-brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 22px; }\n.rail-brand .rb-name { font-family: var(--font-author); font-weight: 500; font-size: 17px; }\n.rail-nav { display: flex; flex-direction: column; gap: 2px; }\n.rail-item {\n  display: flex; align-items: center; gap: 11px;\n  font-family: var(--font-interface); font-size: var(--fs-14); font-weight: 500;\n  color: var(--ink-2); background: none; border: none; cursor: pointer;\n  padding: 8px 10px; border-radius: var(--r-2); text-align: left;\n  text-decoration: none;\n}\n.rail-item:hover { background: rgba(22,24,29,0.05); color: var(--ink); }\n.rail-item.is-active { background: var(--paper-high); color: var(--ink); border: 1px solid var(--rule); padding: 7px 9px; }\n.rail-item svg { flex: none; stroke: currentColor; }\n.rail-spacer { flex: 1; }\n.rail-util { display: flex; flex-direction: column; gap: 1px; padding-top: 12px; border-top: 1px solid var(--rule); }\n.rail-util .rail-item { font-size: var(--fs-12); font-weight: 400; color: var(--ink-3); padding: 5px 10px; }\n.rail-account { display: flex; align-items: center; gap: 9px; padding: 12px 10px 0; }\n.rail-account .ra-dot {\n  width: 22px; height: 22px; border-radius: 50%; flex: none;\n  background: var(--paper-high); border: 1px solid var(--rule-strong);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-instrument); font-size: 10px; color: var(--ink-2);\n}\n.rail-account .ra-mail { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n/* ---------- main column ---------- */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 0 28px; border-bottom: 1px solid var(--rule);\n  background: var(--paper);\n  position: sticky; top: 0; z-index: 30;\n}\n.topbar .tp-room { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.topbar .tp-status { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.06em; color: var(--ink-3); }\n.topbar .tp-status b { color: var(--ink-2); font-weight: 600; }\n\n/* ---------- thread context ---------- */\n.threadctx { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: 52px; z-index: 29; }\n.threadctx-inner { display: flex; align-items: center; gap: 28px; padding: 12px 28px 10px; }\n.threadctx .tc-title { min-width: 0; }\n.threadctx .tt-name { font-family: var(--font-author); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.threadctx .tt-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; margin-top: 1px; }\n.threadctx .statelens { flex: none; margin-left: 16px; }\n.threadctx .tc-journey { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; margin-left: 16px; }\n.threadctx .tc-journey a { color: var(--ink-3); }\n.threadctx .tc-close { margin-left: auto; }\n\n/* ---------- room scaffold ---------- */\n.room { flex: 1; padding: 44px 48px 110px; }\n.room[data-register=\"air\"]   { background: var(--air-tint); }\n.room[data-register=\"press\"] { background: var(--press-tint); }\n.room-inner { max-width: 880px; margin: 0 auto; }\n.room-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.room-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-34); line-height: 1.2; margin: 10px 0 6px; }\n.room-lede { font-size: var(--fs-15); color: var(--ink-2); max-width: var(--measure); }\n\n.room[data-register=\"air\"] .room-title { font-weight: 400; color: #22304E; }\n.room[data-register=\"air\"] .room-lede { color: var(--air-ink); line-height: 1.85; }\n.room[data-register=\"air\"] .room-eyebrow { color: #5A6B94; }\n.room[data-register=\"press\"] .room-title { font-weight: 600; color: #221F3A; }\n.room[data-register=\"press\"] .room-lede { color: var(--press-ink); line-height: 1.55; }\n.room[data-register=\"press\"] .room-eyebrow { color: #6E6A92; }\n\n/* ---------- cards ---------- */\n.card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 22px 24px; }\n.card .c-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.card h3 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 8px 0 6px; }\n.card p { font-size: var(--fs-14); color: var(--ink-2); }\n\n/* ---------- the page spine (content sections) ---------- */\n.spined { position: relative; padding-left: 46px; }\n.spined::before { content: \"\"; position: absolute; left: 18px; top: 8px; bottom: 8px; width: 1px; background: var(--rule-strong); }\n.spined .sp-sec { position: relative; padding-bottom: 44px; }\n.spined .sp-sec::before {\n  content: \"\"; position: absolute; left: -32.5px; top: 7px;\n  width: 10px; height: 10px; border-radius: 50%;\n  background: var(--paper); border: 1.5px solid var(--rule-strong);\n}\n.spined .sp-sec.is-here::before { background: var(--thread); border-color: var(--thread); }\n.sp-label { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.sp-sec.is-here > .sp-label { color: var(--ink); font-weight: 600; }\n.sp-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 6px 0 4px; }\n\n/* register spine tints \u2014 the current section is lit (a key moment:\n   the spine is the thread inside the room) */\n.spined .sp-sec.is-here::before { box-shadow: 0 0 0 3px rgba(79,70,229,0.13), 0 0 12px rgba(79,70,229,0.45); }\n.room[data-register=\"air\"] .spined::before { background: rgba(70,85,122,0.3); }\n.room[data-register=\"air\"] .spined .sp-sec::before { background: var(--air-tint); border-color: rgba(70,85,122,0.45); }\n.room[data-register=\"air\"] .spined .sp-sec.is-here::before { background: var(--st-explore); border-color: var(--st-explore); box-shadow: 0 0 0 3px rgba(61,104,238,0.13), 0 0 12px rgba(61,104,238,0.5); }\n.room[data-register=\"air\"] .sp-label { color: #5A6B94; }\n.room[data-register=\"press\"] .spined::before { background: rgba(74,70,120,0.3); }\n.room[data-register=\"press\"] .spined .sp-sec::before { background: var(--press-tint); border-color: rgba(74,70,120,0.45); }\n.room[data-register=\"press\"] .spined .sp-sec.is-here::before { background: var(--st-deep); border-color: var(--st-deep); }\n.room[data-register=\"press\"] .sp-label { color: #6E6A92; }\n\n/* ---------- footer ---------- */\n.room-foot { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 20px; }\n.room-foot p { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.06em; color: var(--ink-4); }\n.room-foot a { color: var(--ink-3); }\n\n/* ---------- utility ---------- */\n.stack-8  > * + * { margin-top: 8px; }\n.stack-14 > * + * { margin-top: 14px; }\n.stack-18 > * + * { margin-top: 18px; }\n.row { display: flex; align-items: center; gap: 12px; }\n\n<\/style>\n<style>\n  .room-inner { max-width: 1080px; }\n\n  .braid-row { display: grid; grid-template-columns: 1fr 300px; gap: 18px; margin-top: 36px; align-items: start; }\n\n  /* the canvas */\n  .braid-canvas { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 26px 20px 18px; overflow-x: auto; }\n  .braid-canvas svg { display: block; min-width: 700px; }\n  .braid-canvas text { font-family: var(--font-instrument); font-size: 10.5px; fill: var(--ink-2); letter-spacing: 0.03em; }\n  /* the live line is lit \u2014 the braid is a key moment */\n  .braid-canvas svg path[stroke=\"#4F46E5\"] { filter: drop-shadow(0 0 3px rgba(79,70,229,0.5)); }\n  .braid-canvas svg circle[fill=\"#4F46E5\"] { filter: drop-shadow(0 0 6px rgba(79,70,229,0.65)); }\n\n  /* the timeline \u2014 scrub the family through time */\n  .timeline { display: flex; align-items: center; gap: 16px; margin-top: 14px; padding: 12px 18px; }\n  .timeline .tl-play { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--rule-strong); background: var(--paper-high); color: var(--ink-2); font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }\n  .timeline .tl-track { flex: 1; display: flex; align-items: center; gap: 0; }\n  .timeline .tl-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; }\n  .timeline .tl-day::before { content: \"\"; position: absolute; top: 3.5px; left: 0; right: 0; height: 1px; background: var(--rule); }\n  .timeline .tl-mark { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); position: relative; z-index: 1; }\n  .timeline .tl-day.has-fork .tl-mark { background: var(--st-evolve); }\n  .timeline .tl-day.is-now .tl-mark { width: 11px; height: 11px; background: var(--st-deep); box-shadow: 0 0 0 3px rgba(79,70,229,0.13), 0 0 12px rgba(79,70,229,0.5); }\n  .timeline .tl-date { font-family: var(--font-instrument); font-size: 9.5px; color: var(--ink-4); letter-spacing: 0.05em; }\n  .timeline .tl-day.is-now .tl-date { color: var(--st-deep); font-weight: 600; }\n  .braid-canvas .t-title { font-size: 12px; fill: var(--ink); font-weight: 600; }\n  .braid-canvas .t-faint { fill: var(--ink-4); }\n  .braid-canvas .t-delta { fill: var(--ink-2); font-weight: 600; }\n  .braid-canvas .dead { opacity: 0.4; }\n  .canvas-tools { display: flex; align-items: center; gap: 8px; padding: 10px 4px 0; border-top: 1px solid var(--rule); margin-top: 12px; }\n  .canvas-tools .fchip { font-family: var(--font-instrument); font-size: 10.5px; letter-spacing: 0.05em; padding: 3px 10px; border-radius: var(--r-1); border: 1px solid var(--rule); background: var(--paper-high); color: var(--ink-2); cursor: pointer; }\n  .canvas-tools .fchip.is-on { border-color: var(--ink); color: var(--ink); font-weight: 600; }\n  .canvas-tools .ct-note { margin-left: auto; font-family: var(--font-instrument); font-size: 10px; color: var(--ink-4); letter-spacing: 0.05em; }\n\n  /* inspector */\n  .inspector { padding: 20px 22px; }\n  .inspector .in-stamp { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }\n  .inspector .lead-pill { font-size: 8.5px; border: 1px solid var(--rule-strong); border-radius: var(--r-1); padding: 1px 6px; color: var(--ink-2); letter-spacing: 0.1em; }\n  .inspector h3 { font-family: var(--font-author); font-weight: 500; font-size: 18px; margin: 10px 0 8px; }\n  .inspector .in-read { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }\n  .in-sec { padding: 12px 0; border-top: 1px solid var(--rule); }\n  .in-sec .is-k { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }\n  .in-sec p { font-size: var(--fs-12); color: var(--ink-2); line-height: 1.6; }\n  .in-sec .delta-chip { display: inline-block; font-family: var(--font-instrument); font-size: 10px; color: var(--ink-2); border: 1px solid var(--rule); border-radius: var(--r-1); padding: 1px 7px; margin: 2px 3px 0 0; }\n  .in-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }\n  .in-actions .btn { justify-content: flex-start; font-size: var(--fs-12); padding: 7px 12px; }\n<\/style>\n<\/head>\n<body>\n\n  <aside class=\"rail\">\n    <div class=\"rail-brand\">\n      <svg width=\"34\" height=\"16\" viewBox=\"0 0 150 54\" fill=\"none\"><path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\" stroke=\"#4F46E5\" stroke-width=\"7\" stroke-linecap=\"round\"/><\/svg>\n      <span class=\"rb-name\">IdeaLoop<\/span>\n    <\/div>\n    <nav class=\"rail-nav\">\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/02-desk.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 10.5 H13.5 M3 10.5 V13 M12 10.5 V13 M4.5 10.5 V6.5 A3 3 0 0 1 10.5 6.5 V10.5\"/><\/svg>\n        The Desk\n      <\/a>\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/03-shelves.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 5 H13.5 M1.5 10.5 H13.5 M4 5 V2.5 M8 5 V3.5 M6 10.5 V8 M11 10.5 V8.5\"/><\/svg>\n        The Shelves\n      <\/a>\n    <\/nav>\n    <div class=\"rail-spacer\"><\/div>\n    <div class=\"rail-util\">\n      <a class=\"rail-item\" href=\"#\">Settings<\/a>\n      <a class=\"rail-item\" href=\"#\">My plan<\/a>\n      <a class=\"rail-item\" href=\"#\">Get help<\/a>\n    <\/div>\n    <div class=\"rail-account\"><span class=\"ra-dot\">e<\/span><span class=\"ra-mail\">emre@idealoopcore.com<\/span><\/div>\n  <\/aside>\n\n  <div class=\"main\">\n    <div class=\"topbar\">\n      <span class=\"tp-room\">lineage \u00b7 the braid<\/span>\n      <span class=\"tp-status\">beta \u00b7 free \u2014 <b>1 run<\/b> this week \u00b7 refills thu<\/span>\n    <\/div>\n\n    <div class=\"threadctx\">\n      <div class=\"threadctx-inner\">\n        <div class=\"tc-title\">\n          <div class=\"tt-name\">Invoice hand-off for solo bookkeepers<\/div>\n          <div class=\"tt-meta\">family of 5 \u00b7 zoomed out to the whole braid<\/div>\n        <\/div>\n        <span class=\"tc-journey\" style=\"margin-left:8px;\">the one place the journey unrolls \u2014 every state, every fork, nothing erased<\/span>\n        <a class=\"btn btn-quiet tc-close\" href=\"#\" data-nav=\"rooms/05-deep.html\" style=\"font-size:12px;\">zoom back in \u27f6<\/a>\n      <\/div>\n    <\/div>\n\n    <main class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">lineage \u00b7 selection, not evolution<\/span>\n        <h1 class=\"room-title\">Where this family went<\/h1>\n        <p class=\"room-lede\">A phylogenetic tree, not a progress bar. Live, parked, and killed\n          branches all stay visible \u2014 the light marks the live line only. Liveness,\n          never merit.<\/p>\n\n        <div class=\"braid-row\">\n          <div class=\"braid-canvas\">\n            <svg width=\"740\" height=\"300\" viewBox=\"0 0 740 300\" fill=\"none\">\n              <!-- generation guides -->\n              <text class=\"t-faint\" x=\"14\" y=\"18\">GEN 0 \u00b7 SEED<\/text>\n              <text class=\"t-faint\" x=\"240\" y=\"18\">GEN 1 \u00b7 THE FAN<\/text>\n              <text class=\"t-faint\" x=\"470\" y=\"18\">GEN 2 \u00b7 UNDER PRESSURE<\/text>\n\n              <!-- live line: root -> explored -> v2 (selected) -->\n              <path d=\"M40 150 L250 150\" stroke=\"#4F46E5\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n              <path d=\"M250 150 C 320 150 330 84 400 80 L 500 80\" stroke=\"#4F46E5\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n              <path d=\"M500 80 L 720 80\" stroke=\"#4F46E5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"1 7\"/>\n\n              <!-- saved branch (rough child, alive but unread) -->\n              <path d=\"M250 150 L 500 150\" stroke=\"#767C8C\" stroke-width=\"1.3\" stroke-linecap=\"round\"/>\n\n              <!-- killed branch -->\n              <g class=\"dead\">\n                <path d=\"M250 150 C 315 150 325 222 395 226 L 490 226\" stroke=\"#767C8C\" stroke-width=\"1.3\" stroke-linecap=\"round\"/>\n                <path d=\"M484 220 L 496 232 M496 220 L 484 232\" stroke=\"#767C8C\" stroke-width=\"1.3\" stroke-linecap=\"round\"/>\n              <\/g>\n\n              <!-- nodes -->\n              <circle cx=\"40\" cy=\"150\" r=\"6\" fill=\"#FBFCFE\" stroke=\"#767C8C\" stroke-width=\"1.5\"/>\n              <text x=\"24\" y=\"176\">\u270e root \u00b7 jul 12<\/text>\n\n              <circle cx=\"250\" cy=\"150\" r=\"6\" fill=\"#767C8C\"/>\n              <text x=\"222\" y=\"176\">\u25ce explored \u00b7 jul 22<\/text>\n              <text class=\"t-faint\" x=\"222\" y=\"190\">3 angles fanned<\/text>\n\n              <!-- selected node: v2 -->\n              <circle cx=\"500\" cy=\"80\" r=\"9\" fill=\"#4F46E5\"/>\n              <circle cx=\"500\" cy=\"80\" r=\"14\" fill=\"none\" stroke=\"#4F46E5\" stroke-width=\"1\" opacity=\"0.35\"/>\n              <text class=\"t-title\" x=\"446\" y=\"56\">\u2316 v2 \u00b7 forward-to-file<\/text>\n              <text x=\"522\" y=\"103\">5.8 \u00b7 lead<\/text>\n\n              <!-- edge delta on live edge -->\n              <rect x=\"316\" y=\"98\" width=\"88\" height=\"18\" rx=\"2\" fill=\"#FBFCFE\" stroke=\"rgba(22,24,29,0.14)\"/>\n              <text class=\"t-delta\" x=\"324\" y=\"111\">graduated \u2316<\/text>\n\n              <circle cx=\"500\" cy=\"150\" r=\"6\" fill=\"#FBFCFE\" stroke=\"#767C8C\" stroke-width=\"1.5\"/>\n              <text x=\"474\" y=\"176\">\u270e trades wedge<\/text>\n              <text class=\"t-faint\" x=\"474\" y=\"190\">saved branch \u00b7 unread<\/text>\n\n              <g class=\"dead\">\n                <circle cx=\"490\" cy=\"226\" r=\"6\" fill=\"#FBFCFE\" stroke=\"#767C8C\" stroke-width=\"1.5\"/>\n                <text x=\"428\" y=\"252\">\u2316 v1 \u00b7 scanner app<\/text>\n                <text x=\"428\" y=\"266\">killed jul 18 \u2014 evidence kept<\/text>\n              <\/g>\n            <\/svg>\n            <div class=\"canvas-tools\">\n              <button class=\"fchip is-on\">whole family<\/button>\n              <button class=\"fchip\">live only<\/button>\n              <button class=\"fchip\">deep reads<\/button>\n              <span class=\"ct-note\">drag to pan \u00b7 wheel to zoom \u00b7 click a node to inspect<\/span>\n            <\/div>\n            <div class=\"timeline\">\n              <button class=\"tl-play\" title=\"replay the family\">\u25b8<\/button>\n              <div class=\"tl-track\">\n                <div class=\"tl-day\"><span class=\"tl-mark\"><\/span><span class=\"tl-date\">jul 12<\/span><\/div>\n                <div class=\"tl-day\"><span class=\"tl-mark\"><\/span><span class=\"tl-date\">jul 14<\/span><\/div>\n                <div class=\"tl-day has-fork\"><span class=\"tl-mark\"><\/span><span class=\"tl-date\">jul 18<\/span><\/div>\n                <div class=\"tl-day has-fork\"><span class=\"tl-mark\"><\/span><span class=\"tl-date\">jul 22<\/span><\/div>\n                <div class=\"tl-day is-now\"><span class=\"tl-mark\"><\/span><span class=\"tl-date\">jul 26<\/span><\/div>\n                <div class=\"tl-day\"><span class=\"tl-mark\" style=\"background:transparent;border:1px solid var(--ink-4);\"><\/span><span class=\"tl-date\">today<\/span><\/div>\n              <\/div>\n            <\/div>\n          <\/div>\n\n          <aside class=\"inspector card\">\n            <div class=\"in-stamp\">\u2316 deep \u00b7 v2 <span class=\"lead-pill\">LEAD<\/span><\/div>\n            <h3>Forward-to-file: no app at all<\/h3>\n            <div class=\"in-read\">\n              <span class=\"score-pill\"><span class=\"sp-band mid\"><\/span>5.8<\/span>\n              <span class=\"handle\" style=\"font-size:11px;\">read jul 26 \u00b7 watched quarterly<\/span>\n            <\/div>\n            <div class=\"in-sec\">\n              <span class=\"is-k\">vs. its parent<\/span>\n              <p>Graduated from the explored root \u2014 the email-native angle taken forward whole.<\/p>\n              <span class=\"delta-chip\">mechanism \u00b7 new<\/span>\n              <span class=\"delta-chip\">target \u00b7 narrowed<\/span>\n            <\/div>\n            <div class=\"in-sec\">\n              <span class=\"is-k\">why it leads<\/span>\n              <p>Lead is a marker you place \u2014 the braid never crowns a branch by itself.<\/p>\n            <\/div>\n            <div class=\"in-actions\">\n              <a class=\"btn\" href=\"#\" data-nav=\"rooms/06-evolve.html\">Evolve this version \u2192<\/a>\n              <a class=\"btn\" href=\"#\" data-nav=\"rooms/07-compare.html\">Add to compare<\/a>\n              <button class=\"btn btn-quiet\">Make standalone idea<\/button>\n            <\/div>\n          <\/aside>\n        <\/div>\n\n        <div class=\"room-foot\">\n          <p>Nothing here is erased. A killed branch keeps its evidence \u2014 that's the tuition. \u00b7 <a href=\"#\">how the braid works<\/a><\/p>\n          <p>room 8 of 9 \u00b7 neutral register \u00b7 zoomed out<\/p>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "rooms/09-brief.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 Room 9 \u2014 The Brief, the Handoff<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 22
