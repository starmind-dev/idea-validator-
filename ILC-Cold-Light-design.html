 this week \u00b7 refills thu<\/span>\n    <\/div>\n\n    <!-- thread context: slides in when a thread is picked up, survives every cut inside the idea -->\n    <div class=\"threadctx\" id=\"threadctx\">\n      <div class=\"threadctx-inner\">\n        <div class=\"tc-title\">\n          <div class=\"tt-name\">Invoice hand-off for solo bookkeepers<\/div>\n          <div class=\"tt-meta\">family of 3 \u00b7 root \u00b7 watched quarterly<\/div>\n        <\/div>\n        <div class=\"statelens\" id=\"statelens\"><\/div>\n        <span class=\"tc-journey\" id=\"tcjourney\">one state in focus \u00b7 the journey lives in lineage<\/span>\n        <button class=\"btn btn-quiet tc-close\" data-goto=\"desk\" style=\"font-size:12px;\">put down \u27f6 desk<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"room-viewport\"><div id=\"roomHost\"><\/div><\/div>\n  <\/div>\n\n  <!-- ============ ROOM TEMPLATES ============ -->\n\n  <template id=\"tpl-desk\">\n    <div class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">the desk<\/span>\n        <h1 class=\"room-title\">Where you left off<\/h1>\n        <p class=\"room-lede\">Every idea, still in the loop. Memory is global \u2014 thinking happens\n          on a thread. Pick one up, or bring a new one.<\/p>\n\n        <div class=\"desk-grid\">\n          <div class=\"card\">\n            <span class=\"c-eyebrow\">continue<\/span>\n            <h3>Invoice hand-off for solo bookkeepers<\/h3>\n            <div class=\"statelens st-explore\" style=\"margin:14px 0 12px;\">\n              <span class=\"sl-dot past\" title=\"captured\"><\/span>\n              <span class=\"sl-here\"><span class=\"sl-core\"><\/span><span class=\"sl-label\">explored<\/span><\/span>\n              <span class=\"sl-dot open\" title=\"deep\"><\/span>\n              <span class=\"sl-dot open\" title=\"evolve\"><\/span>\n              <span class=\"sl-dot open\" title=\"compare\"><\/span>\n              <span class=\"sl-dot open\" title=\"brief\"><\/span>\n            <\/div>\n            <p>Explored six days ago \u2014 three angles open, none taken forward yet.<\/p>\n            <div class=\"c-actions\">\n              <button class=\"btn btn-primary\" data-goto=\"explore\">Pick up the thread<\/button>\n            <\/div>\n          <\/div>\n          <div class=\"card\">\n            <span class=\"c-eyebrow\">needs your move<\/span>\n            <h3 style=\"font-size:17px;\">The landscape moved<\/h3>\n            <p>Evidence Watch found two new actors near the wedge of\n              <em>Receipt inbox<\/em>. The idea text is unchanged \u2014 only the world moved.<\/p>\n            <div class=\"c-actions\"><button class=\"btn\" style=\"font-size:12.5px;\">Re-read on new evidence<\/button><\/div>\n          <\/div>\n        <\/div>\n\n        <div style=\"margin-top:44px;\">\n          <span class=\"room-eyebrow\">start with how you want to think<\/span>\n          <div class=\"doors\">\n            <button class=\"door door-air\" data-goto=\"explore\">\n              <span class=\"d-tag\">explore \u00b7 widen<\/span>\n              <h4>What could this become?<\/h4>\n              <p>A rough idea fans into angles. No score, no rank, no verdict \u2014 the aperture opens.<\/p>\n            <\/button>\n            <button class=\"door door-press\" data-goto=\"deep\">\n              <span class=\"d-tag\">deep \u00b7 pressure<\/span>\n              <h4>Does this hold?<\/h4>\n              <p>One serious version, held against the evidence. Harsh, fair, traceable.<\/p>\n            <\/button>\n          <\/div>\n        <\/div>\n        <div class=\"demo-hint\">shell demo \u00b7 desk = neutral register \u00b7 doors carry the two apertures<\/div>\n      <\/div>\n    <\/div>\n  <\/template>\n\n  <template id=\"tpl-shelves\">\n    <div class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">the shelves<\/span>\n        <h1 class=\"room-title\">All your threads<\/h1>\n        <p class=\"room-lede\">Two shelves: rough ideas waiting for a first pass, and families with\n          reads. One card per family, pinned to its root.<\/p>\n        <div style=\"margin-top:36px;\">\n          <span class=\"room-eyebrow\" style=\"font-size:10px;\">rough ideas \u00b7 2<\/span>\n          <div class=\"desk-grid\" style=\"grid-template-columns:1fr 1fr; margin-top:12px;\">\n            <div class=\"card\"><span class=\"c-eyebrow\">\u270e rough<\/span><h3 style=\"font-size:17px;\">Meal-plan hand-me-downs<\/h3><p>Captured jul 14 \u00b7 two doors open<\/p><\/div>\n            <div class=\"card\"><span class=\"c-eyebrow\">\u270e rough<\/span><h3 style=\"font-size:17px;\">Contractor punch-list voice notes<\/h3><p>Captured jul 20 \u00b7 two doors open<\/p><\/div>\n          <\/div>\n        <\/div>\n        <div style=\"margin-top:34px;\">\n          <span class=\"room-eyebrow\" style=\"font-size:10px;\">ideas \u00b7 3 families<\/span>\n          <div class=\"desk-grid\" style=\"grid-template-columns:1fr 1fr; margin-top:12px;\">\n            <div class=\"card\">\n              <span class=\"c-eyebrow\">\u2316 deep \u00b7 read jul 22<\/span>\n              <h3 style=\"font-size:17px;\">Receipt inbox<\/h3>\n              <div style=\"display:flex; align-items:center; gap:10px; margin:10px 0 6px;\">\n                <span class=\"score-pill\"><span class=\"sp-band mid\"><\/span>5.8<\/span>\n                <span class=\"handle\" style=\"font-size:11.5px;\">holds at rung 4 \u2014 distribution is the binding constraint<\/span>\n              <\/div>\n              <p style=\"font-size:12px;\">\u2442 3 versions \u00b7 lineage<\/p>\n            <\/div>\n            <div class=\"card\">\n              <span class=\"c-eyebrow\">\u25ce explored \u00b7 jul 22<\/span>\n              <h3 style=\"font-size:17px;\">Invoice hand-off for solo bookkeepers<\/h3>\n              <p style=\"margin-top:8px;\">Three angles open \u00b7 no verdict \u2014 exploration doesn't score.<\/p>\n              <div class=\"c-actions\"><button class=\"btn\" style=\"font-size:12px;\" data-goto=\"explore\">Open the room<\/button><\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"demo-hint\">shell demo \u00b7 shelves = neutral register \u00b7 a family card always shows its root<\/div>\n      <\/div>\n    <\/div>\n  <\/template>\n\n  <template id=\"tpl-explore\">\n    <div class=\"room\" data-register=\"air\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">explore \u00b7 the widening<\/span>\n        <h1 class=\"room-title\">What could this become?<\/h1>\n        <p class=\"room-lede\">Our read, then the fan. Three angles in fan order \u2014 not ranked.\n          Every strand points at a named piece of evidence or it was dropped.<\/p>\n\n        <div class=\"fan-wrap\" id=\"fanWrap\">\n          <svg class=\"fan-svg\" viewBox=\"0 0 880 120\" preserveAspectRatio=\"none\">\n            <path class=\"seed-line\" d=\"M0 100 L340 100\"/>\n            <path id=\"strand-0\" d=\"M340 100 C 420 100 450 30 560 24 L 880 24\"/>\n            <path id=\"strand-1\" d=\"M340 100 C 430 100 470 66 580 62 L 880 62\"/>\n            <path id=\"strand-2\" d=\"M340 100 C 430 100 480 100 590 100 L 880 100\"/>\n          <\/svg>\n          <div class=\"fan-note\">fan order \u00b7 not ranked<\/div>\n          <div class=\"angles\">\n            <div class=\"angle-card\" data-strand=\"0\">\n              <span class=\"a-basis\">positioning \u00b7 lane: unclaimed hand-off<\/span>\n              <h4>The bookkeeper's inbox, not the founder's scanner<\/h4>\n              <p>Sell to the bookkeeper who receives the mess, not the client who makes it.\n                 Opening rests on <span class=\"evidence-link\">r/bookkeeping<\/span> friction threads.<\/p>\n              <div class=\"a-actions\">\n                <button class=\"btn\">Save as branch<\/button>\n                <button class=\"btn btn-primary grad-btn\" data-strand=\"0\">Take to deep \u2192<\/button>\n              <\/div>\n            <\/div>\n            <div class=\"angle-card\" data-strand=\"1\">\n              <span class=\"a-basis\">mechanism \u00b7 lane: email-native<\/span>\n              <h4>Forward-to-file: no app at all<\/h4>\n              <p>The entire product is an email address. Bet: adoption friction is the real\n                 moat gap. Disconfirmer: <span class=\"evidence-link\">docparser<\/span> already half-serves it.<\/p>\n              <div class=\"a-actions\">\n                <button class=\"btn\">Save as branch<\/button>\n                <button class=\"btn btn-primary grad-btn\" data-strand=\"1\">Take to deep \u2192<\/button>\n              <\/div>\n            <\/div>\n            <div class=\"angle-card\" data-strand=\"2\">\n              <span class=\"a-basis\">target \u00b7 lane: vertical wedge<\/span>\n              <h4>Trades first: plumbers' paper glove-boxes<\/h4>\n              <p>Narrowest wedge with the loudest pain. Evidence is thin here \u2014\n                 <span class=\"absence-chip\">not in the evidence<\/span> a named buyer.<\/p>\n              <div class=\"a-actions\">\n                <button class=\"btn\">Save as branch<\/button>\n                <button class=\"btn btn-primary grad-btn\" data-strand=\"2\">Take to deep \u2192<\/button>\n              <\/div>\n            <\/div>\n          <\/div>\n        <\/div>\n        <div class=\"demo-hint\">shell demo \u00b7 open-air register \u00b7 \u201ctake to deep\u201d runs the graduation motion \u2014\n          the strand pulls taut and becomes the thread deep hangs from<\/div>\n      <\/div>\n    <\/div>\n  <\/template>\n\n  <template id=\"tpl-deep\">\n    <div class=\"room\" data-register=\"press\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">deep \u00b7 the pressure room<\/span>\n        <h1 class=\"room-title\">Does this hold?<\/h1>\n        <p class=\"room-lede\">Five movements on one spine. The number never appears before the read.\n          Same evidence as Explore \u2014 a different job.<\/p>\n\n        <div class=\"deep-spine\">\n          <div class=\"mv is-here\">\n            <div class=\"mv-label\">\u2160 \u00b7 the read<\/div>\n            <div class=\"mv-card\">\n              <p class=\"v-author\">The evidence supports a narrow, real friction \u2014 and puts the\n                weight of this bet on distribution, not on the build.<\/p>\n              <div style=\"display:flex; align-items:center; gap:12px; margin-top:12px;\">\n                <span class=\"score-pill\"><span class=\"sp-band mid\"><\/span>5.8 overall<\/span>\n                <span class=\"handle\" style=\"font-size:11.5px;\">what would move it: a named repeat buyer in the wedge \u2197<\/span>\n              <\/div>\n            <\/div>\n          <\/div>\n          <div class=\"mv\">\n            <div class=\"mv-label\">\u2161 \u00b7 findings<\/div>\n            <div class=\"mv-card\"><p>Four metrics, each with its ladder, its question gates, its\n              receipts, and its gap panel \u2014 the evidence visibly produces the number.<\/p><\/div>\n          <\/div>\n          <div class=\"mv\">\n            <div class=\"mv-label\">\u2162 \u00b7 the field<\/div>\n            <div class=\"mv-card\"><p><span class=\"evidence-link\">Mainline OCR<\/span>,\n              <span class=\"evidence-link\">docparser<\/span>, and a baseline of spreadsheet habit.\n              Every actor breathes at the same amplitude \u2014 motion is never a verdict channel.<\/p><\/div>\n          <\/div>\n          <div class=\"mv\">\n            <div class=\"mv-label\">\u2163 \u00b7 the build<\/div>\n            <div class=\"mv-card\"><p>TC as an equation: the idea, for anyone \u2212 your background = for\n              you. A weather report, not a verdict.<\/p><\/div>\n          <\/div>\n          <div class=\"mv\">\n            <div class=\"mv-label\">\u2164 \u00b7 the hinge<\/div>\n            <div class=\"mv-card\"><p class=\"v-author\" style=\"font-size:16px;\">The read stops here.\n              The facts are checkable \u2014 and the next move is yours to make.<\/p><\/div>\n          <\/div>\n        <\/div>\n        <div style=\"display:flex; gap:10px; margin-top:8px;\">\n          <button class=\"btn\" data-goto=\"brief\">Execution brief \u2192<\/button>\n          <button class=\"btn\" data-goto=\"compare\">Add to compare<\/button>\n          <button class=\"btn btn-quiet\" data-goto=\"lineage\">See the braid<\/button>\n        <\/div>\n        <div class=\"demo-hint\">shell demo \u00b7 pressure register \u00b7 arrived by settling inward \u2014 never by fanfare<\/div>\n      <\/div>\n    <\/div>\n  <\/template>\n\n  <template id=\"tpl-compare\">\n    <div class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">compare \u00b7 the seam<\/span>\n        <h1 class=\"room-title\">Which bet is heavier?<\/h1>\n        <p class=\"room-lede\">Two threads at one moment. The connector explains the weight of a\n          difference \u2014 never a cause. The display defers to the scores.<\/p>\n        <div class=\"seam-grid\">\n          <div class=\"seam-col\">\n            <div class=\"sc-name\">Invoice hand-off<\/div>\n            <div class=\"sc-meta\">read jul 26 \u00b7 <span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band mid\"><\/span>5.8<\/span><\/div>\n            <div class=\"rung\"><span class=\"r-dim\">demand<\/span><p>Named friction, thin repeat signal.<\/p><\/div>\n            <div class=\"rung\"><span class=\"r-dim\">payment<\/span><p>First dollar plausible at the bookkeeper.<\/p><\/div>\n            <div class=\"rung\"><span class=\"r-dim\">positioning<\/span><p>Wedge open; two adjacent actors.<\/p><\/div>\n          <\/div>\n          <div class=\"seam-col\">\n            <div class=\"sc-name\">Receipt inbox<\/div>\n            <div class=\"sc-meta\">read jul 22 \u00b7 <span class=\"score-pill\" style=\"padding:1px 7px;\"><span class=\"sp-band mid\"><\/span>5.2<\/span><\/div>\n            <div class=\"rung\"><span class=\"r-dim\">demand<\/span><p>Broader pain, noisier evidence.<\/p><\/div>\n            <div class=\"rung\"><span class=\"r-dim\">payment<\/span><p>Consumer-adjacent \u2014 slower first dollar.<\/p><\/div>\n            <div class=\"rung\"><span class=\"r-dim\">positioning<\/span><p>Crowded lane, one live substitute.<\/p><\/div>\n          <\/div>\n        <\/div>\n        <div class=\"demo-hint\">shell demo \u00b7 the field splits at a seam \u00b7 deep \u00d7 deep only \u2014 comparison is an evaluative act<\/div>\n      <\/div>\n    <\/div>\n  <\/template>\n\n  <template id=\"tpl-lineage\">\n    <div class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">lineage \u00b7 the braid<\/span>\n        <h1 class=\"room-title\">Where this family went<\/h1>\n        <p class=\"room-lede\">A phylogenetic tree, not a progress bar. Live, pruned, and dead\n          branches all stay visible \u2014 selection, not evolution.<\/p>\n        <div class=\"braid\">\n          <svg width=\"820\" height=\"220\" viewBox=\"0 0 820 220\" fill=\"none\">\n            <!-- trunk -->\n            <path d=\"M30 110 L200 110\" stroke=\"#4F46E5\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n            <!-- branch up (live, lead) -->\n            <path d=\"M200 110 C 260 110 270 50 330 46 L 560 46\" stroke=\"#4F46E5\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n            <path d=\"M560 46 L 790 46\" stroke=\"#4F46E5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"1 7\"/>\n            <!-- branch mid (parked) -->\n            <path class=\"b-dead\" d=\"M200 110 L 470 110\" stroke=\"#767C8C\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>\n            <!-- branch down (killed) -->\n            <path class=\"b-dead\" d=\"M200 110 C 250 110 260 172 320 176 L 430 176\" stroke=\"#767C8C\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>\n            <path class=\"b-dead\" d=\"M424 170 L 436 182 M436 170 L 424 182\" stroke=\"#767C8C\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>\n            <!-- nodes -->\n            <circle cx=\"30\" cy=\"110\" r=\"5\" fill=\"#FBFCFE\" stroke=\"#767C8C\" stroke-width=\"1.5\"/>\n            <circle cx=\"200\" cy=\"110\" r=\"5\" fill=\"#767C8C\"/>\n            <circle cx=\"560\" cy=\"46\" r=\"6\" fill=\"#4F46E5\"/>\n            <circle cx=\"470\" cy=\"110\" r=\"5\" fill=\"#FBFCFE\" stroke=\"#767C8C\" stroke-width=\"1.5\"/>\n            <text x=\"22\" y=\"132\">root \u00b7 captured<\/text>\n            <text x=\"168\" y=\"132\">explored \u00b7 3 angles<\/text>\n            <text x=\"520\" y=\"26\">v3 \u00b7 deep 5.8 \u00b7 lead<\/text>\n            <text x=\"446\" y=\"132\" class=\"b-dead\">v2 \u00b7 parked<\/text>\n            <text x=\"300\" y=\"200\" class=\"b-dead\">v1 \u00b7 killed \u2014 evidence, kept<\/text>\n          <\/svg>\n        <\/div>\n        <div class=\"demo-hint\">shell demo \u00b7 arrived by zooming out \u00b7 the light marks the live line only \u2014\n          liveness, not merit<\/div>\n      <\/div>\n    <\/div>\n  <\/template>\n\n  <template id=\"tpl-brief\">\n    <div class=\"room\" data-register=\"neutral\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">the brief \u00b7 the handoff<\/span>\n        <h1 class=\"room-title\">Your first move<\/h1>\n        <p class=\"room-lede\">Six blocks: the bet, what to prove next, the order, what won't count,\n          the gates, the handoff. Opens and closes in the author's voice.<\/p>\n        <div class=\"card\" style=\"margin-top:36px; padding:28px 32px;\">\n          <span class=\"c-eyebrow\">the bet<\/span>\n          <p class=\"v-author-italic\" style=\"font-size:19px; margin-top:10px; max-width:52ch;\">You are\n            betting that a bookkeeper will hand her inbox to a stranger's software before she will\n            hire another pair of hands \u2014 and the evidence says the friction is real, but the trust\n            is unproven.<\/p>\n        <\/div>\n        <div class=\"brief-close\">\n          <span class=\"c-eyebrow\">the handoff<\/span>\n          <p class=\"v-author-italic\" style=\"margin-top:10px;\">Over to you \u2014 it's yours now.<\/p>\n          <svg class=\"brief-exit-svg\" viewBox=\"0 0 880 40\" preserveAspectRatio=\"none\">\n            <path d=\"M0 20 L 640 20\" stroke=\"#4F46E5\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n            <path d=\"M640 20 L 880 20\" stroke=\"#4F46E5\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-dasharray=\"1 8\"/>\n          <\/svg>\n        <\/div>\n        <div class=\"demo-hint\">shell demo \u00b7 the thread runs off the page edge, uncut \u2014 handed over, never ended<\/div>\n      <\/div>\n    <\/div>\n  <\/template>\n\n<script>\n  /* ============ THE GRAMMAR ============\n     One motion per navigation; direction invariant.\n     Something always survives the cut: the rail globally,\n     the thread context inside an idea.                    */\n\n  const host = document.getElementById('roomHost');\n  const threadctx = document.getElementById('threadctx');\n  const tpRoom = document.getElementById('tpRoom');\n  const railItems = document.querySelectorAll('.rail-nav .rail-item');\n\n  const ROOMS = {\n    desk:    { tpl: 'tpl-desk',    label: 'the desk',              thread: false },\n    shelves: { tpl: 'tpl-shelves', label: 'the shelves',           thread: false },\n    explore: { tpl: 'tpl-explore', label: 'explore \u00b7 the widening',thread: true  },\n    deep:    { tpl: 'tpl-deep',    label: 'deep \u00b7 the pressure room', thread: true },\n    compare: { tpl: 'tpl-compare', label: 'compare \u00b7 the seam',    thread: true  },\n    lineage: { tpl: 'tpl-lineage', label: 'lineage \u00b7 the braid',   thread: true  },\n    brief:   { tpl: 'tpl-brief',   label: 'the brief \u00b7 the handoff', thread: true },\n  };\n\n  // fixed direction per destination (the invariant grammar)\n  const MOTION = {\n    desk: 'm-widen', shelves: 'm-widen',\n    explore: 'm-widen', deep: 'm-pressure',\n    compare: 'm-seam', lineage: 'm-zoom-out', brief: 'm-along-fwd',\n  };\n  const ORDER = ['explore', 'deep', 'compare', 'brief']; // along the thread\n\n  let current = 'desk';\n  let deepDone = false;\n\n  function render(key, motionOverride) {\n    const room = ROOMS[key];\n    const tpl = document.getElementById(room.tpl);\n    host.innerHTML = '';\n    const node = tpl.content.cloneNode(true);\n    host.appendChild(node);\n    const el = host.querySelector('.room');\n\n    // along-thread backward beats the default motion\n    let motion = motionOverride || MOTION[key];\n    if (!motionOverride && room.thread && ROOMS[current] && ROOMS[current].thread) {\n      const from = ORDER.indexOf(current), to = ORDER.indexOf(key);\n      if (from > -1 && to > -1) motion = to >= from ? 'm-along-fwd' : 'm-along-back';\n      if (key === 'compare') motion = 'm-seam';\n      if (key === 'lineage') motion = 'm-zoom-out';\n    }\n    if (motion === 'm-seam') { el.classList.add('m-seam', 'm-widen'); }\n    else { el.classList.add(motion); }\n\n    // chrome state \u2014 what survives the cut\n    threadctx.classList.toggle('is-open', room.thread);\n    tpRoom.textContent = room.label;\n    railItems.forEach(b => b.classList.toggle('is-active', b.dataset.goto === key));\n    document.querySelector('.room-viewport').scrollTop = 0;\n    if (room.thread) renderLens(key);\n\n    current = key;\n    wire(host);\n  }\n\n  // the state lens: one state lit, the rest are ghost dots.\n  // the full journey never unrolls here \u2014 that's lineage's job.\n  const STATES = ['captured', 'explored', 'deep', 'evolve', 'compare', 'brief'];\n  const ST_CLASS = ['st-rough', 'st-explore', 'st-deep', 'st-evolve', 'st-compare', 'st-brief'];\n  const ROOM_STATE = { explore: 1, deep: 2, compare: 4, brief: 5, lineage: -1 };\n  function renderLens(key) {\n    const lens = document.getElementById('statelens');\n    const journey = document.getElementById('tcjourney');\n    const idx = ROOM_STATE[key];\n    if (idx === undefined) { lens.style.display = 'none'; return; }\n    if (key === 'deep') deepDone = true;\n    if (idx === -1) {\n      lens.style.display = 'none';\n      journey.textContent = 'the one place the journey unrolls \u2014 every state, every fork';\n      return;\n    }\n    lens.style.display = '';\n    journey.textContent = 'one state in focus \u00b7 the journey lives in lineage';\n    lens.className = 'statelens ' + ST_CLASS[idx];\n    const visited = i => i <= 1 || (i === 2 && deepDone);\n    lens.innerHTML = STATES.map((s, i) => i === idx\n      ? '<span class=\"sl-here\"><span class=\"sl-core\"><\/span><span class=\"sl-label\">' + s + '<\/span><\/span>'\n      : '<button class=\"sl-dot ' + (visited(i) ? 'past' : 'open') + '\" data-goto=\"' +\n        (['explore','explore','deep','deep','compare','brief'][i]) + '\" title=\"' + s + '\" style=\"cursor:pointer;\"><\/button>'\n    ).join('');\n    lens.querySelectorAll('[data-goto]').forEach(b =>\n      b.addEventListener('click', () => render(b.dataset.goto)));\n  }\n\n  function wire(scope) {\n    scope.querySelectorAll('[data-goto]').forEach(b => {\n      b.addEventListener('click', () => render(b.dataset.goto));\n    });\n    // graduation: the strand pulls out of the fan and becomes the taut thread\n    scope.querySelectorAll('.grad-btn').forEach(b => {\n      b.addEventListener('click', (e) => {\n        e.stopPropagation();\n        const wrap = document.getElementById('fanWrap');\n        if (!wrap) return render('deep');\n        const idx = b.dataset.strand;\n        wrap.classList.add('fan-graduating');\n        wrap.querySelector('#strand-' + idx).classList.add('is-chosen');\n        scope.querySelectorAll('.angle-card').forEach(c => {\n          c.classList.toggle('is-chosen', c.dataset.strand === idx);\n        });\n        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\n        setTimeout(() => render('deep'), reduced ? 0 : 420);\n      });\n    });\n  }\n\n  // global chrome buttons\n  document.querySelectorAll('.rail [data-goto], .threadctx [data-goto]').forEach(b => {\n    b.addEventListener('click', () => render(b.dataset.goto));\n  });\n\n  render('desk', 'm-pickup');\n<\/script>\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "rooms/01-landing.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>IdeaLoop Core \u2014 every serious idea moves in a loop<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n  body { display: block; }\n  .wrap { max-width: 980px; margin: 0 auto; padding: 0 40px; }\n\n  /* nav */\n  .nav { display: flex; align-items: center; gap: 14px; padding: 26px 0; }\n  .nav .n-name { font-family: var(--font-author); font-weight: 500; font-size: 19px; }\n  .nav .n-core { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.3em; color: var(--ink-3); text-transform: uppercase; }\n  .nav .n-right { margin-left: auto; display: flex; gap: 10px; align-items: center; }\n  .nav .n-login { font-size: var(--fs-14); color: var(--ink-2); text-decoration: none; padding: 8px 12px; }\n\n  /* hero */\n  .hero { padding: 84px 0 40px; }\n  .hero h1 { font-family: var(--font-author); font-weight: 500; font-size: 46px; line-height: 1.18; letter-spacing: -0.01em; max-width: 21ch; }\n  .hero .h-sub { font-size: 18px; color: var(--ink-2); line-height: 1.7; max-width: 56ch; margin-top: 22px; }\n  .hero .h-cta { display: flex; align-items: center; gap: 16px; margin-top: 34px; }\n  .hero .h-cta .btn-primary { font-size: 15px; padding: 11px 24px; }\n  .hero .h-cta .h-note { font-family: var(--font-instrument); font-size: var(--fs-11); color: var(--ink-3); letter-spacing: 0.04em; }\n\n  /* the hero fiber \u2014 the idea as light, state by state.\n     The one sanctioned place all states appear together:\n     this is the argument, not the workspace. */\n  .herothread { padding: 40px 0 6px; }\n  .herothread svg { display: block; width: 100%; height: 200px; }\n  .herothread .ht-label { font-family: var(--font-instrument); font-size: 10.5px; letter-spacing: 0.14em; fill: var(--ink-3); text-transform: uppercase; }\n  .herothread .ht-label.lit { fill: #4F46E5; font-weight: 600; }\n  .herothread .ht-note { font-family: var(--font-author); font-style: italic; font-size: 15px; fill: var(--ink-3); }\n\n  .sect { padding: 74px 0; border-top: 1px solid var(--rule); }\n  .sect .s-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n  .sect h2 { font-family: var(--font-author); font-weight: 500; font-size: 30px; line-height: 1.3; margin: 12px 0 14px; max-width: 30ch; }\n  .sect .s-lede { font-size: var(--fs-15); color: var(--ink-2); line-height: 1.75; max-width: var(--measure); }\n\n  /* the problem \u2014 his tuesday */\n  .tuesday { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 34px; }\n  .tu { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 20px 22px; }\n  .tu .t-where { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }\n  .tu p { font-family: var(--font-author); font-style: italic; font-size: 15.5px; color: var(--ink-2); line-height: 1.6; margin-top: 8px; }\n  .tuesday-close { font-size: var(--fs-15); color: var(--ink); margin-top: 26px; max-width: 60ch; line-height: 1.7; }\n\n  /* the loop walked */\n  .loopwalk { margin-top: 40px; }\n  .loopwalk svg { display: block; width: 100%; height: 120px; }\n  .loopwalk text { font-family: var(--font-instrument); font-size: 10.5px; letter-spacing: 0.12em; fill: var(--ink-2); text-transform: uppercase; }\n  .loopwalk .lw-note { font-family: var(--font-instrument); font-size: 10.5px; letter-spacing: 0.1em; color: var(--ink-3); text-align: center; margin-top: 10px; text-transform: uppercase; }\n\n  /* two rooms */\n  .rooms2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 34px; }\n  .r2 { border: 1px solid var(--rule); border-radius: var(--r-3); padding: 28px 30px 30px; }\n  .r2 .r-tag { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }\n  .r2 h3 { font-family: var(--font-author); font-size: 22px; margin: 12px 0 8px; }\n  .r2 p { font-size: var(--fs-14); line-height: 1.7; }\n  .r2.air { background: var(--air-tint); }\n  .r2.air .r-tag { color: #5A6B94; }\n  .r2.air h3 { font-weight: 400; color: #22304E; }\n  .r2.air p { color: var(--air-ink); }\n  .r2.press { background: var(--press-tint); }\n  .r2.press .r-tag { color: #6E6A92; }\n  .r2.press h3 { font-weight: 600; color: #221F3A; }\n  .r2.press p { color: var(--press-ink); }\n  .rooms2-note { font-size: var(--fs-14); color: var(--ink-2); margin-top: 20px; max-width: 60ch; line-height: 1.7; }\n\n  /* receipts demo */\n  .receipt-demo { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 26px 30px; margin-top: 32px; max-width: 720px; }\n  .receipt-demo .rd-k { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }\n  .receipt-demo p { font-size: var(--fs-15); color: var(--ink); line-height: 1.8; max-width: 58ch; }\n  .receipt-demo .gap-line { border-top: 1px dashed var(--rule-strong); margin-top: 16px; padding-top: 12px; font-size: var(--fs-14); color: var(--ink-2); }\n\n  /* why not chatgpt */\n  .versus { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 34px; }\n  .vs { border-radius: var(--r-3); padding: 24px 26px; }\n  .vs .v-k { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 12px; }\n  .vs.them { border: 1px solid var(--rule); background: var(--paper-low); }\n  .vs.them .v-k { color: var(--ink-3); }\n  .vs.them p { font-family: var(--font-author); font-style: italic; font-size: 15.5px; color: var(--ink-3); line-height: 1.7; }\n  .vs.us { border: 1px solid var(--rule-strong); background: var(--paper-high); }\n  .vs.us .v-k { color: var(--ink-2); }\n  .vs.us p { font-size: var(--fs-14); color: var(--ink); line-height: 1.7; }\n  .audit-note { margin-top: 22px; padding: 18px 22px; border: 1px dashed var(--rule-strong); border-radius: var(--r-3); max-width: 720px; }\n  .audit-note p { font-size: var(--fs-14); color: var(--ink-2); line-height: 1.7; }\n  .audit-note b { color: var(--ink); font-weight: 600; }\n\n  /* pricing */\n  .price { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 34px; max-width: 720px; }\n  .pr { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 24px 26px; }\n  .pr .p-k { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n  .pr .p-big { font-family: var(--font-author); font-size: 24px; font-weight: 500; margin: 10px 0 6px; }\n  .pr p { font-size: var(--fs-13, 13px); color: var(--ink-2); line-height: 1.6; font-size: 13px; }\n\n  /* the one warm beat */\n  .warm { padding: 84px 0; border-top: 1px solid var(--rule); text-align: left; }\n  .warm .w-line { font-family: var(--font-author); font-style: italic; font-size: 24px; color: var(--ink); max-width: 44ch; line-height: 1.6; }\n  .warm .w-who { font-family: var(--font-instrument); font-size: var(--fs-11); color: var(--ink-3); letter-spacing: 0.08em; margin-top: 14px; }\n\n  /* final cta + footer */\n  .final { padding: 70px 0 90px; border-top: 1px solid var(--rule); }\n  .final h2 { font-family: var(--font-author); font-weight: 500; font-size: 30px; max-width: 26ch; }\n  .final .f-cta { display: flex; align-items: center; gap: 16px; margin-top: 26px; }\n  .footer { border-top: 1px solid var(--rule); padding: 26px 0 46px; display: flex; justify-content: space-between; gap: 20px; }\n  .footer p { font-family: var(--font-instrument); font-size: var(--fs-10); color: var(--ink-4); letter-spacing: 0.06em; }\n  .footer a { color: var(--ink-3); }\n<\/style>\n<\/head>\n<body>\n\n  <div class=\"wrap\">\n    <!-- nav -->\n    <nav class=\"nav\">\n      <svg width=\"40\" height=\"18\" viewBox=\"0 0 150 54\" fill=\"none\"><path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\" stroke=\"#4F46E5\" stroke-width=\"6\" stroke-linecap=\"round\"/><\/svg>\n      <span class=\"n-name\">IdeaLoop<\/span><span class=\"n-core\">Core<\/span>\n      <div class=\"n-right\">\n        <a class=\"n-login\" href=\"#\">Log in<\/a>\n        <a class=\"btn btn-primary\" href=\"#\" data-nav=\"rooms/02-desk.html\">Start an idea loop<\/a>\n      <\/div>\n    <\/nav>\n\n    <!-- hero: recognition first -->\n    <header class=\"hero\">\n      <h1>Every serious idea moves in a loop. Until now, that loop lived in your head.<\/h1>\n      <p class=\"h-sub\">The ten open tabs. Getting serious about one version. Killing it,\n        circling back, trying the angle you dismissed in March. ILC is where that motion\n        lives \u2014 read against real evidence, kept across every pass, never flattered.<\/p>\n      <div class=\"h-cta\">\n        <a class=\"btn btn-primary\" href=\"#\" data-nav=\"rooms/02-desk.html\">Start an idea loop<\/a>\n        <span class=\"h-note\">one free run \u00b7 no sign-up \u00b7 your idea stays yours<\/span>\n      <\/div>\n    <\/header>\n\n    <!-- the fiber, drawn once: the idea as light, state by state -->\n    <div class=\"herothread\">\n      <svg viewBox=\"0 0 900 200\" preserveAspectRatio=\"xMidYMid meet\" fill=\"none\">\n        <defs>\n          <linearGradient id=\"fiber\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n            <stop offset=\"0\"    stop-color=\"#A3B4EE\"/>\n            <stop offset=\"0.22\" stop-color=\"#3D68EE\"/>\n            <stop offset=\"0.44\" stop-color=\"#4F46E5\"/>\n            <stop offset=\"0.66\" stop-color=\"#6D5BE8\"/>\n            <stop offset=\"0.82\" stop-color=\"#7C5CEE\"/>\n            <stop offset=\"1\"    stop-color=\"#7C3AED\"/>\n          <\/linearGradient>\n          <radialGradient id=\"core\" cx=\"0.5\" cy=\"0.5\" r=\"0.5\">\n            <stop offset=\"0\" stop-color=\"#FFFFFF\"/>\n            <stop offset=\"0.35\" stop-color=\"#7C8CF5\"/>\n            <stop offset=\"1\" stop-color=\"#4F46E5\" stop-opacity=\"0\"/>\n          <\/radialGradient>\n          <filter id=\"soft\" x=\"-60%\" y=\"-60%\" width=\"220%\" height=\"220%\"><feGaussianBlur stdDeviation=\"4\"/><\/filter>\n          <filter id=\"haze\" x=\"-80%\" y=\"-80%\" width=\"260%\" height=\"260%\"><feGaussianBlur stdDeviation=\"9\"/><\/filter>\n        <\/defs>\n\n        <!-- state labels with ticks -->\n        <text class=\"ht-label\" x=\"46\" y=\"26\">rough<\/text>\n        <text class=\"ht-label\" x=\"212\" y=\"26\">explore<\/text>\n        <text class=\"ht-label lit\" x=\"424\" y=\"26\">deep<\/text>\n        <text class=\"ht-label\" x=\"558\" y=\"26\">compare<\/text>\n        <text class=\"ht-label\" x=\"678\" y=\"26\">re-evaluate<\/text>\n        <text class=\"ht-label\" x=\"836\" y=\"26\">brief<\/text>\n        <path d=\"M64 34 V56 M240 34 V70 M444 34 V64 M590 34 V72 M722 34 V70 M850 34 V88\" stroke=\"rgba(22,24,29,0.18)\" stroke-width=\"1\" stroke-dasharray=\"1 4\"/>\n\n        <!-- the glow pass of the fiber -->\n        <path d=\"M28 118 C 120 118 170 116 240 112 C 330 106 380 112 444 112 C 520 112 540 112 590 112 C 650 112 680 112 722 112 C 780 112 812 112 850 112\"\n              stroke=\"url(#fiber)\" stroke-width=\"6\" opacity=\"0.35\" filter=\"url(#soft)\"/>\n        <!-- the fiber itself -->\n        <path d=\"M28 118 C 120 118 170 116 240 112 C 330 106 380 112 444 112 C 520 112 540 112 590 112 C 650 112 680 112 722 112 C 780 112 812 112 850 112\"\n              stroke=\"url(#fiber)\" stroke-width=\"1.8\" stroke-linecap=\"round\"/>\n\n        <!-- ROUGH: the scattered cloud -->\n        <g>\n          <circle cx=\"52\" cy=\"106\" r=\"20\" fill=\"#A3B4EE\" opacity=\"0.18\" filter=\"url(#haze)\"/>\n          <circle cx=\"70\" cy=\"126\" r=\"14\" fill=\"#A3B4EE\" opacity=\"0.20\" filter=\"url(#haze)\"/>\n          <path d=\"M36 104 C 52 92 74 96 82 110 M44 132 C 60 140 78 134 88 122\" stroke=\"#A3B4EE\" stroke-width=\"1\" opacity=\"0.55\"/>\n          <circle cx=\"48\" cy=\"112\" r=\"1.6\" fill=\"#8FA4EA\"/><circle cx=\"66\" cy=\"100\" r=\"1.3\" fill=\"#8FA4EA\"/>\n          <circle cx=\"78\" cy=\"122\" r=\"1.6\" fill=\"#8FA4EA\"/><circle cx=\"58\" cy=\"130\" r=\"1.2\" fill=\"#8FA4EA\"/>\n        <\/g>\n\n        <!-- EXPLORE: strands gathering -->\n        <g stroke=\"#3D68EE\" fill=\"none\">\n          <path d=\"M150 118 C 190 118 200 84 244 80 C 290 76 310 96 340 106\" stroke-width=\"1\" opacity=\"0.5\"/>\n          <path d=\"M150 118 C 195 118 210 146 252 148 C 296 150 320 128 348 116\" stroke-width=\"1\" opacity=\"0.4\"/>\n          <path d=\"M150 118 C 200 116 230 104 268 100 C 310 96 340 106 368 110\" stroke-width=\"1.3\" opacity=\"0.7\"/>\n          <circle cx=\"244\" cy=\"80\" r=\"2\" fill=\"#3D68EE\" opacity=\"0.8\" stroke=\"none\"/>\n          <circle cx=\"252\" cy=\"148\" r=\"2\" fill=\"#3D68EE\" opacity=\"0.6\" stroke=\"none\"/>\n        <\/g>\n\n        <!-- DEEP: the focused core -->\n        <g>\n          <circle cx=\"444\" cy=\"112\" r=\"34\" fill=\"url(#core)\" opacity=\"0.5\" filter=\"url(#haze)\"/>\n          <circle cx=\"444\" cy=\"112\" r=\"20\" fill=\"url(#core)\" opacity=\"0.9\"/>\n          <circle cx=\"444\" cy=\"112\" r=\"5\" fill=\"#FFFFFF\"/>\n          <circle cx=\"444\" cy=\"112\" r=\"26\" stroke=\"#4F46E5\" stroke-width=\"0.8\" opacity=\"0.35\"/>\n        <\/g>\n\n        <!-- COMPARE: interference -->\n        <g stroke-width=\"1.1\" fill=\"none\">\n          <path d=\"M520 112 C 540 96 560 96 580 112 C 600 128 620 128 640 112\" stroke=\"#6D5BE8\" opacity=\"0.7\"/>\n          <path d=\"M520 112 C 540 128 560 128 580 112 C 600 96 620 96 640 112\" stroke=\"#7C5CEE\" opacity=\"0.55\"/>\n        <\/g>\n\n        <!-- RE-EVALUATE: rings -->\n        <g>\n          <circle cx=\"722\" cy=\"112\" r=\"16\" stroke=\"#8B5CF6\" stroke-width=\"1\" opacity=\"0.55\"/>\n          <circle cx=\"722\" cy=\"112\" r=\"9\" stroke=\"#8B5CF6\" stroke-width=\"1\" opacity=\"0.8\"/>\n          <circle cx=\"722\" cy=\"112\" r=\"2.5\" fill=\"#8B5CF6\"/>\n        <\/g>\n\n        <!-- BRIEF: sealed, handed over -->\n        <g>\n          <circle cx=\"850\" cy=\"112\" r=\"11\" stroke=\"#7C3AED\" stroke-width=\"1\" opacity=\"0.4\"/>\n          <circle cx=\"850\" cy=\"112\" r=\"5.5\" fill=\"#7C3AED\"/>\n          <path d=\"M862 112 L 898 112\" stroke=\"#7C3AED\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"1 7\"/>\n        <\/g>\n\n        <text class=\"ht-note\" x=\"28\" y=\"186\">The idea thread \u2014 your thinking, in motion. One identity, many states, nothing lost.<\/text>\n      <\/svg>\n    <\/div>\n\n    <!-- the problem: his tuesday -->\n    <section class=\"sect\">\n      <span class=\"s-eyebrow\">the problem<\/span>\n      <h2>Your idea is scattered across everything except a place built for it.<\/h2>\n      <div class=\"tuesday\">\n        <div class=\"tu\">\n          <span class=\"t-where\">chatgpt \u00b7 tab 14 of 40<\/span>\n          <p>\"That's a brilliant idea with real potential\u2026\" \u2014 the same sentence it gave the\n            last nine ideas.<\/p>\n        <\/div>\n        <div class=\"tu\">\n          <span class=\"t-where\">notes app \u00b7 three of them<\/span>\n          <p>\"v2 \u2014 but what if bookkeepers instead??\" Undated. No idea which version this\n            answers.<\/p>\n        <\/div>\n        <div class=\"tu\">\n          <span class=\"t-where\">voice memo \u00b7 0:47<\/span>\n          <p>The version you killed in March. You no longer remember why \u2014 and it might have\n            been the good one.<\/p>\n        <\/div>\n      <\/div>\n      <p class=\"tuesday-close\">The thinking was real. The record of it is gone. Ideas\n        shouldn't die in chat threads.<\/p>\n    <\/section>\n\n    <!-- the loop -->\n    <section class=\"sect\">\n      <span class=\"s-eyebrow\">the shape of it<\/span>\n      <h2>One idea. One loop. Every pass kept.<\/h2>\n      <p class=\"s-lede\">Capture the spark. Widen it into angles. Put one under pressure.\n        Change what the read pressured, and read again. Compare the survivors. Hand the\n        winner to yourself with a first move \u2014 and the loop stays open behind you, watching\n        the evidence for as long as the idea lives.<\/p>\n      <div class=\"loopwalk\">\n        <svg viewBox=\"0 0 900 120\" fill=\"none\" preserveAspectRatio=\"none\">\n          <path d=\"M20 60 L 130 60\" stroke=\"#4F46E5\" stroke-width=\"1.6\" stroke-linecap=\"round\"/>\n          <circle cx=\"130\" cy=\"60\" r=\"5\" fill=\"#4F46E5\"/>\n          <path d=\"M130 60 L 280 60\" stroke=\"#4F46E5\" stroke-width=\"1.6\"/>\n          <circle cx=\"280\" cy=\"60\" r=\"5\" fill=\"#4F46E5\"/>\n          <path d=\"M280 60 L 430 60\" stroke=\"#4F46E5\" stroke-width=\"1.6\"/>\n          <circle cx=\"430\" cy=\"60\" r=\"5\" fill=\"#4F46E5\"/>\n          <path d=\"M430 60 L 580 60\" stroke=\"#4F46E5\" stroke-width=\"1.6\"/>\n          <circle cx=\"580\" cy=\"60\" r=\"5\" fill=\"#4F46E5\"/>\n          <path d=\"M580 60 L 730 60\" stroke=\"#4F46E5\" stroke-width=\"1.6\"/>\n          <circle cx=\"730\" cy=\"60\" r=\"5\" fill=\"#4F46E5\"/>\n          <path d=\"M730 60 L 880 60\" stroke=\"#4F46E5\" stroke-width=\"1.6\" stroke-dasharray=\"1 7\"/>\n          <!-- the return arc, dotted -->\n          <path d=\"M730 60 C 700 14 460 6 430 52\" stroke=\"rgba(22,24,29,0.35)\" stroke-width=\"1.2\" stroke-dasharray=\"2 6\"/>\n          <text x=\"96\" y=\"88\">capture<\/text>\n          <text x=\"252\" y=\"88\">explore<\/text>\n          <text x=\"410\" y=\"88\">deep<\/text>\n          <text x=\"548\" y=\"88\">re-evaluate<\/text>\n          <text x=\"702\" y=\"88\">compare<\/text>\n          <text x=\"826\" y=\"88\">decide<\/text>\n        <\/svg>\n        <div class=\"lw-note\">\u21bb the return is part of the shape \u2014 the loop never closes while the idea lives<\/div>\n      <\/div>\n    <\/section>\n\n    <!-- two rooms -->\n    <section class=\"sect\">\n      <span class=\"s-eyebrow\">two rooms, two jobs<\/span>\n      <h2>The telescope and the microscope.<\/h2>\n      <div class=\"rooms2\">\n        <div class=\"r2 air\">\n          <span class=\"r-tag\">explore \u00b7 the telescope<\/span>\n          <h3>\"I don't know what this could become.\"<\/h3>\n          <p>Explore widens a rough idea into angles \u2014 each one pointing at a named piece of\n            evidence. No score, no rank, no verdict. A fan has no first place.<\/p>\n        <\/div>\n        <div class=\"r2 press\">\n          <span class=\"r-tag\">deep \u00b7 the microscope<\/span>\n          <h3>\"I have a serious version. Pressure it.\"<\/h3>\n          <p>Deep holds one version against real market, monetization, and originality\n            evidence \u2014 then credits what stands. Harsh, fair, traceable.<\/p>\n        <\/div>\n      <\/div>\n      <p class=\"rooms2-note\">They're different jobs, not a short version and a long one. Some\n        days they disagree. That disagreement is the product working \u2014 the same evidence\n        answering two different questions.<\/p>\n    <\/section>\n\n    <!-- receipts -->\n    <section class=\"sect\">\n      <span class=\"s-eyebrow\">how it earns the read<\/span>\n      <h2>Every claim carries its receipt.<\/h2>\n      <p class=\"s-lede\">ILC retrieves the real field \u2014 GitHub, the open web, the forums where\n        your buyer complains \u2014 and the evidence visibly produces the conclusion. Nothing is\n        invented; absence is reported as carefully as presence.<\/p>\n      <div class=\"receipt-demo\">\n        <div class=\"rd-k\">from a live read<\/div>\n        <p>The lane is already served: <span class=\"evidence-link\">docparser<\/span>\n          <span class=\"evidence-chip\">github \u00b7 4.1k \u2605<\/span> holds the developer wedge, and\n          <span class=\"evidence-link\">Dext<\/span> prices the category at $25/mo. What no\n          retrieved actor owns is the hand-off itself.<\/p>\n        <div class=\"gap-line\">What would change this read: a named buyer paying for intake\n          alone. <span class=\"absence-chip\">not in the evidence<\/span><\/div>\n      <\/div>\n    <\/section>\n\n    <!-- why not chatgpt -->\n    <section class=\"sect\">\n      <span class=\"s-eyebrow\">why not just ask chatgpt<\/span>\n      <h2>You already did. You remember the feeling.<\/h2>\n      <div class=\"versus\">\n        <div class=\"vs them\">\n          <span class=\"v-k\">the mirror that flatters<\/span>\n          <p>\"This is a brilliant idea with huge potential. The market is massive and growing.\n            With the right execution, this could really take off\u2026\"<\/p>\n        <\/div>\n        <div class=\"vs us\">\n          <span class=\"v-k\">the read that holds<\/span>\n          <p>Demand holds at rung 4 of 7 \u2014 documented friction, unpriced. The next rung needs a\n            named repeat buyer, and no retrieved source shows one. The bet lands on\n            distribution, where the evidence is thinnest.<\/p>\n        <\/div>\n      <\/div>\n      <div class=\"audit-note\">\n        <p><b>Check us against the tool you already trust.<\/b> Every read ships with a copy\n          button: paste the whole evaluation into your own GPT or Claude and ask whether the\n          score follows the evidence. Built to survive cross-checking, not hide from it.<\/p>\n      <\/div>\n    <\/section>\n\n    <!-- pricing -->\n    <section class=\"sect\">\n      <span class=\"s-eyebrow\">pricing<\/span>\n      <h2>Pay as you think.<\/h2>\n      <div class=\"price\">\n        <div class=\"pr\">\n          <span class=\"p-k\">now \u00b7 open beta<\/span>\n          <div class=\"p-big\">Free<\/div>\n          <p>Three runs a week \u2014 one full loop: explore, deep, re-read. Compare never costs a\n            run. One free run before you even sign up.<\/p>\n        <\/div>\n        <div class=\"pr\">\n          <span class=\"p-k\">after beta<\/span>\n          <div class=\"p-big\">A fair number<\/div>\n          <p>Priced when it's real, not before. No tier gymnastics, no pay-to-unlock-honesty.\n            The evidence layer stays free for everyone.<\/p>\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- the one warm beat -->\n    <section class=\"warm\">\n      <p class=\"w-line\">ILC scored my own idea for ILC at 3.5. I built it anyway \u2014 that's\n        the point. It tells you what you're betting on; the bet stays yours.<\/p>\n      <p class=\"w-who\">\u2014 Emre, who builds this in the open<\/p>\n    <\/section>\n\n    <!-- final cta -->\n    <section class=\"final\">\n      <h2>Bring one rough idea. The loop does the rest.<\/h2>\n      <div class=\"f-cta\">\n        <a class=\"btn btn-primary\" href=\"#\" data-nav=\"rooms/02-desk.html\">Start an idea loop<\/a>\n        <span class=\"h-note\" style=\"font-family:var(--font-instrument); font-size:11px; color:var(--ink-3); letter-spacing:0.04em;\">one free run \u00b7 no sign-up<\/span>\n      <\/div>\n    <\/section>\n\n    <footer class=\"footer\">\n      <p>ILC reads evidence; it doesn't decide. Outcomes depend on execution, timing, and the\n        world. \u00b7 <a href=\"#\">privacy<\/a> \u00b7 <a href=\"#\">terms<\/a> \u00b7 <a href=\"#\">disclaimer<\/a><\/p>\n      <p>room 1 of 9 \u00b7 the argument<\/p>\n    <\/footer>\n  <\/div>\n\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "rooms/02-desk.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 Room 2 \u2014 The Desk<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n/* ============================================================\n   ILC \u00b7 Cold Light \u2014 shared room chrome\n   Linked by every room mockup after ../tokens.css.\n   The chrome IS the continuity: rail (global memory),\n   topbar, idea context with the STATE LENS (one state in\n   focus; the journey lives in Lineage).\n   ============================================================ */\n\nbody { display: flex; min-height: 100vh; }\n\n/* ---------- rail ---------- */\n.rail {\n  width: var(--rail-w); flex: none;\n  background: var(--paper-deep);\n  border-right: 1px solid var(--rule);\n  display: flex; flex-direction: column;\n  padding: 20px 12px 16px;\n  position: sticky; top: 0; height: 100vh;\n}\n.rail-brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 22px; }\n.rail-brand .rb-name { font-family: var(--font-author); font-weight: 500; font-size: 17px; }\n.rail-nav { display: flex; flex-direction: column; gap: 2px; }\n.rail-item {\n  display: flex; align-items: center; gap: 11px;\n  font-family: var(--font-interface); font-size: var(--fs-14); font-weight: 500;\n  color: var(--ink-2); background: none; border: none; cursor: pointer;\n  padding: 8px 10px; border-radius: var(--r-2); text-align: left;\n  text-decoration: none;\n}\n.rail-item:hover { background: rgba(22,24,29,0.05); color: var(--ink); }\n.rail-item.is-active { background: var(--paper-high); color: var(--ink); border: 1px solid var(--rule); padding: 7px 9px; }\n.rail-item svg { flex: none; stroke: currentColor; }\n.rail-spacer { flex: 1; }\n.rail-util { display: flex; flex-direction: column; gap: 1px; padding-top: 12px; border-top: 1px solid var(--rule); }\n.rail-util .rail-item { font-size: var(--fs-12); font-weight: 400; color: var(--ink-3); padding: 5px 10px; }\n.rail-account { display: flex; align-items: center; gap: 9px; padding: 12px 10px 0; }\n.rail-account .ra-dot {\n  width: 22px; height: 22px; border-radius: 50%; flex: none;\n  background: var(--paper-high); border: 1px solid var(--rule-strong);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-instrument); font-size: 10px; color: var(--ink-2);\n}\n.rail-account .ra-mail { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n/* ---------- main column ---------- */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 0 28px; border-bottom: 1px solid var(--rule);\n  background: var(--paper);\n  position: sticky; top: 0; z-index: 30;\n}\n.topbar .tp-room { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.topbar .tp-status { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.06em; color: var(--ink-3); }\n.topbar .tp-status b { color: var(--ink-2); font-weight: 600; }\n\n/* ---------- thread context ---------- */\n.threadctx { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: 52px; z-index: 29; }\n.threadctx-inner { display: flex; align-items: center; gap: 28px; padding: 12px 28px 10px; }\n.threadctx .tc-title { min-width: 0; }\n.threadctx .tt-name { font-family: var(--font-author); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.threadctx .tt-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; margin-top: 1px; }\n.threadctx .statelens { flex: none; margin-left: 16px; }\n.threadctx .tc-journey { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; margin-left: 16px; }\n.threadctx .tc-journey a { color: var(--ink-3); }\n.threadctx .tc-close { margin-left: auto; }\n\n/* ---------- room scaffold ---------- */\n.room { flex: 1; padding: 44px 48px 110px; }\n.room[data-register=\"air\"]   { background: var(--air-tint); }\n.room[data-register=\"press\"] { background: var(--press-tint); }\n.room-inner { max-width: 880px; margin: 0 auto; }\n.room-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.room-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-34); line-height: 1.2; margin: 10px 0 6px; }\n.room-lede { font-size: var(--fs-15); color: var(--ink-2); max-width: var(--measure); }\n\n.room[data-register=\"air\"] .room-title { font-weight: 400; color: #22304E; }\n.room[data-register=\"air\"] .room-lede { color: var(--air-ink); line-height: 1.85; }\n.room[data-register=\"air\"] .room-eyebrow { color: #5A6B94; }\n.room[data-register=\"press\"] .room-title { font-weight: 600; color: #221F3A; }\n.room[data-register=\"press\"] .room-lede { color: var(--press-ink); line-height: 1.55; }\n.room[data-register=\"press\"] .room-eyebrow { color: #6E6A92; }\n\n/* ---------- cards ---------- */\n.card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 22px 24px; }\n.card .c-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.card h3 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 8px 0 6px; }\n.card p { font-size: var(--fs-14); color: var(--ink-2); }\n\n/* ---------- the page spine (content sections) ---------- */\n.spined { position: relative; padding-left: 46px; }\n.spined::before { content: \"\"; position: absolute; left: 18px; top: 8px; bottom: 8px; width: 1px; background: var(--rule-strong); }\n.spined .sp-sec { position: relative; padding-bottom: 44px; }\n.spined .sp-sec::before {\n  content: \"\"; position: absolute; left: -32.5px; top: 7px;\n  width: 10px; height: 10px; border-radius: 50%;\n  background: var(--paper); border: 1.5px solid var(--rule-strong);\n}\n.spined .sp-sec.is-here::before { background: var(--thread); border-color: var(--thread); }\n.sp-label { font-family: var(--fon
