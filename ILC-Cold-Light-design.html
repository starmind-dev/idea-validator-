   <div class=\"a-actions\">\n                <button class=\"btn\">Save as branch<\/button>\n                <a class=\"btn btn-primary\" href=\"#\" data-nav=\"rooms/05-deep.html\">Take to deep \u2192<\/a>\n              <\/div>\n            <\/article>\n\n            <article class=\"angle air-card\">\n              <div class=\"a-top\">\n                <span class=\"a-basis\">mechanism \u00b7 lane: email-native<\/span>\n                <span class=\"a-slot\">angle 2 of 3<\/span>\n              <\/div>\n              <h4>Forward-to-file: no app at all<\/h4>\n              <p class=\"a-concept\">The entire product is an email address. Anything forwarded to\n                it comes back filed, coded, and export-ready. No dashboard to learn, nothing to\n                install.<\/p>\n              <div class=\"a-block\">\n                <span class=\"a-k\">opening<\/span>\n                <p class=\"a-v\">Email is the one intake channel every client already uses \u2014\n                  <span class=\"evidence-link\">docparser<\/span>\n                  <span class=\"evidence-chip\">github \u00b7 4.1k \u2605<\/span> proves parsing demand but\n                  ships a dashboard-first product. <span class=\"trust\">trust: high<\/span><\/p>\n              <\/div>\n              <div class=\"a-block\">\n                <span class=\"a-k\">the bet<\/span>\n                <p class=\"a-v\">Adoption friction, not parsing accuracy, is the real gap in this\n                  lane.<\/p>\n              <\/div>\n              <div class=\"a-block\">\n                <span class=\"a-k\">disconfirmer<\/span>\n                <p class=\"a-v\">If forward-to-file already exists inside\n                  <span class=\"evidence-link\">Hubdoc<\/span>'s onboarding and users still don't\n                  use it, friction wasn't the gap.<\/p>\n              <\/div>\n              <div class=\"a-actions\">\n                <span class=\"a-done\">\u2713 in deep \u2014 view the read \u2192<\/span>\n              <\/div>\n            <\/article>\n\n            <article class=\"angle air-card\">\n              <div class=\"a-top\">\n                <span class=\"a-basis\">target \u00b7 lane: vertical wedge<\/span>\n                <span class=\"a-slot\">angle 3 of 3<\/span>\n              <\/div>\n              <h4>Trades first: the glove-box ledger<\/h4>\n              <p class=\"a-concept\">Narrow the audience to trade contractors \u2014 plumbers,\n                electricians \u2014 whose receipts live in vehicles and pockets until quarter's end.<\/p>\n              <div class=\"a-block\">\n                <span class=\"a-k\">opening<\/span>\n                <p class=\"a-v\">Loudest pain in the retrieved threads, but the thinnest paper\n                  trail: <span class=\"absence-chip\">not in the evidence<\/span> a named buyer or a\n                  live competitor in the wedge. <span class=\"trust\">trust: low<\/span><\/p>\n              <\/div>\n              <div class=\"a-block\">\n                <span class=\"a-k\">the bet<\/span>\n                <p class=\"a-v\">That the wedge's silence means it's unserved \u2014 rather than\n                  unservable.<\/p>\n              <\/div>\n              <div class=\"a-block\">\n                <span class=\"a-k\">disconfirmer<\/span>\n                <p class=\"a-v\">Ten contractor interviews where \"my accountant handles it\" ends\n                  the conversation.<\/p>\n              <\/div>\n              <div class=\"a-actions\">\n                <button class=\"btn\">Save as branch<\/button>\n                <a class=\"btn btn-primary\" href=\"#\" data-nav=\"rooms/05-deep.html\">Take to deep \u2192<\/a>\n              <\/div>\n            <\/article>\n          <\/section>\n\n          <!-- \u2162 \u00b7 THE TERRAIN -->\n          <section class=\"sp-sec\">\n            <div class=\"sp-label\">\u2162 \u00b7 the terrain<\/div>\n            <p style=\"font-size:var(--fs-14); color:var(--air-ink); margin:8px 0 18px; max-width:64ch;\">\n              The lanes the evidence actually shows \u2014 with what stands in each one.<\/p>\n            <div class=\"lane\">\n              <div>\n                <div class=\"ln-name\">Receipt OCR &amp; capture<\/div>\n                <div class=\"ln-density\">verified \u00b7 crowded<\/div>\n              <\/div>\n              <div class=\"ln-body\">\n                <span class=\"evidence-link\">Dext<\/span>, <span class=\"evidence-link\">Hubdoc<\/span>,\n                <span class=\"evidence-link\">Expensify<\/span> \u2014 capture is solved and priced.\n                <div class=\"ln-q\">The question this lane asks: what do they all make the client do?<\/div>\n              <\/div>\n            <\/div>\n            <div class=\"lane\">\n              <div>\n                <div class=\"ln-name\">The intake hand-off<\/div>\n                <div class=\"ln-density\">emerging \u00b7 unverified<\/div>\n              <\/div>\n              <div class=\"ln-body\">\n                No retrieved actor owns the moment paper changes hands. Substitute tell:\n                bookkeepers describe manual chase-by-email as the workaround.\n                <div class=\"ln-q\">Firms up fastest \u2014 one named buyer would verify it.<\/div>\n              <\/div>\n            <\/div>\n            <div class=\"lane\">\n              <div>\n                <div class=\"ln-name\">Do-nothing baseline<\/div>\n                <div class=\"ln-density\">verified \u00b7 permanent<\/div>\n              <\/div>\n              <div class=\"ln-body\">\n                The shoebox and the spreadsheet. Free, familiar, and the true competitor for\n                every client under ~50 receipts a month.\n                <div class=\"ln-q\">Any angle must beat this, not the software.<\/div>\n              <\/div>\n            <\/div>\n          <\/section>\n\n          <!-- \u2163 \u00b7 FROM HERE -->\n          <section class=\"sp-sec\" style=\"padding-bottom:8px;\">\n            <div class=\"sp-label\">\u2163 \u00b7 from here<\/div>\n            <div class=\"nextmove air-card\" style=\"margin-top:10px;\">\n              <p class=\"nm-uncert\">The dominant uncertainty is who pays \u2014 everything else is\n                downstream of that answer.<\/p>\n              <p class=\"nm-rec\">The hand-off lane firms up fastest: it has a substitute tell, a\n                findable buyer, and no retrieved owner. Taking angle 1 to Deep would put that lane\n                under pressure; saving angle 3 keeps the wedge alive without spending a run on\n                thin evidence.<\/p>\n              <div class=\"nm-actions\">\n                <a class=\"btn btn-primary\" href=\"#\" data-nav=\"rooms/05-deep.html\">Take angle 1 to deep \u2192<\/a>\n                <button class=\"btn\">Save angle 3 as branch<\/button>\n                <button class=\"btn btn-quiet\">Explore a variation<\/button>\n              <\/div>\n            <\/div>\n          <\/section>\n        <\/div>\n\n        <div class=\"room-foot\">\n          <p>Explore widens. It never scores \u2014 a fan has no rank. \u00b7 <a href=\"#\">how to read this room<\/a><\/p>\n          <p>room 4 of 9 \u00b7 open-air register<\/p>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "rooms/05-deep.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 Room 5 \u2014 Deep, the Pressure Room<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n/* ============================================================\n   ILC \u00b7 Cold Light \u2014 shared room chrome\n   Linked by every room mockup after ../tokens.css.\n   The chrome IS the continuity: rail (global memory),\n   topbar, idea context with the STATE LENS (one state in\n   focus; the journey lives in Lineage).\n   ============================================================ */\n\nbody { display: flex; min-height: 100vh; }\n\n/* ---------- rail ---------- */\n.rail {\n  width: var(--rail-w); flex: none;\n  background: var(--paper-deep);\n  border-right: 1px solid var(--rule);\n  display: flex; flex-direction: column;\n  padding: 20px 12px 16px;\n  position: sticky; top: 0; height: 100vh;\n}\n.rail-brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 22px; }\n.rail-brand .rb-name { font-family: var(--font-author); font-weight: 500; font-size: 17px; }\n.rail-nav { display: flex; flex-direction: column; gap: 2px; }\n.rail-item {\n  display: flex; align-items: center; gap: 11px;\n  font-family: var(--font-interface); font-size: var(--fs-14); font-weight: 500;\n  color: var(--ink-2); background: none; border: none; cursor: pointer;\n  padding: 8px 10px; border-radius: var(--r-2); text-align: left;\n  text-decoration: none;\n}\n.rail-item:hover { background: rgba(22,24,29,0.05); color: var(--ink); }\n.rail-item.is-active { background: var(--paper-high); color: var(--ink); border: 1px solid var(--rule); padding: 7px 9px; }\n.rail-item svg { flex: none; stroke: currentColor; }\n.rail-spacer { flex: 1; }\n.rail-util { display: flex; flex-direction: column; gap: 1px; padding-top: 12px; border-top: 1px solid var(--rule); }\n.rail-util .rail-item { font-size: var(--fs-12); font-weight: 400; color: var(--ink-3); padding: 5px 10px; }\n.rail-account { display: flex; align-items: center; gap: 9px; padding: 12px 10px 0; }\n.rail-account .ra-dot {\n  width: 22px; height: 22px; border-radius: 50%; flex: none;\n  background: var(--paper-high); border: 1px solid var(--rule-strong);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-instrument); font-size: 10px; color: var(--ink-2);\n}\n.rail-account .ra-mail { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n/* ---------- main column ---------- */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 0 28px; border-bottom: 1px solid var(--rule);\n  background: var(--paper);\n  position: sticky; top: 0; z-index: 30;\n}\n.topbar .tp-room { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.topbar .tp-status { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.06em; color: var(--ink-3); }\n.topbar .tp-status b { color: var(--ink-2); font-weight: 600; }\n\n/* ---------- thread context ---------- */\n.threadctx { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: 52px; z-index: 29; }\n.threadctx-inner { display: flex; align-items: center; gap: 28px; padding: 12px 28px 10px; }\n.threadctx .tc-title { min-width: 0; }\n.threadctx .tt-name { font-family: var(--font-author); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.threadctx .tt-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; margin-top: 1px; }\n.threadctx .statelens { flex: none; margin-left: 16px; }\n.threadctx .tc-journey { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; margin-left: 16px; }\n.threadctx .tc-journey a { color: var(--ink-3); }\n.threadctx .tc-close { margin-left: auto; }\n\n/* ---------- room scaffold ---------- */\n.room { flex: 1; padding: 44px 48px 110px; }\n.room[data-register=\"air\"]   { background: var(--air-tint); }\n.room[data-register=\"press\"] { background: var(--press-tint); }\n.room-inner { max-width: 880px; margin: 0 auto; }\n.room-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.room-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-34); line-height: 1.2; margin: 10px 0 6px; }\n.room-lede { font-size: var(--fs-15); color: var(--ink-2); max-width: var(--measure); }\n\n.room[data-register=\"air\"] .room-title { font-weight: 400; color: #22304E; }\n.room[data-register=\"air\"] .room-lede { color: var(--air-ink); line-height: 1.85; }\n.room[data-register=\"air\"] .room-eyebrow { color: #5A6B94; }\n.room[data-register=\"press\"] .room-title { font-weight: 600; color: #221F3A; }\n.room[data-register=\"press\"] .room-lede { color: var(--press-ink); line-height: 1.55; }\n.room[data-register=\"press\"] .room-eyebrow { color: #6E6A92; }\n\n/* ---------- cards ---------- */\n.card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 22px 24px; }\n.card .c-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.card h3 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 8px 0 6px; }\n.card p { font-size: var(--fs-14); color: var(--ink-2); }\n\n/* ---------- the page spine (content sections) ---------- */\n.spined { position: relative; padding-left: 46px; }\n.spined::before { content: \"\"; position: absolute; left: 18px; top: 8px; bottom: 8px; width: 1px; background: var(--rule-strong); }\n.spined .sp-sec { position: relative; padding-bottom: 44px; }\n.spined .sp-sec::before {\n  content: \"\"; position: absolute; left: -32.5px; top: 7px;\n  width: 10px; height: 10px; border-radius: 50%;\n  background: var(--paper); border: 1.5px solid var(--rule-strong);\n}\n.spined .sp-sec.is-here::before { background: var(--thread); border-color: var(--thread); }\n.sp-label { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.sp-sec.is-here > .sp-label { color: var(--ink); font-weight: 600; }\n.sp-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 6px 0 4px; }\n\n/* register spine tints \u2014 the current section is lit (a key moment:\n   the spine is the thread inside the room) */\n.spined .sp-sec.is-here::before { box-shadow: 0 0 0 3px rgba(79,70,229,0.13), 0 0 12px rgba(79,70,229,0.45); }\n.room[data-register=\"air\"] .spined::before { background: rgba(70,85,122,0.3); }\n.room[data-register=\"air\"] .spined .sp-sec::before { background: var(--air-tint); border-color: rgba(70,85,122,0.45); }\n.room[data-register=\"air\"] .spined .sp-sec.is-here::before { background: var(--st-explore); border-color: var(--st-explore); box-shadow: 0 0 0 3px rgba(61,104,238,0.13), 0 0 12px rgba(61,104,238,0.5); }\n.room[data-register=\"air\"] .sp-label { color: #5A6B94; }\n.room[data-register=\"press\"] .spined::before { background: rgba(74,70,120,0.3); }\n.room[data-register=\"press\"] .spined .sp-sec::before { background: var(--press-tint); border-color: rgba(74,70,120,0.45); }\n.room[data-register=\"press\"] .spined .sp-sec.is-here::before { background: var(--st-deep); border-color: var(--st-deep); }\n.room[data-register=\"press\"] .sp-label { color: #6E6A92; }\n\n/* ---------- footer ---------- */\n.room-foot { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 20px; }\n.room-foot p { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.06em; color: var(--ink-4); }\n.room-foot a { color: var(--ink-3); }\n\n/* ---------- utility ---------- */\n.stack-8  > * + * { margin-top: 8px; }\n.stack-14 > * + * { margin-top: 14px; }\n.stack-18 > * + * { margin-top: 18px; }\n.row { display: flex; align-items: center; gap: 12px; }\n\n<\/style>\n<style>\n  .press-card { background: rgba(255,255,255,0.78); border: 1px solid rgba(74,70,120,0.18); border-radius: var(--r-3); }\n\n  /* the movement strip \u2014 the thread crossing this room; the current\n     movement is lit (a sanctioned key moment) */\n  .movestrip { display: flex; align-items: center; margin: 38px 0 6px; }\n  .movestrip .ms-seg { flex: 1; height: 1px; background: rgba(74,70,120,0.3); }\n  .movestrip .ms-seg.is-done { background: var(--st-deep); height: 1.5px; }\n  .movestrip .ms-stop { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 0 14px; position: relative; text-decoration: none; }\n  .movestrip .ms-dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid rgba(74,70,120,0.45); background: var(--press-tint); }\n  .movestrip .ms-stop.is-done .ms-dot { background: var(--st-deep); border-color: var(--st-deep); }\n  .movestrip .ms-stop.is-here .ms-dot {\n    width: 12px; height: 12px; background: var(--st-deep); border-color: var(--st-deep);\n    box-shadow: 0 0 0 4px rgba(79,70,229,0.13), 0 0 16px rgba(79,70,229,0.55);\n  }\n  .movestrip .ms-label { font-family: var(--font-instrument); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6A92; position: absolute; top: 18px; white-space: nowrap; }\n  .movestrip .ms-stop.is-here .ms-label { color: var(--st-deep); font-weight: 600; }\n  .movestrip-pad { height: 30px; }\n\n  /* masthead: the read before the number */\n  .verdict-head { font-family: var(--font-author); font-weight: 500; font-size: 27px; line-height: 1.35; color: #221F3A; max-width: 56ch; margin-top: 10px; }\n  .verdict-body { font-size: var(--fs-15); color: var(--press-ink); line-height: 1.7; max-width: var(--measure); margin-top: 14px; }\n  .score-row { display: flex; align-items: center; gap: 14px; margin-top: 20px; flex-wrap: wrap; }\n  .provenance { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.08em; color: #6E6A92; margin-top: 16px; text-transform: uppercase; }\n  .provenance a { color: #5A5390; }\n\n  /* metric card */\n  .metric { padding: 24px 28px; margin-bottom: 16px; }\n  .m-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }\n  .m-dim { font-family: var(--font-author); font-weight: 600; font-size: 19px; color: #221F3A; }\n  .m-dim .md-sys { font-family: var(--font-instrument); font-size: 10px; font-weight: 500; color: #6E6A92; letter-spacing: 0.1em; margin-left: 8px; }\n  .m-grounding { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #6E6A92; }\n\n  /* the ladder \u2014 evidence produces the number */\n  .ladder { display: flex; gap: 3px; margin: 18px 0 6px; }\n  .ladder .rung { flex: 1; height: 24px; border: 1px solid rgba(74,70,120,0.35); border-radius: 2px; background: transparent; position: relative; }\n  .ladder .rung.is-reached { background: rgba(74,70,120,0.16); }\n  .ladder .rung.is-current { background: #474368; border-color: #474368; }\n  .ladder .rung.is-capped {\n    background: repeating-linear-gradient(135deg, rgba(74,70,120,0.16) 0 4px, transparent 4px 8px);\n    border-style: dashed;\n  }\n  .ladder-legend { display: flex; justify-content: space-between; font-family: var(--font-instrument); font-size: 10px; color: #6E6A92; letter-spacing: 0.05em; margin-bottom: 14px; }\n  .ladder-legend .ll-next { color: var(--ink-2); }\n\n  /* question gates: claim bright, qualification dimmed */\n  .gate { display: grid; grid-template-columns: 16px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid rgba(74,70,120,0.14); }\n  .gate .g-mark { font-family: var(--font-instrument); font-size: 12px; color: #474368; }\n  .gate .g-claim { font-size: var(--fs-14); color: var(--ink); line-height: 1.6; }\n  .gate .g-qual { font-size: var(--fs-12); color: #7E7A99; margin-top: 2px; line-height: 1.55; }\n\n  /* receipts */\n  .rests { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(74,70,120,0.14); }\n  .rests .r-h { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A92; margin-bottom: 8px; }\n  .rests .r-chips { display: flex; flex-wrap: wrap; gap: 6px; }\n\n  /* gap panel \u2014 absence is load-bearing, always open */\n  .gap { border: 1px dashed rgba(74,70,120,0.4); border-radius: var(--r-3); padding: 14px 18px; margin-top: 16px; }\n  .gap .g-h { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #5A5390; margin-bottom: 6px; }\n  .gap p { font-size: var(--fs-14); color: var(--press-ink); }\n\n  /* condensed metric row */\n  .metric-thin { padding: 18px 28px; margin-bottom: 16px; }\n  .metric-thin .m-head { margin-bottom: 8px; }\n  .metric-thin p { font-size: var(--fs-14); color: var(--press-ink); line-height: 1.65; max-width: 66ch; }\n  .cap-note { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: #5A5390; text-transform: uppercase; margin-top: 10px; }\n\n  /* TC equation */\n  .tc-eq { display: flex; align-items: stretch; gap: 0; margin-top: 16px; border: 1px solid rgba(74,70,120,0.2); border-radius: var(--r-3); overflow: hidden; }\n  .tc-term { flex: 1; padding: 18px 20px; text-align: center; background: rgba(255,255,255,0.7); }\n  .tc-term + .tc-term { border-left: 1px solid rgba(74,70,120,0.16); }\n  .tc-term .t-num { font-family: var(--font-instrument); font-size: 24px; font-weight: 600; color: #221F3A; }\n  .tc-term .t-k { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #6E6A92; margin-top: 4px; }\n  .tc-term .t-v { font-size: var(--fs-12); color: var(--press-ink); margin-top: 2px; }\n  .tc-op { display: flex; align-items: center; padding: 0 6px; font-family: var(--font-instrument); font-size: 20px; color: #6E6A92; background: rgba(255,255,255,0.7); }\n\n  /* the field */\n  .actor { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 13px 0; border-top: 1px solid rgba(74,70,120,0.14); }\n  .actor:last-of-type { border-bottom: 1px solid rgba(74,70,120,0.14); }\n  .actor .ac-class { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6A92; padding-top: 3px; }\n  .actor .ac-body { font-size: var(--fs-14); color: var(--press-ink); line-height: 1.65; }\n\n  /* build beats */\n  .beat { display: grid; grid-template-columns: 26px 1fr; gap: 14px; padding: 12px 0; }\n  .beat .b-n { font-family: var(--font-instrument); font-size: 12px; color: #6E6A92; padding-top: 2px; }\n  .beat .b-body { font-size: var(--fs-14); color: var(--press-ink); line-height: 1.65; }\n  .beat .b-body b { color: var(--ink); font-weight: 600; }\n\n  /* the hinge */\n  .hinge-fact { font-family: var(--font-author); font-size: 19px; line-height: 1.55; color: #221F3A; max-width: 58ch; }\n  .hinge-doors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }\n  .hdoor { padding: 16px 20px; }\n  .hdoor .hd-k { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #6E6A92; }\n  .hdoor p { font-size: var(--fs-14); color: var(--press-ink); margin-top: 6px; line-height: 1.6; }\n  .hclose { font-family: var(--font-author); font-style: italic; font-size: 19px; color: #221F3A; margin-top: 28px; }\n\n  /* from here */\n  .fromhere { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }\n  .fh { padding: 18px 20px; text-align: left; cursor: pointer; font: inherit; border: 1px solid rgba(74,70,120,0.2); background: rgba(255,255,255,0.78); border-radius: var(--r-3); text-decoration: none; display: block; transition: border-color var(--t-fast) var(--ease); }\n  .fh:hover { border-color: rgba(74,70,120,0.45); }\n  .fh .fh-k { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A92; }\n  .fh h5 { font-family: var(--font-author); font-size: 16px; font-weight: 600; color: #221F3A; margin: 6px 0 3px; }\n  .fh p { font-size: var(--fs-12); color: var(--press-ink); line-height: 1.5; }\n<\/style>\n<\/head>\n<body>\n\n  <aside class=\"rail\">\n    <div class=\"rail-brand\">\n      <svg width=\"34\" height=\"16\" viewBox=\"0 0 150 54\" fill=\"none\"><path d=\"M2 36 C30 36 42 36 56 36 C80 36 88 10 73 10 C58 10 64 36 88 36 C108 36 124 36 148 36\" stroke=\"#4F46E5\" stroke-width=\"7\" stroke-linecap=\"round\"/><\/svg>\n      <span class=\"rb-name\">IdeaLoop<\/span>\n    <\/div>\n    <nav class=\"rail-nav\">\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/02-desk.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 10.5 H13.5 M3 10.5 V13 M12 10.5 V13 M4.5 10.5 V6.5 A3 3 0 0 1 10.5 6.5 V10.5\"/><\/svg>\n        The Desk\n      <\/a>\n      <a class=\"rail-item\" href=\"#\" data-nav=\"rooms/03-shelves.html\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 15 15\" fill=\"none\" stroke-width=\"1.5\" stroke-linecap=\"round\"><path d=\"M1.5 5 H13.5 M1.5 10.5 H13.5 M4 5 V2.5 M8 5 V3.5 M6 10.5 V8 M11 10.5 V8.5\"/><\/svg>\n        The Shelves\n      <\/a>\n    <\/nav>\n    <div class=\"rail-spacer\"><\/div>\n    <div class=\"rail-util\">\n      <a class=\"rail-item\" href=\"#\">Settings<\/a>\n      <a class=\"rail-item\" href=\"#\">My plan<\/a>\n      <a class=\"rail-item\" href=\"#\">Get help<\/a>\n    <\/div>\n    <div class=\"rail-account\"><span class=\"ra-dot\">e<\/span><span class=\"ra-mail\">emre@idealoopcore.com<\/span><\/div>\n  <\/aside>\n\n  <div class=\"main\">\n    <div class=\"topbar\">\n      <span class=\"tp-room\">deep \u00b7 the pressure room<\/span>\n      <span class=\"tp-status\">beta \u00b7 free \u2014 <b>1 run<\/b> this week \u00b7 refills thu<\/span>\n    <\/div>\n\n    <div class=\"threadctx\">\n      <div class=\"threadctx-inner\">\n        <div class=\"tc-title\">\n          <div class=\"tt-name\">Forward-to-file: no app at all<\/div>\n          <div class=\"tt-meta\">branch of invoice hand-off \u00b7 v2 \u00b7 read jul 26<\/div>\n        <\/div>\n        <div class=\"statelens st-deep\">\n          <span class=\"sl-dot past\" title=\"captured\"><\/span>\n          <a class=\"sl-dot past\" href=\"#\" data-nav=\"rooms/04-explore.html\" title=\"explored\"><\/a>\n          <span class=\"sl-here\"><span class=\"sl-core\"><\/span><span class=\"sl-label\">deep<\/span><\/span>\n          <a class=\"sl-dot open\" href=\"#\" data-nav=\"rooms/06-evolve.html\" title=\"evolve\"><\/a>\n          <a class=\"sl-dot open\" href=\"#\" data-nav=\"rooms/07-compare.html\" title=\"compare\"><\/a>\n          <a class=\"sl-dot open\" href=\"#\" data-nav=\"rooms/09-brief.html\" title=\"brief\"><\/a>\n        <\/div>\n        <span class=\"tc-journey\">one state in focus \u00b7 <a href=\"#\" data-nav=\"rooms/08-lineage.html\">the journey lives in lineage<\/a><\/span>\n        <a class=\"btn btn-quiet tc-close\" href=\"#\" data-nav=\"rooms/02-desk.html\" style=\"font-size:12px;\">put down \u27f6 desk<\/a>\n      <\/div>\n    <\/div>\n\n    <main class=\"room\" data-register=\"press\">\n      <div class=\"room-inner\">\n        <span class=\"room-eyebrow\">deep \u00b7 harsh \u00b7 fair \u00b7 traceable<\/span>\n        <h1 class=\"room-title\">Does this hold?<\/h1>\n        <p class=\"room-lede\">Five movements, one at a time. Deep judges the evidence shape,\n          not the underlying phenomenon \u2014 and the number never appears before the read.<\/p>\n\n        <nav class=\"movestrip\" aria-label=\"movements\">\n          <span class=\"ms-seg is-done\" style=\"flex:0.4;\"><\/span>\n          <a class=\"ms-stop is-here\" href=\"#\"><span class=\"ms-dot\"><\/span><span class=\"ms-label\">\u2160 \u00b7 read<\/span><\/a>\n          <span class=\"ms-seg\"><\/span>\n          <a class=\"ms-stop\" href=\"#\"><span class=\"ms-dot\"><\/span><span class=\"ms-label\">\u2161 \u00b7 findings<\/span><\/a>\n          <span class=\"ms-seg\"><\/span>\n          <a class=\"ms-stop\" href=\"#\"><span class=\"ms-dot\"><\/span><span class=\"ms-label\">\u2162 \u00b7 field<\/span><\/a>\n          <span class=\"ms-seg\"><\/span>\n          <a class=\"ms-stop\" href=\"#\"><span class=\"ms-dot\"><\/span><span class=\"ms-label\">\u2163 \u00b7 build<\/span><\/a>\n          <span class=\"ms-seg\"><\/span>\n          <a class=\"ms-stop\" href=\"#\"><span class=\"ms-dot\"><\/span><span class=\"ms-label\">\u2164 \u00b7 hinge<\/span><\/a>\n          <span class=\"ms-seg\" style=\"flex:0.4;\"><\/span>\n        <\/nav>\n        <div class=\"movestrip-pad\"><\/div>\n\n        <div class=\"spined\" style=\"margin-top:24px;\">\n\n          <!-- \u2160 \u00b7 THE READ -->\n          <section class=\"sp-sec is-here\">\n            <div class=\"sp-label\">\u2160 \u00b7 the read<\/div>\n            <h2 class=\"verdict-head\">The friction is real and the build is cheap \u2014 which is\n              exactly why the bet lands on distribution, where the evidence is thinnest.<\/h2>\n            <p class=\"verdict-body\">Email-native intake removes the adoption step every retrieved\n              competitor stumbles on, and the parsing itself is commodity. What the evidence\n              cannot yet show is a repeatable path to the bookkeeper's desk: no named channel, no\n              priced precedent for intake alone, and a do-nothing baseline that costs nothing.\n              What stands is the wedge; what has to be true is that someone will pay for it\n              before trust exists.<\/p>\n            <div class=\"score-row\">\n              <span class=\"score-pill\" style=\"font-size:14px; padding:4px 12px;\"><span class=\"sp-band mid\"><\/span>5.8&nbsp;overall<\/span>\n              <span class=\"handle\">what would move it: a named repeat buyer in the wedge \u2197 \u00b7 TC sits outside this number \u2014 it's yours, not the idea's<\/span>\n            <\/div>\n            <div class=\"provenance\">what this rests on \u00b7 14 sources \u2014 github 3 \u00b7 serper 6 \u00b7 tavily 3 \u00b7 exa 2 \u00b7 read jul 26 \u00b7 <a href=\"#\">copy for audit<\/a> \u00b7 previous read: jul 22<\/div>\n          <\/section>\n\n          <!-- \u2161 \u00b7 FINDINGS -->\n          <section class=\"sp-sec\">\n            <div class=\"sp-label\">\u2161 \u00b7 findings<\/div>\n\n            <!-- DEMAND, drawn in full -->\n            <article class=\"metric press-card\">\n              <div class=\"m-head\">\n                <span class=\"m-dim\">Demand<span class=\"md-sys\">MD<\/span><\/span>\n                <span class=\"m-grounding\">grounding: high \u00b7 8 receipts<\/span>\n              <\/div>\n              <div class=\"ladder\">\n                <div class=\"rung is-reached\"><\/div>\n                <div class=\"rung is-reached\"><\/div>\n                <div class=\"rung is-reached\"><\/div>\n                <div class=\"rung is-current\"><\/div>\n                <div class=\"rung\"><\/div>\n                <div class=\"rung\"><\/div>\n                <div class=\"rung\"><\/div>\n              <\/div>\n              <div class=\"ladder-legend\">\n                <span>rung 4 of 7 \u00b7 documented friction, unpriced<\/span>\n                <span class=\"ll-next\">next rung \u2197 a named buyer paying for intake alone<\/span>\n              <\/div>\n              <div class=\"gate\">\n                <span class=\"g-mark\">\u2713<\/span>\n                <div>\n                  <div class=\"g-claim\">The pain is documented where the buyer talks.<\/div>\n                  <div class=\"g-qual\">41 retrieved threads name intake as the month's worst day \u2014 none name a tool that solved it.<\/div>\n                <\/div>\n              <\/div>\n              <div class=\"gate\">\n                <span class=\"g-mark\">\u2713<\/span>\n                <div>\n                  <div class=\"g-claim\">The friction survives the free workaround.<\/div>\n                  <div class=\"g-qual\">Chase-by-email persists in every thread despite costing hours \u2014 the workaround is the complaint.<\/div>\n                <\/div>\n              <\/div>\n              <div class=\"gate\">\n                <span class=\"g-mark\">\u00b7<\/span>\n                <div>\n                  <div class=\"g-claim\">Repeat purchase is asserted, not evidenced.<\/div>\n                  <div class=\"g-qual\">Monthly recurrence is structural to bookkeeping, but no retrieved source shows anyone paying twice.<\/div>\n                <\/div>\n              <\/div>\n              <div class=\"rests\">\n                <div class=\"r-h\">what this rests on<\/div>\n                <div class=\"r-chips\">\n                  <span class=\"evidence-chip\">r/bookkeeping \u00b7 41 threads<\/span>\n                  <span class=\"evidence-chip\">serper \u00b7 \"receipt intake bookkeeper\" \u00b7 9 of 22 qualified<\/span>\n                  <span class=\"evidence-chip\">docparser \u00b7 github 4.1k \u2605<\/span>\n                  <span class=\"evidence-chip\">exa \u00b7 2 practitioner posts<\/span>\n                <\/div>\n              <\/div>\n              <div class=\"gap\">\n                <div class=\"g-h\">what would change this read<\/div>\n                <p>A named bookkeeper paying for intake separately from ledger software.\n                  <span class=\"absence-chip\" style=\"border-color:rgba(74,70,120,0.4); color:#5A5390;\">not in the evidence<\/span>\n                  &nbsp;The read is what new evidence changes \u2014 not the score.<\/p>\n              <\/div>\n            <\/article>\n\n            <!-- PAYMENT, condensed -->\n            <article class=\"metric-thin press-card\">\n              <div class=\"m-head\">\n                <span class=\"m-dim\">Payment<span class=\"md-sys\">MO<\/span><\/span>\n                <span class=\"row\" style=\"gap:10px;\"><span class=\"score-pill\"><span class=\"sp-band mid\"><\/span>5.5<\/span><span class=\"m-grounding\">grounding: medium<\/span><\/span>\n              <\/div>\n              <p>First-dollar realism holds at the professional, not the client \u2014 bookkeepers\n                already pay for <span class=\"evidence-link\">Dext<\/span> at $25+/mo, which prices\n                the category. What's unpriced is intake alone; the ladder stops where bundling\n                begins.<\/p>\n            <\/article>\n\n            <!-- POSITIONING, capped -->\n            <article class=\"metric-thin press-card\">\n              <div class=\"m-head\">\n                <span class=\"m-dim\">Positioning<span class=\"md-sys\">OR<\/span><\/span>\n                <span class=\"row\" style=\"gap:10px;\"><span class=\"score-pill\"><span class=\"sp-band weak\"><\/span>2.5<\/span><span class=\"m-grounding\">grounding: high<\/span><\/span>\n              <\/div>\n              <div class=\"ladder\" style=\"margin-top:14px;\">\n                <div class=\"rung is-reached\"><\/div>\n                <div class=\"rung is-current\"><\/div>\n                <div class=\"rung is-capped\"><\/div>\n                <div class=\"rung is-capped\"><\/div>\n                <div class=\"rung is-capped\"><\/div>\n                <div class=\"rung is-capped\"><\/div>\n              <\/div>\n              <div class=\"ladder-legend\"><span>rung 2 of 6 \u00b7 capped \u2014 rungs 3\u20136 unreachable<\/span><\/div>\n              <p>This ladder admits on six defensibility components \u2014 named here: <b>0 of 6<\/b>.\n                Email-native is a wedge, not a moat: every capability is reproducible by the\n                incumbents inside a quarter. The cap is the finding.<\/p>\n              <span class=\"cap-note\">\u25a8 capped \u00b7 structural, not a penalty<\/span>\n            <\/article>\n\n            <!-- TC equation -->\n            <article class=\"metric-thin press-card\">\n              <div class=\"m-head\">\n                <span class=\"m-dim\">The build \u2014 for you<span class=\"md-sys\">TC \u00b7 outside the overall<\/span><\/span>\n                <span class=\"m-grounding\">the only metric that reads your profile<\/span>\n              <\/div>\n              <div class=\"tc-eq\">\n                <div class=\"tc-term\">\n                  <div class=\"t-num\">7.5<\/div>\n                  <div class=\"t-k\">the idea<\/div>\n                  <div class=\"t-v\">for anyone: moderate \u2014 parsing, mail infra, exports<\/div>\n                <\/div>\n                <div class=\"tc-op\">\u2212<\/div>\n                <div class=\"tc-term\">\n                  <div class=\"t-num\">1.0<\/div>\n                  <div class=\"t-k\">your background<\/div>\n                  <div class=\"t-v\">takes off: shipped two parsing-adjacent tools<\/div>\n                <\/div>\n                <div class=\"tc-op\">=<\/div>\n                <div class=\"tc-term\">\n                  <div class=\"t-num\">6.5<\/div>\n                  <div class=\"t-k\">for you<\/div>\n                  <div class=\"t-v\">a weather report, not a verdict<\/div>\n                <\/div>\n              <\/div>\n            <\/article>\n          <\/section>\n\n          <!-- \u2162 \u00b7 THE FIELD -->\n          <section class=\"sp-sec\">\n            <div class=\"sp-label\">\u2162 \u00b7 the field<\/div>\n            <p style=\"font-size:var(--fs-14); color:var(--press-ink); margin:8px 0 10px; max-width:64ch;\">\n              Who already stands on this ground. Every actor is retrieved, named, and linked \u2014\n              never invented.<\/p>\n            <div class=\"actor\">\n              <span class=\"ac-class\">direct<\/span>\n              <div class=\"ac-body\"><span class=\"evidence-link\">docparser<\/span>\n                <span class=\"evidence-chip\">github \u00b7 4.1k \u2605<\/span> \u2014 parsing-first, dashboard-first;\n                sells to the ops team, not the bookkeeper. Holds the developer wedge.<\/div>\n            <\/div>\n            <div class=\"actor\">\n              <span class=\"ac-class\">adjacent<\/span>\n              <div class=\"ac-body\"><span class=\"evidence-link\">Dext<\/span> \u00b7\n                <span class=\"evidence-link\">Hubdoc<\/span> \u2014 capture bundled into ledger suites.\n                Their client-side intake exists and goes unused; the tell this idea rests on.<\/div>\n            <\/div>\n            <div class=\"actor\">\n              <span class=\"ac-class\">baseline<\/span>\n              <div class=\"ac-body\">The shoebox, the spreadsheet, the email chase. Free and\n                familiar \u2014 the true competitor below ~50 receipts a month.<\/div>\n            <\/div>\n          <\/section>\n\n          <!-- \u2163 \u00b7 THE BUILD -->\n          <section class=\"sp-sec\">\n            <div class=\"sp-label\">\u2163 \u00b7 the build<\/div>\n            <div class=\"press-card\" style=\"padding:20px 26px; margin-top:10px;\">\n              <div class=\"beat\"><span class=\"b-n\">01<\/span><div class=\"b-body\"><b>The mail spine first.<\/b> Receiving, parsing, and returning a filed artifact \u2014 the whole product promise in one loop, provable in a week.<\/div><\/div>\n              <div class=\"beat\" style=\"border-top:1px solid rgba(74,70,120,0.14);\"><span class=\"b-n\">02<\/span><div class=\"b-body\"><b>Exports before dashboards.<\/b> The bookkeeper's deliverable is a clean CSV into her existing ledger \u2014 not another place to look.<\/div><\/div>\n              <div class=\"beat\" style=\"border-top:1px solid rgba(74,70,120,0.14);\"><span class=\"b-n\">03<\/span><div class=\"b-body\"><b>Trust surface last.<\/b> Retention policy, processing note, and a visible delete \u2014 the sale needs them before the software does.<\/div><\/div>\n            <\/div>\n          <\/section>\n\n          <!-- \u2164 \u00b7 THE HINGE -->\n          <section class=\"sp-sec\" style=\"padding-bottom:8px;\">\n            <div class=\"sp-label\">\u2164 \u00b7 the hinge<\/div>\n            <p class=\"hinge-fact\" style=\"margin-top:10px;\">Two findings wait on the same fact:\n              whether a bookkeeper will route client paper through a third party's address.<\/p>\n            <div class=\"hinge-doors\">\n              <div class=\"hdoor press-card\">\n                <span class=\"hd-k\">demand's next rung opens on it<\/span>\n                <p>A named buyer proves the friction is worth money \u2014 rung 5 needs exactly this.<\/p>\n              <\/div>\n              <div class=\"hdoor press-card\">\n                <span class=\"hd-k\">the bottleneck resolves on it<\/span>\n                <p>Distribution stops being the binding constraint the day one firm forwards its\n                   first live inbox.<\/p>\n              <\/div>\n            <\/div>\n            <p class=\"hclose\">The read stops here. The facts are checkable \u2014 and the next move\n              is yours to make.<\/p>\n          <\/section>\n        <\/div>\n\n        <!-- from here -->\n        <div style=\"margin-top:34px;\">\n          <span class=\"room-eyebrow\" style=\"font-size:10px;\">from here<\/span>\n          <div class=\"fromhere\">\n            <a class=\"fh\" href=\"#\" data-nav=\"rooms/09-brief.html\">\n              <span class=\"fh-k\">the handoff<\/span>\n              <h5>Execution brief<\/h5>\n              <p>The bet, what to prove next, and the order \u2014 in your hands.<\/p>\n            <\/a>\n            <a class=\"fh\" href=\"#\" data-nav=\"rooms/06-evolve.html\">\n              <span class=\"fh-k\">the return<\/span>\n              <h5>Evolve the idea<\/h5>\n              <p>Change what the read pressured; the thread doubles back.<\/p>\n            <\/a>\n            <a class=\"fh\" href=\"#\" data-nav=\"rooms/07-compare.html\">\n              <span class=\"fh-k\">the seam<\/span>\n              <h5>Add to compare<\/h5>\n              <p>Hold it against another deep read. Always free.<\/p>\n            <\/a>\n          <\/div>\n        <\/div>\n\n        <div class=\"room-foot\">\n          <p>Deep pressures. Explore widens. Same loop. \u00b7 <a href=\"#\">how to read your scores<\/a><\/p>\n          <p>room 5 of 9 \u00b7 pressure register<\/p>\n        <\/div>\n      <\/div>\n    <\/main>\n  <\/div>\n\n\n<script>document.addEventListener('click',function(e){var a=e.target.closest('[data-nav]');if(a){e.preventDefault();parent.postMessage({ilcNav:a.getAttribute('data-nav')},'*');}});<\/script>\n<\/body>\n<\/html>\n", "rooms/06-evolve.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>ILC \u00b7 Room 6 \u2014 Evolve, the Return<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap\" rel=\"stylesheet\">\n<style>\n/* ============================================================\n   ILC DESIGN SYSTEM \u2014 COLD LIGHT\n   tokens.css \u2014 the single source of truth.\n   One field. One fiber of light. Two apertures. Nine rooms.\n   A serious workspace: white, cool, exact \u2014 the only warmth\n   the product allows is accuracy.\n   ============================================================ */\n\n:root {\n  /* ---------- THE FIELD (ice) ---------- */\n  --paper:       #FBFCFE;   /* the ground \u2014 cool white               */\n  --paper-high:  #FFFFFF;   /* raised sheet (cards, panels)          */\n  --paper-low:   #F1F3F8;   /* recessed (wells, inputs)              */\n  --paper-deep:  #F3F5F9;   /* rails, footers                        */\n\n  /* ---------- INK (cool) ---------- */\n  --ink:         #16181D;\n  --ink-2:       #4A4F5A;\n  --ink-3:       #7C828F;\n  --ink-4:       #AEB4C1;\n  --rule:        rgba(22, 24, 29, 0.10);\n  --rule-strong: rgba(22, 24, 29, 0.22);\n\n  /* ---------- THE THREAD = LIGHT ----------\n     The idea is a fiber of light moving through states.\n     Glow appears ONLY where the thread is the content:\n     landing hero, state lens/spectrum, Explore's spine,\n     Deep's movement strip, Lineage's braid.\n     Everywhere else: flat white, ink, hairlines.          */\n  --st-rough:    #A3B4EE;   /* scattered cloud                       */\n  --st-explore:  #3D68EE;   /* strands gathering                     */\n  --st-deep:     #4F46E5;   /* the focused core                      */\n  --st-evolve:   #6D5BE8;   /* the return                            */\n  --st-compare:  #7C5CEE;   /* interference                          */\n  --st-brief:    #7C3AED;   /* sealed                                */\n\n  --thread:      #4F46E5;   /* default fiber ink                     */\n  --thread-ink:  #4338CA;\n  --thread-soft: rgba(79, 70, 229, 0.10);\n  --thread-hair: rgba(79, 70, 229, 0.35);\n  --lumen:       0 0 0 3px rgba(79, 70, 229, 0.14), 0 0 14px rgba(79, 70, 229, 0.45);\n\n  /* ---------- REGISTERS (aperture, not branding) ---------- */\n  --air-tint:    #F3F7FE;   /* Explore ground \u2014 blue-washed ice      */\n  --air-ink:     #46557A;\n  --air-head:    #22304E;\n  --air-label:   #5A6B94;\n  --air-accent:  #3D68EE;\n  --air-soft:    rgba(61, 104, 238, 0.08);\n  --air-rule:    rgba(70, 85, 122, 0.20);\n  --air-rule-soft: rgba(70, 85, 122, 0.14);\n\n  --press-tint:  #F4F3FA;   /* Deep ground \u2014 indigo-washed           */\n  --press-ink:   #474368;\n  --press-head:  #221F3A;\n  --press-label: #6E6A92;\n  --press-accent:#4F46E5;\n  --press-soft:  rgba(79, 70, 229, 0.07);\n  --press-rule:  rgba(74, 70, 120, 0.22);\n  --press-rule-soft: rgba(74, 70, 120, 0.14);\n\n  /* ---------- SEMANTICS (doctrine-bound) ---------- */\n  --evidence:    #2E7D5B;\n  --evidence-soft: rgba(46, 125, 91, 0.09);\n  --absence:     #7C828F;   /* gaps \u2014 dashed gray, never a warning   */\n\n  /* Score bands \u2014 the pill ONLY.                            */\n  --band-high:   #2E7D5B;\n  --band-mid:    #4A6FA5;\n  --band-low:    #A87E2F;\n  --band-weak:   #A34A38;\n  --band-none:   #7C828F;\n\n  /* ---------- TYPE \u2014 THREE VOICES ----------\n     Display/Author = Fraunces        (the analyst speaks)\n     Interface      = IBM Plex Sans   (the product speaks)\n     Instrument     = IBM Plex Mono   (the machine speaks)  */\n  --font-author:     'Fraunces', Georgia, 'Times New Roman', serif;\n  --font-interface:  'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;\n  --font-instrument: 'IBM Plex Mono', ui-monospace, Menlo, monospace;\n\n  /* Scale \u2014 4px baseline, 10px floor. */\n  --fs-10: 10px;\n  --fs-11: 11px;\n  --fs-12: 12.5px;\n  --fs-14: 14px;\n  --fs-15: 15px;\n  --fs-17: 17px;\n  --fs-21: 21px;\n  --fs-26: 26px;\n  --fs-34: 36px;\n  --fs-44: 48px;\n\n  --track-eyebrow: 0.14em;\n  --measure: 68ch;\n\n  /* ---------- SHAPE ---------- */\n  --r-1: 3px;\n  --r-2: 6px;\n  --r-3: 8px;\n  --overlay-shadow: 0 4px 24px rgba(22, 24, 29, 0.10);\n\n  /* ---------- MOTION \u2014 orientation, never judgment ---------- */\n  --t-fast: 160ms;\n  --t-move: 200ms;\n  --t-slow: 240ms;\n  --ease:   cubic-bezier(0.2, 0, 0, 1);\n\n  /* ---------- STRUCTURE ---------- */\n  --rail-w: 216px;\n  --rail-w-min: 56px;\n  --spine-x: 28px;\n}\n\n/* ============================================================\n   BASE\n   ============================================================ */\n* { box-sizing: border-box; margin: 0; padding: 0; }\n\nhtml { background: var(--paper); }\n\nbody {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  line-height: 1.7;\n  color: var(--ink);\n  background: var(--paper);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\n::selection { background: var(--thread-soft); }\n\na { color: inherit; }\n\n/* ---------- TYPE VOICES ---------- */\n.v-author {\n  font-family: var(--font-author);\n  font-weight: 400;\n  line-height: 1.55;\n}\n.v-author-italic {\n  font-family: var(--font-author);\n  font-style: italic;\n  font-weight: 400;\n}\n.v-instrument {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  line-height: 1.6;\n}\n.eyebrow {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-11);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n/* ---------- THE STATE LENS ----------\n   One state in focus at a time. The current state is a lit\n   dot with its label; the others are unlabeled ghost dots \u2014\n   past filled, future hollow. The full journey lives in\n   Lineage, never unrolled here.                             */\n.statelens {\n  display: inline-flex;\n  align-items: center;\n  gap: 9px;\n}\n.statelens .sl-dot {\n  width: 5px; height: 5px;\n  border-radius: 50%;\n  flex: none;\n  display: inline-block;\n  text-decoration: none;\n}\n.statelens .sl-dot.past { background: var(--ink-4); }\n.statelens .sl-dot.open { background: transparent; border: 1px solid var(--ink-4); }\n.statelens .sl-dot:hover { background: var(--ink-3); }\n.statelens .sl-here {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  text-decoration: none;\n}\n.statelens .sl-here .sl-core {\n  width: 9px; height: 9px;\n  border-radius: 50%;\n  background: var(--st-color, var(--thread));\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-color, var(--thread)) 14%, transparent),\n              0 0 12px color-mix(in srgb, var(--st-color, var(--thread)) 50%, transparent);\n  flex: none;\n}\n.statelens .sl-label {\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.14em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--st-color, var(--thread));\n}\n\n/* state color helpers */\n.st-rough   { --st-color: var(--st-rough); }\n.st-explore { --st-color: var(--st-explore); }\n.st-deep    { --st-color: var(--st-deep); }\n.st-evolve  { --st-color: var(--st-evolve); }\n.st-compare { --st-color: var(--st-compare); }\n.st-brief   { --st-color: var(--st-brief); }\n\n/* ---------- SHEETS & RULES ---------- */\n.sheet {\n  background: var(--paper-high);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.well {\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-3);\n}\n.rule-h { border: none; border-top: 1px solid var(--rule); }\n\n/* ---------- SCORE PILL ----------\n   The ONLY place band color exists. Never naked.            */\n.score-pill {\n  display: inline-flex;\n  align-items: baseline;\n  gap: 6px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-12);\n  font-weight: 600;\n  padding: 2px 9px;\n  border-radius: var(--r-1);\n  border: 1px solid var(--rule);\n  background: var(--paper-high);\n  color: var(--ink);\n}\n.score-pill .sp-band {\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  align-self: center;\n  flex: none;\n}\n.sp-band.high { background: var(--band-high); }\n.sp-band.mid  { background: var(--band-mid); }\n.sp-band.low  { background: var(--band-low); }\n.sp-band.weak { background: var(--band-weak); }\n\n/* ---------- EVIDENCE ---------- */\n.evidence-link {\n  color: var(--evidence);\n  text-decoration: underline;\n  text-decoration-thickness: 1px;\n  text-underline-offset: 3px;\n  text-decoration-color: rgba(46, 125, 91, 0.5);\n  cursor: pointer;\n}\n.evidence-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.04em;\n  color: var(--evidence);\n  background: var(--evidence-soft);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ---------- ABSENCE ---------- */\n.absence-panel {\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-3);\n  background: transparent;\n  color: var(--ink-2);\n}\n.absence-chip {\n  display: inline-flex;\n  font-family: var(--font-instrument);\n  font-size: var(--fs-10);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  color: var(--absence);\n  border: 1px dashed var(--rule-strong);\n  border-radius: var(--r-1);\n  padding: 1px 7px;\n}\n\n/* ---------- CONTROLS ---------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  font-family: var(--font-interface);\n  font-size: var(--fs-14);\n  font-weight: 500;\n  padding: 8px 18px;\n  border-radius: var(--r-2);\n  border: 1px solid var(--rule-strong);\n  background: var(--paper-high);\n  color: var(--ink);\n  cursor: pointer;\n  transition: background var(--t-fast) var(--ease),\n              border-color var(--t-fast) var(--ease);\n}\n.btn:hover { background: var(--paper-low); }\n.btn-primary {\n  background: var(--ink);\n  border-color: var(--ink);\n  color: var(--paper-high);\n}\n.btn-primary:hover { background: #2A2E38; border-color: #2A2E38; }\n.btn-quiet {\n  border-color: transparent;\n  background: transparent;\n  color: var(--ink-2);\n}\n.btn-quiet:hover { background: var(--paper-low); color: var(--ink); }\n\ninput[type=\"text\"], textarea {\n  font-family: var(--font-interface);\n  font-size: var(--fs-15);\n  color: var(--ink);\n  background: var(--paper-low);\n  border: 1px solid var(--rule);\n  border-radius: var(--r-2);\n  padding: 10px 14px;\n  width: 100%;\n  outline: none;\n  transition: border-color var(--t-fast) var(--ease);\n}\ninput[type=\"text\"]:focus, textarea:focus { border-color: var(--rule-strong); }\n::placeholder { color: var(--ink-4); }\n\n/* ---------- MOTION GRAMMAR ---------- */\n@media (prefers-reduced-motion: no-preference) {\n  .m-along-fwd  { animation: mAlongFwd  var(--t-move) var(--ease) both; }\n  .m-along-back { animation: mAlongBack var(--t-move) var(--ease) both; }\n  .m-widen      { animation: mWiden     var(--t-move) var(--ease) both; }\n  .m-pressure   { animation: mPressure  var(--t-move) var(--ease) both; }\n  .m-zoom-out   { animation: mZoomOut   var(--t-slow) var(--ease) both; }\n  .m-pickup     { animation: mPickup    var(--t-move) var(--ease) both; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .m-along-fwd, .m-along-back, .m-widen,\n  .m-pressure, .m-zoom-out, .m-pickup {\n    animation: mFade var(--t-fast) linear both;\n  }\n}\n@keyframes mAlongFwd  { from { opacity: 0; transform: translateX(22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mAlongBack { from { opacity: 0; transform: translateX(-22px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mWiden     { from { opacity: 0; transform: scale(0.985); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPressure  { from { opacity: 0; transform: scale(1.012) translateY(-4px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mZoomOut   { from { opacity: 0; transform: scale(1.04); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mPickup    { from { opacity: 0; transform: translateY(10px); }\n                        to   { opacity: 1; transform: none; } }\n@keyframes mFade      { from { opacity: 0; } to { opacity: 1; } }\n\n<\/style>\n<style>\n/* ============================================================\n   ILC \u00b7 Cold Light \u2014 shared room chrome\n   Linked by every room mockup after ../tokens.css.\n   The chrome IS the continuity: rail (global memory),\n   topbar, idea context with the STATE LENS (one state in\n   focus; the journey lives in Lineage).\n   ============================================================ */\n\nbody { display: flex; min-height: 100vh; }\n\n/* ---------- rail ---------- */\n.rail {\n  width: var(--rail-w); flex: none;\n  background: var(--paper-deep);\n  border-right: 1px solid var(--rule);\n  display: flex; flex-direction: column;\n  padding: 20px 12px 16px;\n  position: sticky; top: 0; height: 100vh;\n}\n.rail-brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 22px; }\n.rail-brand .rb-name { font-family: var(--font-author); font-weight: 500; font-size: 17px; }\n.rail-nav { display: flex; flex-direction: column; gap: 2px; }\n.rail-item {\n  display: flex; align-items: center; gap: 11px;\n  font-family: var(--font-interface); font-size: var(--fs-14); font-weight: 500;\n  color: var(--ink-2); background: none; border: none; cursor: pointer;\n  padding: 8px 10px; border-radius: var(--r-2); text-align: left;\n  text-decoration: none;\n}\n.rail-item:hover { background: rgba(22,24,29,0.05); color: var(--ink); }\n.rail-item.is-active { background: var(--paper-high); color: var(--ink); border: 1px solid var(--rule); padding: 7px 9px; }\n.rail-item svg { flex: none; stroke: currentColor; }\n.rail-spacer { flex: 1; }\n.rail-util { display: flex; flex-direction: column; gap: 1px; padding-top: 12px; border-top: 1px solid var(--rule); }\n.rail-util .rail-item { font-size: var(--fs-12); font-weight: 400; color: var(--ink-3); padding: 5px 10px; }\n.rail-account { display: flex; align-items: center; gap: 9px; padding: 12px 10px 0; }\n.rail-account .ra-dot {\n  width: 22px; height: 22px; border-radius: 50%; flex: none;\n  background: var(--paper-high); border: 1px solid var(--rule-strong);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-instrument); font-size: 10px; color: var(--ink-2);\n}\n.rail-account .ra-mail { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n/* ---------- main column ---------- */\n.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }\n.topbar {\n  height: 52px; flex: none;\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 0 28px; border-bottom: 1px solid var(--rule);\n  background: var(--paper);\n  position: sticky; top: 0; z-index: 30;\n}\n.topbar .tp-room { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.topbar .tp-status { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.06em; color: var(--ink-3); }\n.topbar .tp-status b { color: var(--ink-2); font-weight: 600; }\n\n/* ---------- thread context ---------- */\n.threadctx { background: var(--paper); border-bottom: 1px solid var(--rule); position: sticky; top: 52px; z-index: 29; }\n.threadctx-inner { display: flex; align-items: center; gap: 28px; padding: 12px 28px 10px; }\n.threadctx .tc-title { min-width: 0; }\n.threadctx .tt-name { font-family: var(--font-author); font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.threadctx .tt-meta { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-3); text-transform: uppercase; margin-top: 1px; }\n.threadctx .statelens { flex: none; margin-left: 16px; }\n.threadctx .tc-journey { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.08em; color: var(--ink-4); text-transform: uppercase; margin-left: 16px; }\n.threadctx .tc-journey a { color: var(--ink-3); }\n.threadctx .tc-close { margin-left: auto; }\n\n/* ---------- room scaffold ---------- */\n.room { flex: 1; padding: 44px 48px 110px; }\n.room[data-register=\"air\"]   { background: var(--air-tint); }\n.room[data-register=\"press\"] { background: var(--press-tint); }\n.room-inner { max-width: 880px; margin: 0 auto; }\n.room-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.room-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-34); line-height: 1.2; margin: 10px 0 6px; }\n.room-lede { font-size: var(--fs-15); color: var(--ink-2); max-width: var(--measure); }\n\n.room[data-register=\"air\"] .room-title { font-weight: 400; color: #22304E; }\n.room[data-register=\"air\"] .room-lede { color: var(--air-ink); line-height: 1.85; }\n.room[data-register=\"air\"] .room-eyebrow { color: #5A6B94; }\n.room[data-register=\"press\"] .room-title { font-weight: 600; color: #221F3A; }\n.room[data-register=\"press\"] .room-lede { color: var(--press-ink); line-height: 1.55; }\n.room[data-register=\"press\"] .room-eyebrow { color: #6E6A92; }\n\n/* ---------- cards ---------- */\n.card { background: var(--paper-high); border: 1px solid var(--rule); border-radius: var(--r-3); padding: 22px 24px; }\n.card .c-eyebrow { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }\n.card h3 { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 8px 0 6px; }\n.card p { font-size: var(--fs-14); color: var(--ink-2); }\n\n/* ---------- the page spine (content sections) ---------- */\n.spined { position: relative; padding-left: 46px; }\n.spined::before { content: \"\"; position: absolute; left: 18px; top: 8px; bottom: 8px; width: 1px; background: var(--rule-strong); }\n.spined .sp-sec { position: relative; padding-bottom: 44px; }\n.spined .sp-sec::before {\n  content: \"\"; position: absolute; left: -32.5px; top: 7px;\n  width: 10px; height: 10px; border-radius: 50%;\n  background: var(--paper); border: 1.5px solid var(--rule-strong);\n}\n.spined .sp-sec.is-here::before { background: var(--thread); border-color: var(--thread); }\n.sp-label { font-family: var(--font-instrument); font-size: var(--fs-11); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }\n.sp-sec.is-here > .sp-label { color: var(--ink); font-weight: 600; }\n.sp-title { font-family: var(--font-author); font-weight: 500; font-size: var(--fs-21); margin: 6px 0 4px; }\n\n/* register spine tints \u2014 the current section is lit (a key moment:\n   the spine is the thread inside the room) */\n.spined .sp-sec.is-here::before { box-shadow: 0 0 0 3px rgba(79,70,229,0.13), 0 0 12px rgba(79,70,229,0.45); }\n.room[data-register=\"air\"] .spined::before { background: rgba(70,85,122,0.3); }\n.room[data-register=\"air\"] .spined .sp-sec::before { background: var(--air-tint); border-color: rgba(70,85,122,0.45); }\n.room[data-register=\"air\"] .spined .sp-sec.is-here::before { background: var(--st-explore); border-color: var(--st-explore); box-shadow: 0 0 0 3px rgba(61,104,238,0.13), 0 0 12px rgba(61,104,238,0.5); }\n.room[data-register=\"air\"] .sp-label { color: #5A6B94; }\n.room[data-register=\"press\"] .spined::before { background: rgba(74,70,120,0.3); }\n.room[data-register=\"press\"] .spined .sp-sec::before { background: var(--press-tint); border-color: rgba(74,70,120,0.45); }\n.room[data-register=\"press\"] .spined .sp-sec.is-here::before { background: var(--st-deep); border-color: var(--st-deep); }\n.room[data-register=\"press\"] .sp-label { color: #6E6A92; }\n\n/* ---------- footer ---------- */\n.room-foot { margin-top: 64px; padding-top: 16px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 20px; }\n.room-foot p { font-family: var(--font-instrument); font-size: var(--fs-10); letter-spacing: 0.06em; color: var(--ink-4); }\n.room-foot a { color: var(--ink-3); }\n\n/* ---------- utility ---------- */\n.stack-8  > * + * { margin-top: 8px; }\n.stack-14 > * + * { margin-top: 14px; }\n.stack-18 > * + * { margin-top: 18px; }\n.row { display: flex; align-items: center; gap: 12px; }\n\n<\/style>\n<style>\n  /* pressure strip \u2014 what the last read established, carried into the return */\n  .pstrip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 34px; background: var(--press-tint); border: 1px solid rgba(74,70,120,0.2); border-radius: var(--r-3); overflow: hidden; }\n  .pcell { padding: 16px 20px; }\n  .pcell + .pcell { border-left: 1px solid rgba(74,70,120,0.16); }\n  .pcell .p-k { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #6E6A92; }\n  .pcell .p-v { font-size: var(--fs-14); color: var(--press-ink); margin-top: 5px; line-height: 1.55; }\n  .pcell .p-v b { color: var(--ink); font-weight: 600; }\n\n  /* work row: versions rail \u00b7 the canvas \u00b7 the x-ray */\n  .workrow { display: grid; grid-template-columns: 200px 1fr 300px; gap: 18px; margin-top: 18px; align-items: start; }\n\n  /* versions rail: the thread doubling back */\n  .vrail { padding: 18px 18px 20px; }\n  .vrail .vr-h { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }\n  .vline { position: relative; padding-left: 18px; }\n  .vline::before { content: \"\"; position: absolute; left: 4.5px; top: 6px; bottom: 6px; width: 1px; background: var(--rule-strong); }\n  .vnode { position: relative; padding-bottom: 18px; }\n  .vnode::before { content: \"\"; position: absolute; left: -18px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: var(--paper-high); border: 1.5px solid var(--rule-strong); }\n  .vnode.is-here::before { background: var(--thread); border-color: var(--thread); }\n  .vnode .vn-name { font-family: var(--font-instrument); font-size: var(--fs-11); color: var(--ink-2); letter-spacing: 0.04em; }\n  .vnode.is-here .vn-name { color: var(--ink); font-weight: 600; }\n  .vnode .vn-meta { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-4); margin-top: 1px; }\n  .vnode.is-next .vn-name { color: var(--ink-3); }\n  .vnode.is-next::before { border-style: dashed; background: var(--paper-high); border-color: var(--ink-4); }\n\n  /* the canvas: the idea, its load-bearing parts tagged */\n  .canvas { padding: 26px 30px; background: var(--air-tint); border: 1px solid rgba(70,85,122,0.22); border-radius: var(--r-3); }\n  .canvas .cv-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }\n  .canvas .cv-k { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #5A6B94; }\n  .canvas .cv-edit { font-family: var(--font-instrument); font-size: 10px; color: var(--ink-3); letter-spacing: 0.05em; }\n  .canvas .cv-text { font-family: var(--font-author); font-size: 18px; line-height: 2.0; color: #24313D; }\n  .part { text-decoration: none; border-bottom: 1px solid rgba(70,85,122,0.45); padding-bottom: 1px; position: relative; cursor: text; }\n  .part .part-tag {\n    font-family: var(--font-instrument); font-size: 8.5px; letter-spacing: 0.1em;\n    text-transform: uppercase; color: #5A6B94; display: inline-block;\n    vertical-align: super; margin-left: 3px; font-style: normal;\n  }\n  .part.is-changed { border-bottom: 2px solid var(--ink); }\n  .part.is-changed .part-tag::after { content: \" \u00b7 changed\"; color: var(--ink); }\n  .canvas .cv-note { font-family: var(--font-instrument); font-size: 10px; color: #5A6B94; letter-spacing: 0.05em; margin-top: 16px; }\n\n  /* the x-ray: what the last read pressured, per part */\n  .xray { padding: 18px 20px; }\n  .xray .xr-h { font-family: var(--font-instrument); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink
